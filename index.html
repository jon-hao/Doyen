<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
  />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Doyen Camera</title>
  <style>
    :root {
      color-scheme: dark;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      height: 100%;
      background: #000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overflow: hidden;
      touch-action: manipulation;
    }

    #app {
      position: relative;
      width: 100%;
      height: 100%;
      background: #000;
    }

    #preview {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: #000;
    }

    #overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      padding: 24px 20px calc(28px + var(--safe-bottom));
      pointer-events: none;
    }

    #toast {
      min-height: 24px;
      margin-bottom: 18px;
      padding: 8px 14px;
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.55);
      color: #fff;
      font-size: 14px;
      opacity: 0;
      transition: opacity 0.2s ease;
      pointer-events: none;
    }

    #toast.show {
      opacity: 1;
    }

    #toast.ok {
      background: rgba(22, 163, 74, 0.85);
    }

    #toast.err {
      background: rgba(220, 38, 38, 0.85);
    }

    #shutter {
      pointer-events: auto;
      width: 78px;
      height: 78px;
      border-radius: 50%;
      border: 5px solid #fff;
      background: transparent;
      padding: 0;
      display: grid;
      place-items: center;
    }

    #shutter::before {
      content: "";
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: #fff;
    }

    #shutter:active::before {
      transform: scale(0.92);
      opacity: 0.75;
    }

    #shutter:disabled {
      opacity: 0.4;
    }

    #gate {
      position: absolute;
      inset: 0;
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 14px;
      padding: 32px;
      text-align: center;
      color: #fff;
      background: #000;
    }

    #gate.show {
      display: flex;
    }

    #gate h1 {
      margin: 0;
      font-size: 22px;
      font-weight: 600;
    }

    #gate p {
      margin: 0;
      max-width: 28em;
      line-height: 1.5;
      color: rgba(255, 255, 255, 0.72);
      font-size: 15px;
    }

    #startBtn,
    #retryBtn {
      margin-top: 8px;
      border: 0;
      border-radius: 12px;
      padding: 12px 18px;
      font-size: 16px;
      font-weight: 600;
      color: #111;
      background: #fff;
    }

    #secureHint {
      display: none;
      margin-top: 8px;
      font-size: 13px;
      color: #fbbf24;
    }

    canvas {
      display: none;
    }
  </style>
</head>
<body>
  <div id="app">
    <video id="preview" playsinline autoplay muted></video>
    <canvas id="shot"></canvas>

    <div id="overlay">
      <div id="toast"></div>
      <button id="shutter" type="button" aria-label="拍照" disabled></button>
    </div>

    <div id="gate" class="show">
      <h1>Doyen</h1>
      <p>点击下方按钮开启相机。拍照后可保存或分享到相册。</p>
      <p id="secureHint">
        当前不是 HTTPS / localhost，iPhone 可能无法调用相机。请用本地服务器或 HTTPS 打开本页面。
      </p>
      <button id="startBtn" type="button">开启相机</button>
      <button id="retryBtn" type="button" hidden>重试</button>
    </div>
  </div>

  <script>
    (function () {
      const video = document.getElementById("preview");
      const canvas = document.getElementById("shot");
      const shutter = document.getElementById("shutter");
      const toast = document.getElementById("toast");
      const gate = document.getElementById("gate");
      const startBtn = document.getElementById("startBtn");
      const retryBtn = document.getElementById("retryBtn");
      const secureHint = document.getElementById("secureHint");

      let stream = null;
      let toastTimer = null;

      function isSecureEnough() {
        return (
          window.isSecureContext ||
          location.protocol === "https:" ||
          location.hostname === "localhost" ||
          location.hostname === "127.0.0.1"
        );
      }

      if (!isSecureEnough()) {
        secureHint.style.display = "block";
      }

      function showToast(message, type) {
        toast.textContent = message;
        toast.className = "show" + (type ? " " + type : "");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(function () {
          toast.className = "";
        }, 1800);
      }

      async function startCamera() {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          throw new Error("当前浏览器不支持相机");
        }
        if (!isSecureEnough()) {
          throw new Error("需要 HTTPS 或 localhost 才能使用相机");
        }

        if (stream) {
          stream.getTracks().forEach(function (track) {
            track.stop();
          });
        }

        const constraints = {
          audio: false,
          video: {
            facingMode: { ideal: "environment" },
            width: { ideal: 1920 },
            height: { ideal: 1080 },
          },
        };

        try {
          stream = await navigator.mediaDevices.getUserMedia(constraints);
        } catch (err) {
          stream = await navigator.mediaDevices.getUserMedia({
            audio: false,
            video: true,
          });
        }

        video.srcObject = stream;
        await video.play();
        gate.classList.remove("show");
        shutter.disabled = false;
      }

      function captureFrame() {
        const width = video.videoWidth;
        const height = video.videoHeight;
        if (!width || !height) {
          throw new Error("画面还没就绪，请稍后再试");
        }

        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(video, 0, 0, width, height);
        return canvas;
      }

      function canvasToBlob(sourceCanvas) {
        return new Promise(function (resolve, reject) {
          sourceCanvas.toBlob(
            function (blob) {
              if (blob) resolve(blob);
              else reject(new Error("生成图片失败"));
            },
            "image/jpeg",
            0.92
          );
        });
      }

      function downloadBlob(blob, filename) {
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(function () {
          URL.revokeObjectURL(url);
        }, 1000);
      }

      async function savePhoto(blob, filename) {
        const file = new File([blob], filename, { type: "image/jpeg" });

        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          try {
            await navigator.share({
              files: [file],
              title: "Doyen",
            });
            showToast("请选择存储到照片", "ok");
            return;
          } catch (err) {
            if (err && err.name === "AbortError") {
              showToast("已取消");
              return;
            }
          }
        }

        downloadBlob(blob, filename);
        showToast("已开始保存图片", "ok");
      }

      async function onShutter() {
        shutter.disabled = true;
        try {
          const frame = captureFrame();
          const blob = await canvasToBlob(frame);
          const name =
            "doyen-" +
            new Date().toISOString().replace(/[:.]/g, "-") +
            ".jpg";
          await savePhoto(blob, name);
        } catch (err) {
          showToast(err.message || "拍照失败", "err");
        } finally {
          shutter.disabled = false;
        }
      }

      async function onStart() {
        startBtn.disabled = true;
        retryBtn.hidden = true;
        try {
          await startCamera();
        } catch (err) {
          gate.classList.add("show");
          retryBtn.hidden = false;
          showToast(err.message || "无法打开相机", "err");
        } finally {
          startBtn.disabled = false;
        }
      }

      startBtn.addEventListener("click", onStart);
      retryBtn.addEventListener("click", onStart);
      shutter.addEventListener("click", onShutter);

      document.addEventListener("visibilitychange", function () {
        if (document.hidden || !stream) return;
        video.play().catch(function () {});
      });
    })();
  </script>
</body>
</html>
