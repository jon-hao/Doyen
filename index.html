<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
  />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Doyen Camera</title>
  <style>
    :root {
      color-scheme: dark;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-top: env(safe-area-inset-top, 0px);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      background: #000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overflow: hidden;
      touch-action: manipulation;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }

    #app {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      background: #000;
      overflow: hidden;
    }

    #stage {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    /* iOS Safari 常忽略 video 的 object-fit；铺满改由 JS transform scale 完成 */
    #preview {
      position: absolute;
      top: 50%;
      left: 50%;
      display: block;
      margin: 0;
      padding: 0;
      border: 0;
      background: #000;
      width: auto;
      height: auto;
      max-width: none;
      max-height: none;
      min-width: 100%;
      min-height: 100%;
      transform: translate(-50%, -50%);
      transform-origin: center center;
      transition: none;
      object-fit: fill;
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
    }


    #overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      padding: 20px 16px calc(28px + var(--safe-bottom));
      pointer-events: none;
    }


    #toast {
      position: absolute;
      left: 50%;
      top: calc(12px + var(--safe-top));
      bottom: auto;
      transform: translateX(-50%);
      min-height: 24px;
      margin-bottom: 0;
      padding: 10px 16px;
      border-radius: 14px;
      background: rgba(0, 0, 0, 0.55);
      color: #fff;
      font-size: 14px;
      line-height: 1.4;
      opacity: 0;
      transition: opacity 0.2s ease;
      pointer-events: none;
      text-align: center;
      max-width: min(92vw, 360px);
      z-index: 20;
    }

    #toast.show { opacity: 1; }
    #toast.ok { background: rgba(22, 163, 74, 0.92); }
    #toast.err { background: rgba(220, 38, 38, 0.92); }

    #controls {
      pointer-events: auto;
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      width: 100%;
    }

    #controls.show { display: flex; }

    #focalRow {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    #focalRow.front-locked #modeBar,
    #focalRow.front-locked #zoomRow {
      display: none;
    }

    #zoomRow {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    #modeBar {
      display: flex;
      gap: 4px;
      padding: 4px;
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.38);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .mode-btn {
      min-width: 72px;
      height: 34px;
      border: 0;
      border-radius: 999px;
      background: transparent;
      color: rgba(255, 255, 255, 0.72);
      font-size: 13px;
      font-weight: 600;
    }

    .mode-btn.active {
      background: rgba(255, 255, 255, 0.18);
      color: #fff;
    }

    #zoomBar {
      display: flex;
      gap: 6px;
      padding: 6px 8px;
      border-radius: 22px;
      background: rgba(0, 0, 0, 0.38);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .zoom-btn {
      min-width: 54px;
      height: 48px;
      border: 0;
      border-radius: 14px;
      background: transparent;
      color: rgba(255, 255, 255, 0.8);
      font-size: 12px;
      font-weight: 600;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1px;
      line-height: 1.15;
      padding: 0 6px;
    }

    .zoom-btn .mm {
      font-size: 10px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.55);
    }

    .zoom-btn.active {
      background: rgba(255, 255, 255, 0.2);
      color: #f5d76e;
    }

    .zoom-btn.active .mm {
      color: rgba(245, 215, 110, 0.8);
    }

    #bottomRow {
      width: min(360px, 100%);
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
    }

    #shutter {
      width: 78px;
      height: 78px;
      border-radius: 50%;
      border: 5px solid #fff;
      background: transparent;
      padding: 0;
      display: grid;
      place-items: center;
      justify-self: center;
    }

    #shutter::before {
      content: "";
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: #fff;
    }

    #shutter:active::before {
      transform: scale(0.92);
      opacity: 0.75;
    }

    #shutter:disabled { opacity: 0.35; }

    #flipBtn {
      justify-self: end;
      width: 48px;
      height: 48px;
      border: 0;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.18);
      color: #fff;
      font-size: 22px;
      line-height: 1;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    #flipBtn:disabled { opacity: 0.35; }

    #gate {
      position: absolute;
      inset: 0;
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 12px;
      padding: 28px 24px;
      text-align: center;
      color: #fff;
      background: #000;
      z-index: 5;
      touch-action: manipulation;
    }

    #gate.show { display: flex; }

    #gate h1 {
      margin: 0;
      font-size: 22px;
      font-weight: 600;
    }

    #gate p {
      margin: 0;
      max-width: 20em;
      line-height: 1.5;
      color: rgba(255, 255, 255, 0.72);
      font-size: 15px;
    }

    #secureHint {
      display: none;
      font-size: 13px;
      color: #fbbf24;
    }

    #probe {
      position: absolute;
      inset: 0;
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 12px;
      padding: 28px 20px calc(28px + var(--safe-bottom));
      text-align: center;
      color: #fff;
      background: rgba(0, 0, 0, 0.96);
      z-index: 6;
      touch-action: manipulation;
    }

    #probe.show { display: flex; }

    #probe h2 {
      margin: 0;
      font-size: 22px;
      font-weight: 600;
    }

    #probeStatus {
      margin: 0;
      max-width: 22em;
      line-height: 1.5;
      color: rgba(255, 255, 255, 0.72);
      font-size: 15px;
    }

    #probeProgress {
      width: min(260px, 72vw);
      height: 6px;
      margin-top: 4px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.12);
      overflow: hidden;
    }

    #probeProgress > i {
      display: block;
      height: 100%;
      width: 0%;
      border-radius: inherit;
      background: #4ade80;
      transition: width 0.25s ease;
    }

    #probeProgress.indeterminate > i {
      width: 36%;
      animation: probeSlide 1.1s ease-in-out infinite;
    }

    @keyframes probeSlide {
      0% { transform: translateX(-120%); }
      100% { transform: translateX(320%); }
    }

    #probeError {
      margin: 8px 0 0;
      max-width: 22em;
      font-size: 14px;
      line-height: 1.55;
      color: #fca5a5;
    }

    #probeError[hidden] { display: none; }

    #probeRetryHint {
      margin: 4px 0 0;
      font-size: 12px;
      color: rgba(255, 255, 255, 0.45);
    }

    #probeRetryHint[hidden] { display: none; }


    #flash {
      position: absolute;
      inset: 0;
      background: #fff;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.08s ease;
    }

    #flash.show { opacity: 0.85; }


    #coachSlot {
      justify-self: start;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      max-width: 110px;
    }

    #coachBtn {
      position: relative;
      isolation: isolate;
      overflow: hidden;
      min-width: 72px;
      height: 48px;
      border: 2px solid rgba(255, 255, 255, 0.28);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.12);
      color: #fff;
      font-size: 13px;
      font-weight: 700;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      padding: 0 12px;
      white-space: nowrap;
      z-index: 0;
      transition:
        transform 0.12s ease,
        border-color 0.2s ease,
        color 0.2s ease,
        background 0.2s ease,
        box-shadow 0.2s ease;
      -webkit-tap-highlight-color: transparent;
    }

    #coachBtn:active:not(:disabled),
    #coachBtn.pressed {
      transform: scale(0.92);
    }

    #coachBtn.pulse {
      animation: coachPulse 0.42s ease;
    }

    @keyframes coachPulse {
      0% { transform: scale(1); }
      35% { transform: scale(0.9); }
      70% { transform: scale(1.04); }
      100% { transform: scale(1); }
    }

    #coachBtn::before {
      content: "";
      position: absolute;
      inset: 0;
      width: var(--coach-progress, 0%);
      background: rgba(74, 222, 128, 0.35);
      z-index: -1;
      transition: width 0.15s linear;
    }

    #coachBtn:disabled {
      opacity: 0.35;
    }

    #coachBtn.loading {
      pointer-events: none;
      border-color: rgba(74, 222, 128, 0.45);
      color: rgba(255, 255, 255, 0.9);
    }

    #coachBtn.active {
      border-color: #4ade80;
      color: #4ade80;
      background: rgba(74, 222, 128, 0.12);
      box-shadow: 0 0 0 1px rgba(74, 222, 128, 0.25);
    }

    #coachHint {
      margin: 0;
      min-height: 14px;
      width: 100%;
      max-width: 108px;
      font-size: 10px;
      line-height: 1.25;
      color: rgba(255, 255, 255, 0.55);
      text-align: center;
    }

    #subjectOverlay {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 2;
      touch-action: manipulation;
    }
    #subjectOverlay.interactive {
      pointer-events: auto;
    }

    canvas#shot { display: none; }

  </style>
</head>
<body>
  <div id="app">
    <div id="stage">
      <video
        id="preview"
        playsinline
        webkit-playsinline
        autoplay
        muted
        disablepictureinpicture
      ></video>
      <canvas id="subjectOverlay"></canvas>
    </div>
    <canvas id="shot"></canvas>
    <div id="flash"></div>

    <div id="overlay">
      <div id="toast"></div>
      <div id="controls">
        <div id="focalRow">
          <div id="modeBar">
            <button type="button" class="mode-btn active" data-mode="landscape">风景</button>
            <button type="button" class="mode-btn" data-mode="portrait">人像</button>
          </div>
          <div id="zoomRow">
            <div id="zoomBar"></div>
          </div>
        </div>
        <div id="bottomRow">
          <div id="coachSlot">
            <button id="coachBtn" type="button" aria-label="辅助拍摄" disabled>辅助拍摄</button>
            <p id="coachHint"></p>
          </div>
          <button id="shutter" type="button" aria-label="拍照" disabled></button>
          <button id="flipBtn" type="button" aria-label="切换摄像头" disabled>⟲</button>
        </div>
      </div>
    </div>

    <div id="gate" role="button" tabindex="0">
      <h1>Doyen</h1>
      <p>轻触开启相机</p>
      <p id="secureHint">需要 HTTPS 才能使用相机</p>
    </div>

    <div id="probe" class="show">
      <h2>环境检测</h2>
      <p id="probeStatus">正在检测…</p>
      <div id="probeProgress"><i id="probeProgressFill"></i></div>
      <p id="probeError" hidden></p>
      <p id="probeRetryHint" hidden>轻触屏幕重试</p>
    </div>
  </div>

  <script>
    (function () {
      const video = document.getElementById("preview");
      const canvas = document.getElementById("shot");
      const shutter = document.getElementById("shutter");
      const flipBtn = document.getElementById("flipBtn");
      const coachBtn = document.getElementById("coachBtn");
      const coachHint = document.getElementById("coachHint");
      const subjectOverlay = document.getElementById("subjectOverlay");
      const toast = document.getElementById("toast");
      const gate = document.getElementById("gate");
      const secureHint = document.getElementById("secureHint");
      const probe = document.getElementById("probe");
      const probeStatus = document.getElementById("probeStatus");
      const probeProgress = document.getElementById("probeProgress");
      const probeProgressFill = document.getElementById("probeProgressFill");
      const probeError = document.getElementById("probeError");
      const probeRetryHint = document.getElementById("probeRetryHint");
      const flash = document.getElementById("flash");
      const controls = document.getElementById("controls");
      const zoomBar = document.getElementById("zoomBar");
      const modeBar = document.getElementById("modeBar");
      const focalRow = document.getElementById("focalRow");

      // 以主摄 ≈24mm 为 1x，焦段换算成相对倍率
      const MODE_PRESETS = {
        landscape: {
          label: "风景",
          defaultZoom: 1,
          focals: [
            { name: "超广", mm: 13, zoom: 0.5 },
            { name: "广角", mm: 24, zoom: 1 },
            { name: "中景", mm: 35, zoom: 1.5 },
            { name: "压缩", mm: 70, zoom: 3 },
          ],
        },
        portrait: {
          label: "人像",
          defaultZoom: 2,
          focals: [
            { name: "环境", mm: 35, zoom: 1.5 },
            { name: "标准", mm: 50, zoom: 2 },
            { name: "经典", mm: 85, zoom: 3.5 },
            { name: "特写", mm: 135, zoom: 5.5 },
          ],
        },
      };

      let stream = null;
      let starting = false;
      let capturing = false;
      let flipping = false;
      let zooming = false;
      let toastTimer = null;
      let facingMode = "environment";
      let shootMode = "landscape";
      let zoomFactor = 1;
      let digitalScale = 1;
      let supportZoom = false;
      let supportLensSwitch = false;
      let hwZoom = { min: 1, max: 1 };
      /** @type {{deviceId:string,label:string,kind:string,base:number}[]} */
      let lenses = [];
      let currentLens = null;
      let currentDeviceId = "";
      /** @type {null | {https:boolean,cameraApi:boolean,webgpu:boolean,transformers:boolean,hfMirror:boolean,assistOk:boolean,detail:string}} */
      let deviceReport = null;

      function currentPresets() {
        return MODE_PRESETS[shootMode] || MODE_PRESETS.landscape;
      }

      function findFocal(factor) {
        const list = currentPresets().focals;
        let best = list[0];
        let bestDiff = Infinity;
        for (let i = 0; i < list.length; i++) {
          const d = Math.abs(list[i].zoom - factor);
          if (d < bestDiff) {
            bestDiff = d;
            best = list[i];
          }
        }
        return best;
      }

      function isSecureEnough() {
        return (
          window.isSecureContext ||
          location.protocol === "https:" ||
          location.hostname === "localhost" ||
          location.hostname === "127.0.0.1"
        );
      }

      function isIOS() {
        return (
          /iPad|iPhone|iPod/.test(navigator.userAgent) ||
          (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1)
        );
      }

      if (!isSecureEnough()) secureHint.style.display = "block";

      function showToast(message, type) {
        toast.textContent = message;
        toast.className = "show" + (type ? " " + type : "");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(function () {
          toast.className = "";
        }, type === "err" ? 4500 : 1800);
      }

      function blinkFlash() {
        flash.classList.add("show");
        setTimeout(function () {
          flash.classList.remove("show");
        }, 90);
      }

      function getTrack() {
        return stream ? stream.getVideoTracks()[0] : null;
      }

      function clamp(n, min, max) {
        return Math.min(max, Math.max(min, n));
      }

      function isFrontLabel(label) {
        const l = (label || "").toLowerCase();
        return (
          l.includes("front") ||
          l.includes("user") ||
          l.includes("facetime") ||
          l.includes("前")
        );
      }

      function classifyDevice(device) {
        const l = (device.label || "").toLowerCase();
        if (l.includes("ultra") || l.includes("超广") || l.includes("0.5")) {
          return { kind: "ultrawide", base: 0.5 };
        }
        if (l.includes("tele") || l.includes("长焦")) {
          if (l.includes("5")) return { kind: "tele5", base: 5 };
          if (l.includes("3")) return { kind: "tele3", base: 3 };
          return { kind: "tele2", base: 2 };
        }
        if (l.includes("triple") || l.includes("dual") || l.includes("wide") || l.includes("后") || l.includes("back")) {
          return { kind: "wide", base: 1 };
        }
        return { kind: "wide", base: 1 };
      }

      function lensName(lens) {
        if (!lens) return "未知";
        if (lens.kind === "ultrawide") return "超广角";
        if (lens.kind === "tele5") return "长焦 5x";
        if (lens.kind === "tele3") return "长焦 3x";
        if (lens.kind === "tele2") return "长焦 2x";
        return "主摄";
      }

      function pickLensForZoom(factor) {
        if (facingMode !== "environment" || !lenses.length) return null;

        const ultra = lenses.find(function (l) { return l.kind === "ultrawide"; });
        const wide = lenses.find(function (l) { return l.kind === "wide"; }) || lenses[0];
        const tele2 = lenses.find(function (l) { return l.kind === "tele2"; });
        const tele3 = lenses.find(function (l) { return l.kind === "tele3"; });
        const tele5 = lenses.find(function (l) { return l.kind === "tele5"; });

        if (factor <= 0.7 && ultra) return ultra;
        if (factor >= 4.5 && tele5) return tele5;
        if (factor >= 2.8 && tele3) return tele3;
        if (factor >= 2.8 && tele5) return tele5;
        if (factor >= 1.7 && tele2) return tele2;
        if (factor >= 1.7 && tele3) return tele3;
        if (factor >= 1.7 && tele5) return tele5;
        return wide;
      }

      function renderFocalButtons() {
        const presets = currentPresets();
        zoomBar.innerHTML = "";
        presets.focals.forEach(function (focal) {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "zoom-btn";
          btn.dataset.zoom = String(focal.zoom);
          btn.innerHTML =
            "<span>" +
            focal.name +
            '</span><span class="mm">' +
            focal.mm +
            "mm</span>";
          btn.addEventListener("click", function () {
            if (facingMode !== "environment") return;
            applyZoomFactor(focal.zoom);
          });
          zoomBar.appendChild(btn);
        });
        updateZoomButtons();
        updateFocalAvailability();
      }

      function updateModeButtons() {
        Array.prototype.forEach.call(
          modeBar.querySelectorAll(".mode-btn"),
          function (btn) {
            btn.classList.toggle("active", btn.dataset.mode === shootMode);
          }
        );
      }

      async function setShootMode(mode) {
        if (!MODE_PRESETS[mode]) return;
        if (facingMode !== "environment") return;
        const prevMode = shootMode;
        shootMode = mode;
        updateModeButtons();
        renderFocalButtons();

        if (coachEngine && coachEngine.setSubjectMode) {
          try {
            await coachEngine.setSubjectMode(shootMode);
          } catch (_) {}
        }
        // 风景 ↔ 人像：策略不同，必须丢掉旧框并重检
        reanalyzeAssistSubject();

        const presets = currentPresets();
        const stillValid = presets.focals.some(function (f) {
          return Math.abs(f.zoom - zoomFactor) < 0.05;
        });
        const nextZoom = stillValid ? zoomFactor : presets.defaultZoom;
        await applyZoomFactor(nextZoom);

        // 变焦流程结束后再清一次，避免旧检测结果写回
        if (prevMode !== shootMode || coachActive) {
          reanalyzeAssistSubject();
        }
      }

      function getStageSize() {
        const stageEl = document.getElementById("stage");
        const vv = window.visualViewport;
        return {
          sw: Math.max(
            1,
            (stageEl && stageEl.clientWidth) ||
              (vv && vv.width) ||
              window.innerWidth ||
              1
          ),
          sh: Math.max(
            1,
            (stageEl && stageEl.clientHeight) ||
              (vv && vv.height) ||
              window.innerHeight ||
              1
          ),
        };
      }

      function layoutVideos() {
        const size = getStageSize();
        const sw = size.sw;
        const sh = size.sh;
        const vw = video.videoWidth | 0;
        const vh = video.videoHeight | 0;

        video.style.position = "absolute";
        video.style.top = "50%";
        video.style.left = "50%";
        video.style.right = "auto";
        video.style.bottom = "auto";
        video.style.margin = "0";
        video.style.padding = "0";
        video.style.border = "0";
        video.style.maxWidth = "none";
        video.style.maxHeight = "none";
        video.style.zIndex = "0";
        // 禁止依赖 object-fit：iOS 上对 <video> 经常失效导致黑框
        video.style.objectFit = "fill";
        video.style.objectPosition = "center center";

        let cover = 1;
        if (vw > 0 && vh > 0) {
          // 元素保持视频原生比例，用 transform scale 做 cover（iOS 可靠）
          video.style.width = vw + "px";
          video.style.height = vh + "px";
          video.style.minWidth = "0";
          video.style.minHeight = "0";
          cover = Math.max(sw / vw, sh / vh);
        } else {
          // 元数据未到：先用 min 边撑满，避免 300×150 小窗
          video.style.width = "auto";
          video.style.height = "auto";
          video.style.minWidth = sw + "px";
          video.style.minHeight = sh + "px";
          cover = 1;
        }

        const zoom = digitalScale > 1.01 ? digitalScale : 1;
        const s = cover * zoom;
        const sx = facingMode === "user" ? -s : s;
        const tf = "translate(-50%, -50%) scale(" + sx + ", " + s + ")";
        video.style.transformOrigin = "center center";
        video.style.transform = tf;
        video.style.webkitTransform = tf;
      }

      function updatePreviewTransform() {
        layoutVideos();
      }

      function scheduleLayoutVideos() {
        layoutVideos();
        requestAnimationFrame(function () {
          layoutVideos();
          requestAnimationFrame(layoutVideos);
        });
        // iOS 切镜头 / 地址栏伸缩后尺寸常晚一拍
        setTimeout(layoutVideos, 50);
        setTimeout(layoutVideos, 200);
        setTimeout(layoutVideos, 500);
      }

      async function resumePreview() {
        if (!stream) return;
        try {
          await video.play();
        } catch (_) {}
        scheduleLayoutVideos();
      }

      function updateZoomButtons() {
        Array.prototype.forEach.call(
          zoomBar.querySelectorAll(".zoom-btn"),
          function (btn) {
            btn.classList.toggle(
              "active",
              Math.abs(Number(btn.dataset.zoom) - zoomFactor) < 0.05
            );
          }
        );
      }

      function updateFocalAvailability() {
        focalRow.classList.toggle("front-locked", facingMode === "user");
      }

      function onVideoGeometry() {
        scheduleLayoutVideos();
      }

      video.addEventListener("loadedmetadata", onVideoGeometry);
      video.addEventListener("loadeddata", onVideoGeometry);
      video.addEventListener("playing", onVideoGeometry);
      video.addEventListener("resize", onVideoGeometry);
      if (typeof ResizeObserver !== "undefined") {
        const stageEl = document.getElementById("stage");
        if (stageEl) {
          new ResizeObserver(function () {
            scheduleLayoutVideos();
          }).observe(stageEl);
        }
      }

      async function openStream(constraints) {
        return navigator.mediaDevices.getUserMedia(constraints);
      }

      async function openCamera(facing, deviceId) {
        const videoConstraint = deviceId
          ? {
              deviceId: { exact: deviceId },
              width: { ideal: 1920 },
              height: { ideal: 1080 },
            }
          : {
              facingMode: { ideal: facing },
              width: { ideal: 1920 },
              height: { ideal: 1080 },
            };

        let next;
        try {
          next = await openStream({ audio: false, video: videoConstraint });
        } catch (_) {
          next = await openStream({
            audio: false,
            video: { facingMode: { ideal: facing } },
          });
        }

        const prev = stream;
        stream = next;
        video.srcObject = stream;
        scheduleLayoutVideos();
        try {
          await video.play();
          scheduleLayoutVideos();
        } catch (err) {
          next.getTracks().forEach(function (t) { t.stop(); });
          stream = prev;
          video.srcObject = prev;
          if (prev) await video.play().catch(function () {});
          throw err;
        }

        if (prev && prev !== stream) {
          prev.getTracks().forEach(function (t) { t.stop(); });
        }

        facingMode = facing;
        const track = getTrack();
        const settings =
          track && typeof track.getSettings === "function" ? track.getSettings() : {};
        currentDeviceId = settings.deviceId || deviceId || "";

        if (facing === "environment" && currentDeviceId) {
          const matched = lenses.find(function (l) {
            return l.deviceId === currentDeviceId;
          });
          if (matched) currentLens = matched;
        } else if (facing === "user") {
          currentLens = null;
        }

        refreshHwZoom();
        digitalScale = 1;
        updatePreviewTransform();
        updateZoomButtons();
        updateFocalAvailability();
      }

      function refreshHwZoom() {
        supportZoom = false;
        hwZoom = { min: 1, max: 1 };
        const track = getTrack();
        if (!track || typeof track.getCapabilities !== "function") return;
        const caps = track.getCapabilities();
        if (caps && caps.zoom) {
          supportZoom = true;
          hwZoom.min = caps.zoom.min;
          hwZoom.max = caps.zoom.max;
        }
      }

      async function discoverLenses() {
        const devices = await navigator.mediaDevices.enumerateDevices();
        const backs = devices.filter(function (d) {
          return d.kind === "videoinput" && d.deviceId && !isFrontLabel(d.label);
        });

        const found = [];
        const used = {};

        backs.forEach(function (device) {
          const info = classifyDevice(device);
          const label = (device.label || "").toLowerCase();
          const distinctive =
            label.includes("ultra") ||
            label.includes("tele") ||
            label.includes("超广") ||
            label.includes("长焦") ||
            label.includes("dual") ||
            label.includes("triple") ||
            label.includes("wide");

          // 即使只有笼统 Back Camera，也先全部收集，后面用实切探测
          const key = distinctive ? info.kind : "back-" + found.length;
          if (used[key] && distinctive) return;
          used[key] = true;
          found.push({
            deviceId: device.deviceId,
            label: device.label || key,
            kind: distinctive ? info.kind : "wide",
            base: distinctive ? info.base : 1,
          });
        });

        // 若多个后置但都标成 wide，按顺序尝试：第1主摄、第2当超广/长焦候选
        if (found.length >= 2 && found.every(function (l) { return l.kind === "wide"; })) {
          found[0].kind = "wide";
          found[0].base = 1;
          found[1].kind = "ultrawide";
          found[1].base = 0.5;
          if (found[2]) {
            found[2].kind = "tele2";
            found[2].base = 2;
          }
          if (found[3]) {
            found[3].kind = "tele5";
            found[3].base = 5;
          }
        }

        lenses = found;
      }

      async function switchToLens(lens) {
        if (!lens || facingMode !== "environment") return false;
        if (currentLens && currentLens.deviceId === lens.deviceId) {
          currentLens = lens;
          return false;
        }

        try {
          await openCamera("environment", lens.deviceId);
          currentLens = lens;
          reanalyzeAssistSubject();
          return true;
        } catch (_) {
          return false;
        }
      }

      async function applyZoomFactor(factor) {
        if (zooming) return;
        if (facingMode !== "environment") return;
        zooming = true;
        zoomFactor = factor;

        try {
          digitalScale = 1;
          refreshHwZoom();

          // 首选：系统 zoom（很多 iPhone 会据此自动换镜）
          if (supportZoom) {
            const track = getTrack();
            const z = clamp(factor, hwZoom.min, hwZoom.max);
            try {
              await track.applyConstraints({ advanced: [{ zoom: z }] });
              digitalScale = 1;
              updatePreviewTransform();
              updateZoomButtons();
              reanalyzeAssistSubject();
              return;
            } catch (_) {
              // 继续尝试切 device / 数字变焦
            }
          }

          // 次选：多 deviceId 时按倍率切物理镜头
          const target = pickLensForZoom(factor);
          let switched = false;
          if (target && (supportLensSwitch || lenses.length >= 2)) {
            switched = await switchToLens(target);
            if (switched) supportLensSwitch = true;
          }

          if (switched) {
            digitalScale = 1;
            refreshHwZoom();
            if (supportZoom) {
              const track = getTrack();
              const base = (currentLens && currentLens.base) || 1;
              const relative = clamp(factor / base, hwZoom.min, hwZoom.max);
              try {
                await track.applyConstraints({ advanced: [{ zoom: relative }] });
              } catch (_) {}
            }
          } else if (factor < 1) {
            digitalScale = 1;
          } else if (Math.abs(factor - 1) < 0.05) {
            digitalScale = 1;
          } else {
            digitalScale = factor;
          }

          updatePreviewTransform();
          updateZoomButtons();
          reanalyzeAssistSubject();
        } finally {
          zooming = false;
        }
      }

      async function initCapabilitiesQuietly() {
        await discoverLenses();
        refreshHwZoom();
        const track = getTrack();

        if (supportZoom && track) {
          try {
            const settings =
              typeof track.getSettings === "function" ? track.getSettings() : {};
            const current =
              typeof settings.zoom === "number" ? settings.zoom : hwZoom.min;
            const test = clamp(
              current + Math.max((hwZoom.max - hwZoom.min) * 0.02, 0.01),
              hwZoom.min,
              hwZoom.max
            );
            await track.applyConstraints({ advanced: [{ zoom: test }] });
            await track.applyConstraints({ advanced: [{ zoom: current }] });
            supportZoom = true;
          } catch (_) {
            supportZoom = false;
          }
        }

        supportLensSwitch = lenses.length >= 2;
        if (supportZoom && hwZoom.min < 0.99 && hwZoom.max > 1.5) {
          supportLensSwitch = true;
        }
      }

      async function checkWebGPU() {
        try {
          if (!navigator.gpu) return { ok: false, detail: "不支持 navigator.gpu" };
          const adapter = await navigator.gpu.requestAdapter();
          if (!adapter) return { ok: false, detail: "无可用 GPU 适配器" };
          return { ok: true, detail: "可用" };
        } catch (err) {
          return {
            ok: false,
            detail: (err && err.message) || "检测失败",
          };
        }
      }

      async function checkAssistRuntime() {
        try {
          const mod = await import(
            "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.18/+esm"
          );
          if (!mod || !mod.ObjectDetector || !mod.FilesetResolver) {
            return { ok: false, detail: "模块不完整" };
          }
          return { ok: true, detail: "轻量检测可用" };
        } catch (err) {
          return {
            ok: false,
            detail: (err && err.message) || "Load failed",
          };
        }
      }

      async function checkModelHosts() {
        // 轻量模型托管在本站 /models，不再依赖 HF
        return {
          ok: true,
          host: "local",
          fromCache: true,
        };
      }

      function cameraProbeDetail(err) {
        const name = (err && err.name) || "";
        const msg = (err && err.message) || "";
        if (name === "NotFoundError" || /Requested device not found/i.test(msg)) {
          return "未找到摄像头";
        }
        if (name === "NotAllowedError" || name === "PermissionDeniedError") {
          return "权限被拒绝";
        }
        if (name === "NotReadableError" || name === "TrackStartError") {
          return "被其他应用占用";
        }
        if (name === "OverconstrainedError") {
          return "无匹配的摄像头";
        }
        if (name === "SecurityError") {
          return "安全限制";
        }
        return msg || name || "打开失败";
      }

      async function checkCameraDevice() {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          return { ok: false, api: false, detail: "不支持 getUserMedia" };
        }

        let media = null;
        try {
          try {
            media = await navigator.mediaDevices.getUserMedia({
              audio: false,
              video: { facingMode: { ideal: "environment" } },
            });
          } catch (firstErr) {
            // 后置失败时再试任意摄像头，避免误报 NotFound
            media = await navigator.mediaDevices.getUserMedia({
              audio: false,
              video: true,
            });
          }

          const track = media.getVideoTracks()[0];
          const label = (track && track.label) || "";
          return {
            ok: true,
            api: true,
            detail: label ? "可用 · " + label : "可用",
          };
        } catch (err) {
          return {
            ok: false,
            api: true,
            detail: cameraProbeDetail(err),
          };
        } finally {
          if (media) {
            media.getTracks().forEach(function (t) {
              t.stop();
            });
          }
        }
      }

      function setProbeProgress(pct, indeterminate) {
        if (!probeProgress || !probeProgressFill) return;
        if (indeterminate) {
          probeProgress.classList.add("indeterminate");
          probeProgressFill.style.width = "36%";
          return;
        }
        probeProgress.classList.remove("indeterminate");
        const p = Math.max(0, Math.min(100, Number(pct) || 0));
        probeProgressFill.style.width = p.toFixed(1) + "%";
      }

      function showProbeFailure(message) {
        probe.classList.add("show");
        gate.classList.remove("show");
        controls.classList.remove("show");
        probeStatus.textContent = "检测未通过";
        setProbeProgress(100, false);
        if (probeError) {
          probeError.hidden = false;
          probeError.textContent = message || "暂时无法进入拍摄";
        }
        if (probeRetryHint) probeRetryHint.hidden = false;
      }

      function friendlyShootBlockReason(httpsOk, camera) {
        if (!httpsOk) {
          return "当前页面不安全，无法使用相机。请用 Chrome 通过 HTTPS 打开后再试。";
        }
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          return "当前浏览器不支持相机功能，请使用桌面版 Chrome 或 Safari 最新版再试。";
        }
        const detail = (camera && camera.detail) || "";
        if (detail === "未找到摄像头" || /未找到|not found/i.test(detail)) {
          return "未检测到摄像头，请确认设备有摄像头，并已允许浏览器访问。";
        }
        if (detail === "权限被拒绝" || /权限|denied|NotAllowed/i.test(detail)) {
          return "还没有相机权限。请在浏览器设置里允许访问摄像头，然后轻触屏幕重试。";
        }
        if (detail === "被其他应用占用" || /占用|NotReadable/i.test(detail)) {
          return "摄像头正被其他应用占用，请关闭后轻触屏幕重试。";
        }
        if (detail === "不支持 getUserMedia") {
          return "当前浏览器不支持相机功能，请使用桌面版 Chrome 或 Safari 最新版再试。";
        }
        if (detail) {
          return "无法使用相机（" + detail + "）。请检查权限后轻触屏幕重试。";
        }
        return "无法使用相机，请检查摄像头与权限后轻触屏幕重试。";
      }

      function friendlyCameraStartError(err) {
        const name = (err && err.name) || "";
        const msg = (err && err.message) || "";
        if (!isSecureEnough()) {
          return "当前页面不安全，无法使用相机。请用 Chrome 通过 HTTPS 打开后再试。";
        }
        if (name === "NotFoundError" || /Requested device not found|未找到/i.test(msg)) {
          return "未检测到摄像头，请确认设备有摄像头，并已允许浏览器访问。";
        }
        if (name === "NotAllowedError" || name === "PermissionDeniedError") {
          return "还没有相机权限。请在浏览器设置里允许访问摄像头，然后轻触屏幕重试。";
        }
        if (name === "NotReadableError" || name === "TrackStartError") {
          return "摄像头正被其他应用占用，请关闭后轻触屏幕重试。";
        }
        if (/不支持相机|getUserMedia/i.test(msg)) {
          return "当前浏览器不支持相机功能，请使用桌面版 Chrome 或 Safari 最新版再试。";
        }
        if (/HTTPS/i.test(msg)) {
          return "当前页面不安全，无法使用相机。请用 Chrome 通过 HTTPS 打开后再试。";
        }
        return "无法打开相机，请检查摄像头与权限后轻触屏幕重试。";
      }

      async function runDeviceProbe() {
        probe.classList.add("show");
        gate.classList.remove("show");
        controls.classList.remove("show");
        if (probeError) {
          probeError.hidden = true;
          probeError.textContent = "";
        }
        if (probeRetryHint) probeRetryHint.hidden = true;
        probeStatus.textContent = "正在检测…";
        setProbeProgress(8, false);

        const httpsOk = isSecureEnough();
        setProbeProgress(22, false);

        probeStatus.textContent = "检测摄像头…";
        const camera = await checkCameraDevice();
        setProbeProgress(48, false);

        // 静默检测辅助拍摄依赖与模型源（不影响进入拍摄）
        let gpu = { ok: false };
        let tf = { ok: false };
        let mirror = { ok: false, host: "" };
        probeStatus.textContent = "检测拍摄环境…";
        setProbeProgress(62, false);
        try {
          gpu = await checkWebGPU();
        } catch (_) {}
        setProbeProgress(74, false);
        try {
          tf = await checkAssistRuntime();
        } catch (_) {}
        setProbeProgress(86, false);
        try {
          mirror = await checkModelHosts();
        } catch (_) {}
        setProbeProgress(96, false);

        const assistOk = !!tf.ok; // 轻量 MediaPipe 可加载即可
        const shootOk = !!(httpsOk && camera.ok);

        deviceReport = {
          https: httpsOk,
          cameraApi: camera.api,
          cameraOk: camera.ok,
          cameraDetail: camera.detail,
          webgpu: gpu.ok,
          transformers: tf.ok,
          hfMirror: mirror.ok,
          modelHost: mirror.host || "",
          assistOk: assistOk,
          detail: assistOk ? "ok" : "assist unavailable",
        };

        if (!shootOk) {
          showProbeFailure(friendlyShootBlockReason(httpsOk, camera));
          return;
        }

        probeStatus.textContent = "即将进入拍摄…";
        setProbeProgress(100, false);
        await startCamera();
      }

      async function startCamera() {
        if (stream || starting) return;
        starting = true;
        try {
          if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            throw new Error("当前浏览器不支持相机");
          }
          if (!isSecureEnough()) throw new Error("需要 HTTPS 才能使用相机");

          gate.classList.remove("show");
          probe.classList.remove("show");
          controls.classList.add("show");

          await openCamera("environment");
          await initCapabilitiesQuietly();

          shootMode = "landscape";
          updateModeButtons();
          renderFocalButtons();
          await applyZoomFactor(MODE_PRESETS.landscape.defaultZoom);

          shutter.disabled = false;
          flipBtn.disabled = false;
          // 辅助拍摄：检测通过才启用
          coachBtn.disabled = !(deviceReport && deviceReport.assistOk);
          if (deviceReport && !deviceReport.assistOk) {
            coachBtn.title = "当前环境不支持辅助拍摄";
            setCoachHint("");
          } else {
            coachBtn.title = "";
            setCoachHint("");
            setCoachBtnProgress(0);
            // 有未完成下载时自动续传
            maybeAutoResumeCoachDownload();
          }
        } catch (err) {
          if (stream) {
            stream.getTracks().forEach(function (t) { t.stop(); });
            stream = null;
          }
          controls.classList.remove("show");
          gate.classList.remove("show");
          showProbeFailure(friendlyCameraStartError(err));
        } finally {
          starting = false;
        }
      }

      async function flipCamera() {
        if (!stream || flipping) return;
        flipping = true;
        flipBtn.disabled = true;
        try {
          const next = facingMode === "environment" ? "user" : "environment";
          await openCamera(next);
          if (next === "user") {
            zoomFactor = 1;
            digitalScale = 1;
            updatePreviewTransform();
            updateFocalAvailability();
            if (coachActive) stopSubjectTracking();
          } else {
            const presets = currentPresets();
            await applyZoomFactor(presets.defaultZoom);
            updateFocalAvailability();
          }
        } catch (err) {
          showToast(err.message || "切换摄像头失败", "err");
        } finally {
          flipping = false;
          flipBtn.disabled = false;
        }
      }

      function captureFrame() {
        const width = video.videoWidth;
        const height = video.videoHeight;
        if (!width || !height) throw new Error("画面还没就绪");

        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext("2d");

        if (facingMode === "user") {
          ctx.translate(width, 0);
          ctx.scale(-1, 1);
        }

        if (digitalScale > 1.01) {
          const cropW = width / digitalScale;
          const cropH = height / digitalScale;
          const sx = (width - cropW) / 2;
          const sy = (height - cropH) / 2;
          ctx.drawImage(video, sx, sy, cropW, cropH, 0, 0, width, height);
        } else {
          ctx.drawImage(video, 0, 0, width, height);
        }
      }

      function canvasToBlob() {
        return new Promise(function (resolve, reject) {
          canvas.toBlob(
            function (blob) {
              if (blob) resolve(blob);
              else reject(new Error("生成图片失败"));
            },
            "image/jpeg",
            0.92
          );
        });
      }

      async function savePhoto(blob, filename) {
        const file = new File([blob], filename, { type: "image/jpeg" });
        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          await navigator.share({ files: [file] });
          return;
        }
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(function () {
          URL.revokeObjectURL(url);
        }, 1000);
        showToast(isIOS() ? "请用分享菜单存到照片" : "已下载", "ok");
      }

      async function onShutter() {
        if (capturing || !stream) return;
        capturing = true;
        shutter.disabled = true;
        blinkFlash();
        try {
          captureFrame();
          const blob = await canvasToBlob();
          const name =
            "doyen-" +
            new Date().toISOString().replace(/[:.]/g, "-") +
            ".jpg";
          await savePhoto(blob, name);
        } catch (err) {
          if (err && err.name === "AbortError") showToast("未保存");
          else showToast((err && err.message) || "拍照失败", "err");
        } finally {
          capturing = false;
          shutter.disabled = false;
        }
      }


      let coachReady = false;
      let coachLoading = false;
      let coachActive = false;
      let coachTracking = false;
      let coachEngine = null;
      let coachDetectGen = 0;
      let coachReanalyzeSoon = false;
      /** 切模式/焦距等硬重置时顺带清掉点击锁定 */
      let coachHardReset = false;
      /** 切模式/焦距/镜头时递增，作废进行中的旧检测结果 */
      let coachViewGen = 0;
      let lastTapObjects = null;
      let lastTapSize = { w: 1, h: 1 };

      function coachAssetUrl(fileName) {
        const pathName = location.pathname || "/";
        let base;
        if (pathName.endsWith("/")) base = pathName + fileName;
        else if (/\.html?$/i.test(pathName)) {
          base = pathName.replace(/[^/]+$/, fileName);
        } else {
          base = pathName + "/" + fileName;
        }
        // 同域优先；jsDelivr 作备用（Pages 延迟时）
        return base + "?v=20260925-contour1";
      }

      /** 已成功加载过：静默热启动，不闪「下载资源」 */
      let coachLoadSilent = false;

      function setCoachHint(text) {
        if (coachHint) coachHint.textContent = text || "";
      }

      function setCoachBtnProgress(pct) {
        const p = Math.max(0, Math.min(100, Number(pct) || 0));
        coachBtn.style.setProperty("--coach-progress", p.toFixed(1) + "%");
      }

      function createCoachDownloadTracker() {
        const knownTotals = {
          "efficientdet_lite0.tflite": 7244197,
          "magic_touch.tflite": 6227884,
        };
        const files = Object.create(null);
        let peakPct = 0;
        let activeFile = "";

        function normalizeFileKey(file) {
          let f = String(file || "").split("?")[0];
          if (!f) return "file";
          if (knownTotals[f]) return f;
          const base = f.split("/").pop();
          if (knownTotals[base]) return base;
          return f;
        }

        function ensureFile(file) {
          const key = normalizeFileKey(file);
          if (!files[key]) {
            files[key] = {
              loaded: 0,
              total: knownTotals[key] || 0,
              done: false,
            };
          }
          return { key: key, entry: files[key] };
        }

        ensureFile("efficientdet_lite0.tflite");
        ensureFile("magic_touch.tflite");

        function compute() {
          let loaded = 0;
          let total = 0;
          Object.keys(files).forEach(function (key) {
            const f = files[key];
            const t = f.total > 0 ? f.total : f.done ? Math.max(f.loaded, 1) : 0;
            const l = f.done ? t || f.loaded : Math.min(f.loaded, t || f.loaded);
            loaded += l;
            total += t;
          });
          let pct = total > 0 ? (loaded / total) * 100 : 0;
          if (pct > peakPct) peakPct = pct;
          return { pct: peakPct, loaded: loaded, total: total, activeFile: activeFile };
        }

        return {
          onEvent: function (msg) {
            if (!msg) return null;
            const rawFile = msg.file || msg.name;
            if (!rawFile) return null;
            const got = ensureFile(rawFile);
            const file = got.key;
            const entry = got.entry;
            if (msg.status === "initiate" || msg.status === "download") {
              activeFile = file;
              if (typeof msg.total === "number" && msg.total > 0) {
                entry.total = Math.max(entry.total, msg.total);
              }
            } else if (msg.status === "progress") {
              activeFile = file;
              if (typeof msg.total === "number" && msg.total > 0) {
                entry.total = Math.max(entry.total, msg.total);
              }
              if (typeof msg.loaded === "number" && msg.loaded >= 0) {
                entry.loaded = Math.max(entry.loaded, msg.loaded);
              } else if (typeof msg.progress === "number" && entry.total > 0) {
                entry.loaded = Math.max(
                  entry.loaded,
                  (Number(msg.progress) / 100) * entry.total
                );
              }
            } else if (msg.status === "done") {
              entry.done = true;
              if (entry.total > 0) entry.loaded = entry.total;
              else if (entry.loaded > 0) entry.total = entry.loaded;
              else {
                entry.loaded = 1;
                entry.total = 1;
              }
            } else {
              return null;
            }
            return compute();
          },
          finish: function () {
            peakPct = 100;
            return { pct: 100 };
          },
        };
      }

      let coachDownloadTracker = null;

      function handleCoachProgress(msg) {
        if (!msg) return;
        // 本地缓存 / 静默热启动：绝不闪「下载资源」
        if (msg.fromCache || coachLoadSilent) {
          if (msg.status === "ready") {
            setCoachBtnProgress(0);
            setCoachHint("");
            coachDownloadTracker = null;
          }
          return;
        }
        if (
          msg.status === "initiate" ||
          msg.status === "download" ||
          msg.status === "progress" ||
          msg.status === "done"
        ) {
          if (!coachDownloadTracker) {
            coachDownloadTracker = createCoachDownloadTracker();
          }
          const snap = coachDownloadTracker.onEvent(msg);
          if (snap) {
            setCoachBtnProgress(snap.pct);
            setCoachHint("下载资源 " + Number(snap.pct).toFixed(0) + "%");
          }
          return;
        }
        if (msg.status === "ready") {
          if (coachDownloadTracker) coachDownloadTracker.finish();
          setCoachBtnProgress(100);
          setCoachHint("");
          coachDownloadTracker = null;
        }
      }

      async function ensureCoachEngine() {
        if (coachEngine) return coachEngine;
        try {
          coachEngine = await import(coachAssetUrl("coach-engine.js"));
          return coachEngine;
        } catch (_) {
          coachEngine = await import(
            "https://cdn.jsdelivr.net/gh/jon-hao/Doyen@main/coach-engine.js?v=20260925-contour1"
          );
          return coachEngine;
        }
      }

      async function ensureCoachModelLoaded() {
        if (coachReady) return true;
        if (coachLoading) return false;
        coachLoading = true;
        coachBtn.classList.add("loading");
        coachBtn.classList.remove("active");
        coachDownloadTracker = null;
        coachLoadSilent = false;

        try {
          const engine = await ensureCoachEngine();

          let fromCacheLikely = false;
          try {
            if (engine.findCachedModelHost) {
              const cached = await engine.findCachedModelHost();
              if (cached && cached.ok) {
                fromCacheLikely = true;
                if (engine.clearResumePartials) {
                  await engine.clearResumePartials();
                }
              }
            }
          } catch (_) {}

          // 仅首次下载显示进度；已就绪则静默热启动
          coachLoadSilent = fromCacheLikely;
          if (fromCacheLikely) {
            setCoachBtnProgress(0);
            setCoachHint("");
          } else {
            setCoachBtnProgress(0);
            setCoachHint("下载资源 0%");
          }

          await engine.loadCoach(handleCoachProgress);
          coachReady = true;
          coachLoadSilent = false;
          setCoachBtnProgress(0);
          setCoachHint("");
          try {
            if (engine.clearResumePartials) await engine.clearResumePartials();
          } catch (_) {}
          return true;
        } catch (err) {
          coachLoadSilent = false;
          try {
            if (coachEngine && coachEngine.flushActiveDownloads) {
              await coachEngine.flushActiveDownloads();
            }
          } catch (_) {}
          setCoachBtnProgress(0);
          setCoachHint("");
          coachReady = false;
          const raw = (err && err.message) || "";
          const paused =
            (err && err.name === "AbortError") ||
            /abort|interrupted|中断/i.test(raw);
          let msg = raw || "资源加载失败";
          if (/Load failed|引擎启动失败|module script failed|轻量模型加载失败/i.test(raw)) {
            msg = "检测引擎加载失败，请检查网络后重试";
          } else if (/Failed to fetch|NetworkError|network/i.test(raw)) {
            msg = "网络中断，再次点击可继续";
          } else if (/memory|OOM|Allocation|内存/i.test(raw)) {
            msg = "内存不足，请关闭其他标签页后重试";
          }
          showToast(paused ? "下载已暂停，再次点击可继续" : msg, "err");
          return false;
        } finally {
          coachLoading = false;
          coachBtn.classList.remove("loading");
        }
      }

      /**
       * 进拍摄页：若模型已就绪则静默热启动（点一下就能开辅助）；
       * 仅有半成品时才自动续传。
       */
      async function maybeAutoResumeCoachDownload() {
        if (!deviceReport || !deviceReport.assistOk) return;
        if (coachReady || coachLoading) return;
        try {
          const engine = await ensureCoachEngine();
          if (engine.findCachedModelHost) {
            const cached = await engine.findCachedModelHost();
            if (cached && cached.ok) {
              if (engine.clearResumePartials) {
                await engine.clearResumePartials();
              }
              await ensureCoachModelLoaded();
              return;
            }
          }
          let incomplete = false;
          if (engine.hasIncompleteDownloads) {
            incomplete = await engine.hasIncompleteDownloads();
          }
          if (incomplete) {
            await ensureCoachModelLoaded();
          }
        } catch (_) {}
      }

      function captureDetectCanvas() {
        const vw = video.videoWidth;
        const vh = video.videoHeight;
        if (!vw || !vh) throw new Error("画面还没就绪");

        // 与取景一致：数字变焦时只分析可见裁切区，切焦后主体会重新算
        let sx = 0;
        let sy = 0;
        let sw = vw;
        let sh = vh;
        if (digitalScale > 1.01) {
          sw = vw / digitalScale;
          sh = vh / digitalScale;
          sx = (vw - sw) / 2;
          sy = (vh - sh) / 2;
        }

        const maxSide = 384;
        const scale = Math.min(1, maxSide / Math.max(sw, sh));
        const w = Math.max(1, Math.round(sw * scale));
        const h = Math.max(1, Math.round(sh * scale));
        const c = document.createElement("canvas");
        c.width = w;
        c.height = h;
        const ctx = c.getContext("2d");
        ctx.drawImage(video, sx, sy, sw, sh, 0, 0, w, h);
        return { canvas: c, srcW: w, srcH: h };
      }

      function getHoldOrientation() {
        try {
          if (screen.orientation && screen.orientation.type) {
            return String(screen.orientation.type).indexOf("landscape") >= 0
              ? "landscape"
              : "portrait";
          }
        } catch (_) {}
        const size = getStageSize();
        return size.sw >= size.sh ? "landscape" : "portrait";
      }

      function mapOverlayToSrc(clientX, clientY, srcW, srcH) {
        sizeSubjectOverlay();
        const rect = subjectOverlay.getBoundingClientRect();
        const ox = clientX - rect.left;
        const oy = clientY - rect.top;
        const ow = subjectOverlay.width || rect.width || 1;
        const oh = subjectOverlay.height || rect.height || 1;
        const scale = Math.max(ow / srcW, oh / srcH);
        const dw = srcW * scale;
        const dh = srcH * scale;
        const offx = (ow - dw) / 2;
        const offy = (oh - dh) / 2;
        return {
          x: (ox - offx) / scale,
          y: (oy - offy) / scale,
        };
      }

      function clearSubjectOverlay() {
        if (!subjectOverlay) return;
        const ctx = subjectOverlay.getContext("2d");
        if (!ctx) return;
        const w = subjectOverlay.width || subjectOverlay.clientWidth || 1;
        const h = subjectOverlay.height || subjectOverlay.clientHeight || 1;
        if (subjectOverlay.width !== w || subjectOverlay.height !== h) {
          subjectOverlay.width = w;
          subjectOverlay.height = h;
        }
        ctx.clearRect(0, 0, subjectOverlay.width, subjectOverlay.height);
      }

      function sizeSubjectOverlay() {
        if (!subjectOverlay) return;
        const stageEl = document.getElementById("stage");
        const w = stageEl.clientWidth || window.innerWidth || 1;
        const h = stageEl.clientHeight || window.innerHeight || 1;
        if (subjectOverlay.width !== w || subjectOverlay.height !== h) {
          subjectOverlay.width = w;
          subjectOverlay.height = h;
        }
      }

      /** 轮廓填充：半透明浅绿 + 描边；无 mask 时退回圆角框填充 */
      function drawSubjectContour(mask, bbox, srcW, srcH) {
        sizeSubjectOverlay();
        const ctx = subjectOverlay.getContext("2d");
        if (!ctx) return;
        const ow = subjectOverlay.width;
        const oh = subjectOverlay.height;
        ctx.clearRect(0, 0, ow, oh);

        const scale = Math.max(ow / srcW, oh / srcH);
        const dw = srcW * scale;
        const dh = srcH * scale;
        const ox = (ow - dw) / 2;
        const oy = (oh - dh) / 2;

        if (mask && mask.data && mask.width && mask.height) {
          const mw = mask.width;
          const mh = mask.height;
          const img = ctx.createImageData(mw, mh);
          const px = img.data;
          const src = mask.data;
          for (let i = 0; i < mw * mh; i++) {
            const on = src[i] > 0;
            const o = i * 4;
            if (!on) {
              px[o + 3] = 0;
              continue;
            }
            const x = i % mw;
            const y = (i / mw) | 0;
            let edge = false;
            if (
              x === 0 ||
              y === 0 ||
              x === mw - 1 ||
              y === mh - 1 ||
              !src[i - 1] ||
              !src[i + 1] ||
              !src[i - mw] ||
              !src[i + mw]
            ) {
              edge = true;
            }
            if (edge) {
              px[o] = 74;
              px[o + 1] = 222;
              px[o + 2] = 128;
              px[o + 3] = 220;
            } else {
              px[o] = 74;
              px[o + 1] = 222;
              px[o + 2] = 128;
              px[o + 3] = 55;
            }
          }
          const tmp = document.createElement("canvas");
          tmp.width = mw;
          tmp.height = mh;
          tmp.getContext("2d").putImageData(img, 0, 0);
          ctx.save();
          ctx.imageSmoothingEnabled = true;
          ctx.drawImage(tmp, ox, oy, dw, dh);
          ctx.restore();
          return;
        }

        if (!bbox || bbox.length < 4) return;
        let x1 = bbox[0] * scale + ox;
        let y1 = bbox[1] * scale + oy;
        let x2 = bbox[2] * scale + ox;
        let y2 = bbox[3] * scale + oy;
        const x = Math.min(x1, x2);
        const y = Math.min(y1, y2);
        const bw = Math.abs(x2 - x1);
        const bh = Math.abs(y2 - y1);
        if (bw < 4 || bh < 4) return;
        const r = Math.min(22, bw * 0.18, bh * 0.18);
        ctx.save();
        ctx.beginPath();
        if (ctx.roundRect) ctx.roundRect(x, y, bw, bh, r);
        else ctx.rect(x, y, bw, bh);
        ctx.fillStyle = "rgba(74, 222, 128, 0.22)";
        ctx.fill();
        ctx.strokeStyle = "#4ade80";
        ctx.lineWidth = Math.max(2, Math.round(ow / 180));
        ctx.stroke();
        ctx.restore();
      }

      function drawSubjectBox(bbox, srcW, srcH) {
        drawSubjectContour(null, bbox, srcW, srcH);
      }

      function pulseCoachBtn() {
        coachBtn.classList.remove("pulse");
        // 强制重启动画
        void coachBtn.offsetWidth;
        coachBtn.classList.add("pulse");
        window.setTimeout(function () {
          coachBtn.classList.remove("pulse");
        }, 450);
      }

      function stopSubjectTracking() {
        coachActive = false;
        coachDetectGen += 1;
        coachViewGen += 1;
        coachTracking = false;
        coachReanalyzeSoon = false;
        coachHardReset = false;
        coachBtn.classList.remove("active");
        if (subjectOverlay) subjectOverlay.classList.remove("interactive");
        clearSubjectOverlay();
        setCoachHint("");
        if (coachEngine && coachEngine.clearTrackedSubject) {
          coachEngine.clearTrackedSubject();
        }
      }

      /** 切焦距 / 镜头 / 模式后：丢掉旧跟踪，作废飞行中检测，下一帧立刻重检 */
      function reanalyzeAssistSubject() {
        if (!coachActive) return;
        coachReanalyzeSoon = true;
        coachHardReset = true;
        coachViewGen += 1;
        if (coachEngine && coachEngine.clearTrackedSubject) {
          coachEngine.clearTrackedSubject();
        }
        clearSubjectOverlay();
      }

      async function subjectTrackLoop(gen) {
        coachTracking = true;
        let lastMask = null;
        while (coachActive && gen === coachDetectGen) {
          if (!stream || document.hidden) {
            await new Promise(function (r) { setTimeout(r, 400); });
            continue;
          }
          if (coachReanalyzeSoon) {
            coachReanalyzeSoon = false;
            lastMask = null;
            if (coachHardReset) {
              coachHardReset = false;
              if (coachEngine && coachEngine.clearTrackedSubject) {
                coachEngine.clearTrackedSubject();
              }
            }
          }
          const viewGen = coachViewGen;
          const modeNow =
            shootMode === "portrait" ? "portrait" : "landscape";
          const holdNow = getHoldOrientation();
          const started = Date.now();
          try {
            const snap = captureDetectCanvas();
            if (!coachEngine || !coachEngine.detectSubjects) {
              throw new Error("引擎未就绪");
            }
            if (coachEngine.setHoldOrientation) {
              coachEngine.setHoldOrientation(holdNow);
            }
            const vision = await coachEngine.detectSubjects(snap.canvas, null, {
              mode: modeNow,
              holdOrientation: holdNow,
            });
            if (!coachActive || gen !== coachDetectGen) break;
            if (viewGen !== coachViewGen) continue;
            if (vision.mode && vision.mode !== modeNow) continue;
            if (
              (shootMode === "portrait" ? "portrait" : "landscape") !== modeNow
            ) {
              continue;
            }
            const subject =
              vision.primary ||
              coachEngine.pickPrimarySubject(
                vision.objects || [],
                snap.srcW,
                snap.srcH,
                modeNow,
                snap.canvas
              );
            if (viewGen !== coachViewGen) continue;
            if (vision.mask) lastMask = vision.mask;
            lastTapObjects = vision.objects || [];
            lastTapSize = { w: snap.srcW, h: snap.srcH };
            if (subject && subject.bbox) {
              drawSubjectContour(lastMask, subject.bbox, snap.srcW, snap.srcH);
            } else {
              lastMask = null;
              clearSubjectOverlay();
            }
          } catch (_) {
            if (!coachActive || gen !== coachDetectGen) break;
            if (viewGen === coachViewGen) clearSubjectOverlay();
          }
          const elapsed = Date.now() - started;
          const wait = coachReanalyzeSoon ? 0 : Math.max(0, 100 - elapsed);
          await new Promise(function (r) { setTimeout(r, wait); });
        }
        if (gen === coachDetectGen) {
          coachTracking = false;
        }
      }

      function startSubjectTracking() {
        stopSubjectTracking();
        coachActive = true;
        coachBtn.classList.add("active");
        if (subjectOverlay) subjectOverlay.classList.add("interactive");
        setCoachHint("");
        sizeSubjectOverlay();
        const gen = ++coachDetectGen;
        subjectTrackLoop(gen);
      }

      async function onSubjectOverlayTap(ev) {
        if (!coachActive || !coachEngine || !stream) return;
        ev.preventDefault();
        try {
          const snap = captureDetectCanvas();
          const pt = mapOverlayToSrc(ev.clientX, ev.clientY, snap.srcW, snap.srcH);
          const modeNow =
            shootMode === "portrait" ? "portrait" : "landscape";
          let objects = lastTapObjects;
          if (!objects || !objects.length) {
            const vision = await coachEngine.detectSubjects(snap.canvas, null, {
              mode: modeNow,
              holdOrientation: getHoldOrientation(),
            });
            objects = vision.objects || [];
            if (vision.primary && vision.primary.bbox) {
              drawSubjectContour(
                vision.mask,
                vision.primary.bbox,
                snap.srcW,
                snap.srcH
              );
            }
          }
          lastTapObjects = objects;
          lastTapSize = { w: snap.srcW, h: snap.srcH };
          if (!coachEngine.pinSubjectAt) return;
          const pinned = coachEngine.pinSubjectAt(
            objects,
            pt.x,
            pt.y,
            snap.srcW,
            snap.srcH,
            modeNow
          );
          if (pinned && pinned.bbox) {
            const mask =
              coachEngine.segmentSubjectMask &&
              coachEngine.segmentSubjectMask(
                snap.canvas,
                pinned.nx,
                pinned.ny
              );
            drawSubjectContour(mask, pinned.bbox, snap.srcW, snap.srcH);
            coachReanalyzeSoon = true;
          }
        } catch (_) {}
      }

      let coachClickLockUntil = 0;
      let coachClickBusy = false;

      async function onCoachClick() {
        const now = Date.now();
        if (now < coachClickLockUntil || coachClickBusy) return;
        coachClickLockUntil = now + 450;
        pulseCoachBtn();

        if (!stream) return;
        if (coachLoading) return;
        if (deviceReport && !deviceReport.assistOk) {
          showToast("当前环境不支持辅助拍摄", "err");
          return;
        }
        if (facingMode === "user") {
          showToast("请切到后置镜头再使用辅助拍摄", "err");
          return;
        }

        coachClickBusy = true;
        try {
          if (coachActive) {
            stopSubjectTracking();
            return;
          }

          if (!coachReady) {
            const ok = await ensureCoachModelLoaded();
            if (!ok) return;
          }

          // 资源就绪后直接开启，无需再点一次
          startSubjectTracking();
        } finally {
          coachClickBusy = false;
        }
      }

      coachBtn.addEventListener("pointerdown", function () {
        if (!coachBtn.disabled) coachBtn.classList.add("pressed");
      });
      coachBtn.addEventListener("pointerup", function () {
        coachBtn.classList.remove("pressed");
      });
      coachBtn.addEventListener("pointerleave", function () {
        coachBtn.classList.remove("pressed");
      });
      coachBtn.addEventListener("pointercancel", function () {
        coachBtn.classList.remove("pressed");
      });
      coachBtn.addEventListener("click", onCoachClick);
      if (subjectOverlay) {
        subjectOverlay.addEventListener("click", onSubjectOverlayTap);
      }

      function onHoldOrientationChange() {
        scheduleLayoutVideos();
        if (coachActive) {
          reanalyzeAssistSubject();
        }
      }

      gate.addEventListener("click", function () {
        runDeviceProbe();
      });
      probe.addEventListener("click", function () {
        // 仅失败态允许轻触重试
        if (probeRetryHint && !probeRetryHint.hidden && !starting) {
          runDeviceProbe();
        }
      });
      shutter.addEventListener("click", onShutter);
      flipBtn.addEventListener("click", flipCamera);

      Array.prototype.forEach.call(
        modeBar.querySelectorAll(".mode-btn"),
        function (btn) {
          btn.addEventListener("click", function () {
            setShootMode(btn.dataset.mode);
          });
        }
      );

      updateModeButtons();
      renderFocalButtons();

      document.addEventListener("visibilitychange", function () {
        if (!document.hidden) {
          resumePreview();
          // 不再自动续传：闪退后半成品 + 自动开下会再次 OOM，形成刷新死循环
        } else if (coachEngine && coachEngine.flushActiveDownloads) {
          coachEngine.flushActiveDownloads().catch(function () {});
        }
      });
      window.addEventListener("pageshow", function () {
        resumePreview();
      });
      window.addEventListener("pagehide", function () {
        if (coachEngine && coachEngine.flushActiveDownloads) {
          coachEngine.flushActiveDownloads().catch(function () {});
        }
      });
      window.addEventListener("resize", function () {
        scheduleLayoutVideos();
        if (coachActive) sizeSubjectOverlay();
      });
      window.addEventListener("orientationchange", function () {
        setTimeout(scheduleLayoutVideos, 120);
        setTimeout(scheduleLayoutVideos, 400);
        setTimeout(onHoldOrientationChange, 180);
      });
      try {
        if (screen.orientation && screen.orientation.addEventListener) {
          screen.orientation.addEventListener("change", function () {
            setTimeout(onHoldOrientationChange, 80);
          });
        }
      } catch (_) {}
      if (window.visualViewport) {
        window.visualViewport.addEventListener("resize", scheduleLayoutVideos);
      }

      // 先进检测页，再进入拍摄
      runDeviceProbe();
    })();
  </script>
</body>
