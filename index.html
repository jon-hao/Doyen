<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
  />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Doyen Camera</title>
  <style>
    :root {
      color-scheme: dark;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      height: 100%;
      background: #000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overflow: hidden;
      touch-action: manipulation;
    }

    #app {
      position: relative;
      width: 100%;
      height: 100%;
      background: #000;
    }

    #preview {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: #000;
    }

    #overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      padding: 24px 20px calc(28px + var(--safe-bottom));
      pointer-events: none;
    }

    #toast {
      min-height: 24px;
      margin-bottom: 18px;
      padding: 8px 14px;
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.55);
      color: #fff;
      font-size: 14px;
      opacity: 0;
      transition: opacity 0.2s ease;
      pointer-events: none;
      text-align: center;
      max-width: 90%;
    }

    #toast.show {
      opacity: 1;
    }

    #toast.ok {
      background: rgba(22, 163, 74, 0.85);
    }

    #toast.err {
      background: rgba(220, 38, 38, 0.85);
    }

    #shutter {
      pointer-events: auto;
      width: 78px;
      height: 78px;
      border-radius: 50%;
      border: 5px solid #fff;
      background: transparent;
      padding: 0;
      display: grid;
      place-items: center;
    }

    #shutter::before {
      content: "";
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: #fff;
    }

    #shutter:active::before {
      transform: scale(0.92);
      opacity: 0.75;
    }

    #shutter:disabled {
      opacity: 0.35;
    }

    #gate {
      position: absolute;
      inset: 0;
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 12px;
      padding: 32px;
      text-align: center;
      color: #fff;
      background: #000;
      cursor: pointer;
    }

    #gate.show {
      display: flex;
    }

    #gate h1 {
      margin: 0;
      font-size: 28px;
      font-weight: 600;
      letter-spacing: 0.02em;
    }

    #gate p {
      margin: 0;
      max-width: 18em;
      line-height: 1.5;
      color: rgba(255, 255, 255, 0.72);
      font-size: 15px;
    }

    #secureHint {
      display: none;
      margin-top: 4px;
      font-size: 13px;
      color: #fbbf24;
    }

    #flash {
      position: absolute;
      inset: 0;
      background: #fff;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.08s ease;
    }

    #flash.show {
      opacity: 0.85;
    }

    canvas {
      display: none;
    }
  </style>
</head>
<body>
  <div id="app">
    <video id="preview" playsinline autoplay muted></video>
    <canvas id="shot"></canvas>
    <div id="flash"></div>

    <div id="overlay">
      <div id="toast"></div>
      <button id="shutter" type="button" aria-label="拍照" disabled></button>
    </div>

    <div id="gate" class="show" role="button" tabindex="0" aria-label="轻触开启相机">
      <h1>Doyen</h1>
      <p>轻触屏幕开启相机</p>
      <p id="secureHint">需要 HTTPS 才能使用相机</p>
    </div>
  </div>

  <script>
    (function () {
      const video = document.getElementById("preview");
      const canvas = document.getElementById("shot");
      const shutter = document.getElementById("shutter");
      const toast = document.getElementById("toast");
      const gate = document.getElementById("gate");
      const secureHint = document.getElementById("secureHint");
      const flash = document.getElementById("flash");

      let stream = null;
      let starting = false;
      let capturing = false;
      let toastTimer = null;
      let lastBlob = null;
      let lastName = "";

      function isSecureEnough() {
        return (
          window.isSecureContext ||
          location.protocol === "https:" ||
          location.hostname === "localhost" ||
          location.hostname === "127.0.0.1"
        );
      }

      function isIOS() {
        return /iPad|iPhone|iPod/.test(navigator.userAgent) ||
          (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
      }

      if (!isSecureEnough()) {
        secureHint.style.display = "block";
      }

      function showToast(message, type) {
        toast.textContent = message;
        toast.className = "show" + (type ? " " + type : "");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(function () {
          toast.className = "";
        }, 1600);
      }

      function blinkFlash() {
        flash.classList.add("show");
        setTimeout(function () {
          flash.classList.remove("show");
        }, 90);
      }

      async function startCamera() {
        if (stream) return;
        if (starting) return;
        starting = true;

        try {
          if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            throw new Error("当前浏览器不支持相机");
          }
          if (!isSecureEnough()) {
            throw new Error("需要 HTTPS 才能使用相机");
          }

          const constraints = {
            audio: false,
            video: {
              facingMode: { ideal: "environment" },
              width: { ideal: 1920 },
              height: { ideal: 1080 },
            },
          };

          try {
            stream = await navigator.mediaDevices.getUserMedia(constraints);
          } catch (err) {
            stream = await navigator.mediaDevices.getUserMedia({
              audio: false,
              video: true,
            });
          }

          video.srcObject = stream;
          await video.play();
          gate.classList.remove("show");
          shutter.disabled = false;
        } finally {
          starting = false;
        }
      }

      function captureFrame() {
        const width = video.videoWidth;
        const height = video.videoHeight;
        if (!width || !height) {
          throw new Error("画面还没就绪");
        }
        canvas.width = width;
        canvas.height = height;
        canvas.getContext("2d").drawImage(video, 0, 0, width, height);
        return canvas;
      }

      function canvasToBlob(sourceCanvas) {
        return new Promise(function (resolve, reject) {
          sourceCanvas.toBlob(
            function (blob) {
              if (blob) resolve(blob);
              else reject(new Error("生成图片失败"));
            },
            "image/jpeg",
            0.92
          );
        });
      }

      function downloadBlob(blob, filename) {
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = filename;
        a.rel = "noopener";
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(function () {
          URL.revokeObjectURL(url);
        }, 1500);
      }

      async function savePhoto(blob, filename) {
        lastBlob = blob;
        lastName = filename;
        const file = new File([blob], filename, { type: "image/jpeg" });

        // iPhone：同一手势里立刻调起系统分享，少一步「再点保存」
        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          await navigator.share({ files: [file] });
          return;
        }

        downloadBlob(blob, filename);
        showToast(isIOS() ? "请用分享菜单存到照片" : "已下载", "ok");
      }

      async function onShutter() {
        if (capturing) return;

        if (!stream) {
          try {
            await startCamera();
          } catch (err) {
            showToast(err.message || "无法打开相机", "err");
          }
          return;
        }

        capturing = true;
        shutter.disabled = true;
        blinkFlash();

        try {
          const blob = await canvasToBlob(captureFrame());
          const name =
            "doyen-" +
            new Date().toISOString().replace(/[:.]/g, "-") +
            ".jpg";
          await savePhoto(blob, name);
        } catch (err) {
          if (err && err.name === "AbortError") {
            // 用户关掉了分享面板：保留原图，提示可再点快门旁逻辑——这里轻提示即可
            showToast("未保存");
          } else {
            showToast((err && err.message) || "拍照失败", "err");
          }
        } finally {
          capturing = false;
          shutter.disabled = false;
        }
      }

      async function onGateTap() {
        try {
          await startCamera();
        } catch (err) {
          showToast(err.message || "无法打开相机", "err");
        }
      }

      async function tryAutostart() {
        // 已授权过时，多数浏览器允许自动打开，跳过「再点一次」
        try {
          if (navigator.permissions && navigator.permissions.query) {
            const status = await navigator.permissions.query({
              name: "camera",
            });
            if (status.state === "granted") {
              await startCamera();
              return;
            }
            if (status.state === "denied") {
              showToast("请在设置里允许相机权限", "err");
              return;
            }
          }
        } catch (_) {
          // Safari 可能不支持 permissions.query，继续尝试直接打开
        }

        try {
          await startCamera();
        } catch (_) {
          // 需要用户手势：保留「轻触屏幕」
        }
      }

      gate.addEventListener("click", onGateTap);
      gate.addEventListener("keydown", function (event) {
        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          onGateTap();
        }
      });
      shutter.addEventListener("click", onShutter);

      document.addEventListener("visibilitychange", function () {
        if (document.hidden || !stream) return;
        video.play().catch(function () {});
      });

      tryAutostart();
    })();
  </script>
</body>
</html>
