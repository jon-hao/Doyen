<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
  />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Doyen Camera</title>
  <style>
    :root {
      color-scheme: dark;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-top: env(safe-area-inset-top, 0px);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      background: #000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overflow: hidden;
      touch-action: manipulation;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }

    #app {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      background: #000;
      overflow: hidden;
    }

    #stage {
      position: absolute;
      inset: 0;
      overflow: hidden;
      background: #000;
    }

    #preview {
      position: absolute;
      top: 50%;
      left: 50%;
      width: auto;
      height: auto;
      min-width: 100%;
      min-height: 100%;
      max-width: none;
      max-height: none;
      object-fit: cover;
      object-position: center center;
      background: #000;
      transform: translate(-50%, -50%);
      transform-origin: center center;
      transition: none;
    }


    #overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      padding: 20px 16px calc(28px + var(--safe-bottom));
      pointer-events: none;
    }


    #toast {
      position: absolute;
      left: 50%;
      top: calc(12px + var(--safe-top));
      bottom: auto;
      transform: translateX(-50%);
      min-height: 24px;
      margin-bottom: 0;
      padding: 10px 16px;
      border-radius: 14px;
      background: rgba(0, 0, 0, 0.55);
      color: #fff;
      font-size: 14px;
      line-height: 1.4;
      opacity: 0;
      transition: opacity 0.2s ease;
      pointer-events: none;
      text-align: center;
      max-width: min(92vw, 360px);
      z-index: 20;
    }

    #toast.show { opacity: 1; }
    #toast.ok { background: rgba(22, 163, 74, 0.92); }
    #toast.err { background: rgba(220, 38, 38, 0.92); }

    #controls {
      pointer-events: auto;
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      width: 100%;
    }

    #controls.show { display: flex; }

    #focalRow {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    #focalRow.front-locked #modeBar,
    #focalRow.front-locked #zoomRow {
      display: none;
    }

    #zoomRow {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    #modeBar {
      display: flex;
      gap: 4px;
      padding: 4px;
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.38);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .mode-btn {
      min-width: 72px;
      height: 34px;
      border: 0;
      border-radius: 999px;
      background: transparent;
      color: rgba(255, 255, 255, 0.72);
      font-size: 13px;
      font-weight: 600;
    }

    .mode-btn.active {
      background: rgba(255, 255, 255, 0.18);
      color: #fff;
    }

    #zoomBar {
      display: flex;
      gap: 6px;
      padding: 6px 8px;
      border-radius: 22px;
      background: rgba(0, 0, 0, 0.38);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .zoom-btn {
      min-width: 54px;
      height: 48px;
      border: 0;
      border-radius: 14px;
      background: transparent;
      color: rgba(255, 255, 255, 0.8);
      font-size: 12px;
      font-weight: 600;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1px;
      line-height: 1.15;
      padding: 0 6px;
    }

    .zoom-btn .mm {
      font-size: 10px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.55);
    }

    .zoom-btn.active {
      background: rgba(255, 255, 255, 0.2);
      color: #f5d76e;
    }

    .zoom-btn.active .mm {
      color: rgba(245, 215, 110, 0.8);
    }

    #bottomRow {
      width: min(360px, 100%);
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
    }

    #shutter {
      width: 78px;
      height: 78px;
      border-radius: 50%;
      border: 5px solid #fff;
      background: transparent;
      padding: 0;
      display: grid;
      place-items: center;
      justify-self: center;
    }

    #shutter::before {
      content: "";
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: #fff;
    }

    #shutter:active::before {
      transform: scale(0.92);
      opacity: 0.75;
    }

    #shutter:disabled { opacity: 0.35; }

    #flipBtn {
      justify-self: end;
      width: 48px;
      height: 48px;
      border: 0;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.18);
      color: #fff;
      font-size: 22px;
      line-height: 1;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    #flipBtn:disabled { opacity: 0.35; }

    #gate {
      position: absolute;
      inset: 0;
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 12px;
      padding: 28px 24px;
      text-align: center;
      color: #fff;
      background: #000;
      z-index: 5;
      touch-action: manipulation;
    }

    #gate.show { display: flex; }

    #gate h1 {
      margin: 0;
      font-size: 22px;
      font-weight: 600;
    }

    #gate p {
      margin: 0;
      max-width: 20em;
      line-height: 1.5;
      color: rgba(255, 255, 255, 0.72);
      font-size: 15px;
    }

    #secureHint {
      display: none;
      font-size: 13px;
      color: #fbbf24;
    }

    #probe {
      position: absolute;
      inset: 0;
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 12px;
      padding: 28px 20px calc(28px + var(--safe-bottom));
      text-align: center;
      color: #fff;
      background: rgba(0, 0, 0, 0.96);
      z-index: 6;
      touch-action: manipulation;
    }

    #probe.show { display: flex; }

    #probe h2 {
      margin: 0;
      font-size: 22px;
      font-weight: 600;
    }

    #probeStatus {
      margin: 0;
      max-width: 22em;
      line-height: 1.5;
      color: rgba(255, 255, 255, 0.72);
      font-size: 15px;
    }

    #probeList {
      width: min(400px, 100%);
      margin: 4px 0 0;
      padding: 12px 14px;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.08);
      text-align: left;
      list-style: none;
    }

    #probeList li {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 8px 0;
      font-size: 13px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      line-height: 1.35;
    }

    #probeList li:last-child { border-bottom: 0; }
    #probeList .ok { color: #4ade80; font-weight: 600; text-align: right; }
    #probeList .warn { color: #fbbf24; font-weight: 600; text-align: right; }
    #probeList .no { color: #f87171; font-weight: 600; text-align: right; }
    #probeList .label { color: rgba(255, 255, 255, 0.78); }

    #probeNote {
      margin: 0;
      max-width: 24em;
      font-size: 12px;
      line-height: 1.45;
      color: rgba(255, 255, 255, 0.55);
    }

    #probeEnter {
      margin-top: 6px;
      border: 0;
      border-radius: 12px;
      padding: 12px 22px;
      font-size: 16px;
      font-weight: 600;
      color: #111;
      background: #fff;
    }

    #probeEnter:disabled {
      opacity: 0.4;
    }

    #probeEnter[hidden] { display: none; }

    #probeActions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      margin-top: 2px;
    }

    #probeRetry,
    #probeClear {
      margin-top: 0;
      border: 0;
      border-radius: 12px;
      padding: 10px 18px;
      font-size: 14px;
      font-weight: 600;
      color: #fff;
      background: rgba(255, 255, 255, 0.16);
    }

    #probeRetry[hidden],
    #probeClear[hidden] { display: none; }

    #probeClear:disabled {
      opacity: 0.45;
    }


    #flash {
      position: absolute;
      inset: 0;
      background: #fff;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.08s ease;
    }

    #flash.show { opacity: 0.85; }


    #coachBtn {
      justify-self: start;
      min-width: 72px;
      height: 48px;
      border: 0;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.18);
      color: #fff;
      font-size: 13px;
      font-weight: 700;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      padding: 0 12px;
      white-space: nowrap;
    }

    #coachBtn:disabled { opacity: 0.35; }

    #coachBtn.busy {
      color: #f5d76e;
    }

    #coachPanel {
      position: absolute;
      left: 12px;
      right: 12px;
      bottom: calc(120px + var(--safe-bottom));
      z-index: 8;
      display: none;
      flex-direction: column;
      gap: 10px;
      padding: 14px 16px 16px;
      border-radius: 18px;
      background: rgba(0, 0, 0, 0.82);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      color: #fff;
      max-height: 42vh;
      overflow: auto;
      pointer-events: auto;
    }

    #coachPanel.show { display: flex; }

    #coachPanel.err {
      border: 1px solid rgba(248, 113, 113, 0.55);
    }

    #coachCaption.err {
      color: #fca5a5;
      font-size: 13px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
    }

    #coachPanel header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    #coachPanel h2 {
      margin: 0;
      font-size: 15px;
      font-weight: 700;
    }

    #coachClose {
      border: 0;
      background: transparent;
      color: rgba(255, 255, 255, 0.7);
      font-size: 20px;
      line-height: 1;
      padding: 4px 6px;
    }

    #coachHeaderActions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    #coachClear {
      border: 0;
      border-radius: 8px;
      padding: 4px 8px;
      font-size: 12px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.78);
      background: rgba(255, 255, 255, 0.12);
    }

    #coachProgress {
      display: none;
      font-size: 12px;
      color: rgba(255, 255, 255, 0.7);
      line-height: 1.4;
    }

    #coachProgress.show { display: block; }

    #coachProgressBar {
      margin-top: 8px;
      height: 4px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.15);
      overflow: hidden;
    }

    #coachProgressBar > i {
      display: block;
      height: 100%;
      width: 0%;
      background: #f5d76e;
      border-radius: 999px;
      transition: width 0.15s ease-out;
    }

    #coachProgressBar.indeterminate > i {
      width: 35% !important;
      animation: coachPulse 1.1s ease-in-out infinite;
    }

    @keyframes coachPulse {
      0% { transform: translateX(-120%); }
      100% { transform: translateX(320%); }
    }

    #coachCaption {
      margin: 0;
      font-size: 12px;
      line-height: 1.45;
      color: rgba(255, 255, 255, 0.62);
    }

    #coachTips {
      margin: 0;
      padding-left: 1.1em;
      font-size: 14px;
      line-height: 1.55;
    }

    #coachTips li { margin: 0 0 6px; }

    canvas#shot { display: none; }
  </style>
</head>
<body>
  <div id="app">
    <div id="stage">
      <video id="preview" playsinline autoplay muted></video>
    </div>
    <canvas id="shot"></canvas>
    <div id="flash"></div>

    <div id="overlay">
      <div id="toast"></div>
      <div id="coachPanel" aria-live="polite">
        <header>
          <h2>辅助拍摄</h2>
          <div id="coachHeaderActions">
            <button id="coachClear" type="button">清除缓存</button>
            <button id="coachClose" type="button" aria-label="关闭">×</button>
          </div>
        </header>
        <div id="coachProgress">
          <span id="coachProgressText">准备中…</span>
          <div id="coachProgressBar"><i id="coachProgressFill"></i></div>
        </div>
        <p id="coachCaption"></p>
        <ol id="coachTips"></ol>
      </div>
      <div id="controls">
        <div id="focalRow">
          <div id="modeBar">
            <button type="button" class="mode-btn active" data-mode="landscape">风景</button>
            <button type="button" class="mode-btn" data-mode="portrait">人像</button>
          </div>
          <div id="zoomRow">
            <div id="zoomBar"></div>
          </div>
        </div>
        <div id="bottomRow">
          <button id="coachBtn" type="button" aria-label="辅助拍摄" disabled>辅助拍摄</button>
          <button id="shutter" type="button" aria-label="拍照" disabled></button>
          <button id="flipBtn" type="button" aria-label="切换摄像头" disabled>⟲</button>
        </div>
      </div>
    </div>

    <div id="gate" role="button" tabindex="0">
      <h1>Doyen</h1>
      <p>轻触开启相机</p>
      <p id="secureHint">需要 HTTPS 才能使用相机</p>
    </div>

    <div id="probe" class="show">
      <h2>环境检测</h2>
      <p id="probeStatus">正在检测设备与依赖…</p>
      <ul id="probeList" hidden></ul>
      <p id="probeNote" hidden></p>
      <button id="probeEnter" type="button" hidden>进入拍摄</button>
      <div id="probeActions">
        <button id="probeRetry" type="button" hidden>重新检测</button>
        <button id="probeClear" type="button" hidden>清除缓存</button>
      </div>
    </div>
  </div>

  <script>
    (function () {
      const video = document.getElementById("preview");
      const canvas = document.getElementById("shot");
      const shutter = document.getElementById("shutter");
      const flipBtn = document.getElementById("flipBtn");
      const coachBtn = document.getElementById("coachBtn");
      const coachPanel = document.getElementById("coachPanel");
      const coachClose = document.getElementById("coachClose");
      const coachClear = document.getElementById("coachClear");
      const coachProgress = document.getElementById("coachProgress");
      const coachProgressText = document.getElementById("coachProgressText");
      const coachProgressFill = document.getElementById("coachProgressFill");
      const coachCaption = document.getElementById("coachCaption");
      const coachTips = document.getElementById("coachTips");
      const toast = document.getElementById("toast");
      const gate = document.getElementById("gate");
      const secureHint = document.getElementById("secureHint");
      const probe = document.getElementById("probe");
      const probeStatus = document.getElementById("probeStatus");
      const probeList = document.getElementById("probeList");
      const probeNote = document.getElementById("probeNote");
      const probeEnter = document.getElementById("probeEnter");
      const probeRetry = document.getElementById("probeRetry");
      const probeClear = document.getElementById("probeClear");
      const flash = document.getElementById("flash");
      const controls = document.getElementById("controls");
      const zoomBar = document.getElementById("zoomBar");
      const modeBar = document.getElementById("modeBar");
      const focalRow = document.getElementById("focalRow");

      // 以主摄 ≈24mm 为 1x，焦段换算成相对倍率
      const MODE_PRESETS = {
        landscape: {
          label: "风景",
          defaultZoom: 1,
          focals: [
            { name: "超广", mm: 13, zoom: 0.5 },
            { name: "广角", mm: 24, zoom: 1 },
            { name: "中景", mm: 35, zoom: 1.5 },
            { name: "压缩", mm: 70, zoom: 3 },
          ],
        },
        portrait: {
          label: "人像",
          defaultZoom: 2,
          focals: [
            { name: "环境", mm: 35, zoom: 1.5 },
            { name: "标准", mm: 50, zoom: 2 },
            { name: "经典", mm: 85, zoom: 3.5 },
            { name: "特写", mm: 135, zoom: 5.5 },
          ],
        },
      };

      let stream = null;
      let starting = false;
      let capturing = false;
      let flipping = false;
      let zooming = false;
      let toastTimer = null;
      let facingMode = "environment";
      let shootMode = "landscape";
      let zoomFactor = 1;
      let digitalScale = 1;
      let supportZoom = false;
      let supportLensSwitch = false;
      let hwZoom = { min: 1, max: 1 };
      /** @type {{deviceId:string,label:string,kind:string,base:number}[]} */
      let lenses = [];
      let currentLens = null;
      let currentDeviceId = "";
      /** @type {null | {https:boolean,cameraApi:boolean,webgpu:boolean,transformers:boolean,hfMirror:boolean,assistOk:boolean,detail:string}} */
      let deviceReport = null;

      function currentPresets() {
        return MODE_PRESETS[shootMode] || MODE_PRESETS.landscape;
      }

      function findFocal(factor) {
        const list = currentPresets().focals;
        let best = list[0];
        let bestDiff = Infinity;
        for (let i = 0; i < list.length; i++) {
          const d = Math.abs(list[i].zoom - factor);
          if (d < bestDiff) {
            bestDiff = d;
            best = list[i];
          }
        }
        return best;
      }

      function isSecureEnough() {
        return (
          window.isSecureContext ||
          location.protocol === "https:" ||
          location.hostname === "localhost" ||
          location.hostname === "127.0.0.1"
        );
      }

      function isIOS() {
        return (
          /iPad|iPhone|iPod/.test(navigator.userAgent) ||
          (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1)
        );
      }

      if (!isSecureEnough()) secureHint.style.display = "block";

      function showToast(message, type) {
        toast.textContent = message;
        toast.className = "show" + (type ? " " + type : "");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(function () {
          toast.className = "";
        }, type === "err" ? 4500 : 1800);
      }

      function blinkFlash() {
        flash.classList.add("show");
        setTimeout(function () {
          flash.classList.remove("show");
        }, 90);
      }

      function getTrack() {
        return stream ? stream.getVideoTracks()[0] : null;
      }

      function clamp(n, min, max) {
        return Math.min(max, Math.max(min, n));
      }

      function isFrontLabel(label) {
        const l = (label || "").toLowerCase();
        return (
          l.includes("front") ||
          l.includes("user") ||
          l.includes("facetime") ||
          l.includes("前")
        );
      }

      function classifyDevice(device) {
        const l = (device.label || "").toLowerCase();
        if (l.includes("ultra") || l.includes("超广") || l.includes("0.5")) {
          return { kind: "ultrawide", base: 0.5 };
        }
        if (l.includes("tele") || l.includes("长焦")) {
          if (l.includes("5")) return { kind: "tele5", base: 5 };
          if (l.includes("3")) return { kind: "tele3", base: 3 };
          return { kind: "tele2", base: 2 };
        }
        if (l.includes("triple") || l.includes("dual") || l.includes("wide") || l.includes("后") || l.includes("back")) {
          return { kind: "wide", base: 1 };
        }
        return { kind: "wide", base: 1 };
      }

      function lensName(lens) {
        if (!lens) return "未知";
        if (lens.kind === "ultrawide") return "超广角";
        if (lens.kind === "tele5") return "长焦 5x";
        if (lens.kind === "tele3") return "长焦 3x";
        if (lens.kind === "tele2") return "长焦 2x";
        return "主摄";
      }

      function pickLensForZoom(factor) {
        if (facingMode !== "environment" || !lenses.length) return null;

        const ultra = lenses.find(function (l) { return l.kind === "ultrawide"; });
        const wide = lenses.find(function (l) { return l.kind === "wide"; }) || lenses[0];
        const tele2 = lenses.find(function (l) { return l.kind === "tele2"; });
        const tele3 = lenses.find(function (l) { return l.kind === "tele3"; });
        const tele5 = lenses.find(function (l) { return l.kind === "tele5"; });

        if (factor <= 0.7 && ultra) return ultra;
        if (factor >= 4.5 && tele5) return tele5;
        if (factor >= 2.8 && tele3) return tele3;
        if (factor >= 2.8 && tele5) return tele5;
        if (factor >= 1.7 && tele2) return tele2;
        if (factor >= 1.7 && tele3) return tele3;
        if (factor >= 1.7 && tele5) return tele5;
        return wide;
      }

      function renderFocalButtons() {
        const presets = currentPresets();
        zoomBar.innerHTML = "";
        presets.focals.forEach(function (focal) {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "zoom-btn";
          btn.dataset.zoom = String(focal.zoom);
          btn.innerHTML =
            "<span>" +
            focal.name +
            '</span><span class="mm">' +
            focal.mm +
            "mm</span>";
          btn.addEventListener("click", function () {
            if (facingMode !== "environment") return;
            applyZoomFactor(focal.zoom);
          });
          zoomBar.appendChild(btn);
        });
        updateZoomButtons();
        updateFocalAvailability();
      }

      function updateModeButtons() {
        Array.prototype.forEach.call(
          modeBar.querySelectorAll(".mode-btn"),
          function (btn) {
            btn.classList.toggle("active", btn.dataset.mode === shootMode);
          }
        );
      }

      async function setShootMode(mode) {
        if (!MODE_PRESETS[mode]) return;
        if (facingMode !== "environment") return;
        shootMode = mode;
        updateModeButtons();
        renderFocalButtons();

        const presets = currentPresets();
        const stillValid = presets.focals.some(function (f) {
          return Math.abs(f.zoom - zoomFactor) < 0.05;
        });
        const nextZoom = stillValid ? zoomFactor : presets.defaultZoom;
        await applyZoomFactor(nextZoom);
      }

      function layoutVideos() {
        const stageEl = document.getElementById("stage");
        const sw = stageEl.clientWidth || window.innerWidth || 1;
        const sh = stageEl.clientHeight || window.innerHeight || 1;
        const vw = video.videoWidth;
        const vh = video.videoHeight;
        if (!vw || !vh) return;

        // cover：短边撑满，再居中
        const scale = Math.max(sw / vw, sh / vh);
        const w = Math.ceil(vw * scale);
        const h = Math.ceil(vh * scale);

        video.style.top = "50%";
        video.style.left = "50%";
        video.style.width = w + "px";
        video.style.height = h + "px";
        video.style.minWidth = "0";
        video.style.minHeight = "0";
        video.style.maxWidth = "none";
        video.style.maxHeight = "none";
        video.style.objectFit = "fill";
        updatePreviewTransform();
      }

      function updatePreviewTransform() {
        const parts = ["translate(-50%, -50%)"];
        if (facingMode === "user") parts.push("scaleX(-1)");
        if (digitalScale > 1.01) parts.push("scale(" + digitalScale + ")");
        video.style.transform = parts.join(" ");
      }

      async function resumePreview() {
        if (!stream) return;
        try {
          await video.play();
        } catch (_) {}
        requestAnimationFrame(function () {
          layoutVideos();
          requestAnimationFrame(layoutVideos);
        });
      }

      function updateZoomButtons() {
        Array.prototype.forEach.call(
          zoomBar.querySelectorAll(".zoom-btn"),
          function (btn) {
            btn.classList.toggle(
              "active",
              Math.abs(Number(btn.dataset.zoom) - zoomFactor) < 0.05
            );
          }
        );
      }

      function updateFocalAvailability() {
        focalRow.classList.toggle("front-locked", facingMode === "user");
      }

      function onVideoGeometry() {
        layoutVideos();
      }

      video.addEventListener("loadedmetadata", onVideoGeometry);
      video.addEventListener("loadeddata", onVideoGeometry);
      video.addEventListener("playing", onVideoGeometry);
      video.addEventListener("resize", onVideoGeometry);

      async function openStream(constraints) {
        return navigator.mediaDevices.getUserMedia(constraints);
      }

      async function openCamera(facing, deviceId) {
        const videoConstraint = deviceId
          ? {
              deviceId: { exact: deviceId },
              width: { ideal: 1920 },
              height: { ideal: 1080 },
            }
          : {
              facingMode: { ideal: facing },
              width: { ideal: 1920 },
              height: { ideal: 1080 },
            };

        let next;
        try {
          next = await openStream({ audio: false, video: videoConstraint });
        } catch (_) {
          next = await openStream({
            audio: false,
            video: { facingMode: { ideal: facing } },
          });
        }

        const prev = stream;
        stream = next;
        video.srcObject = stream;
        try {
          await video.play();
          layoutVideos();
          requestAnimationFrame(layoutVideos);
        } catch (err) {
          next.getTracks().forEach(function (t) { t.stop(); });
          stream = prev;
          video.srcObject = prev;
          if (prev) await video.play().catch(function () {});
          throw err;
        }

        if (prev && prev !== stream) {
          prev.getTracks().forEach(function (t) { t.stop(); });
        }

        facingMode = facing;
        const track = getTrack();
        const settings =
          track && typeof track.getSettings === "function" ? track.getSettings() : {};
        currentDeviceId = settings.deviceId || deviceId || "";

        if (facing === "environment" && currentDeviceId) {
          const matched = lenses.find(function (l) {
            return l.deviceId === currentDeviceId;
          });
          if (matched) currentLens = matched;
        } else if (facing === "user") {
          currentLens = null;
        }

        refreshHwZoom();
        digitalScale = 1;
        updatePreviewTransform();
        updateZoomButtons();
        updateFocalAvailability();
      }

      function refreshHwZoom() {
        supportZoom = false;
        hwZoom = { min: 1, max: 1 };
        const track = getTrack();
        if (!track || typeof track.getCapabilities !== "function") return;
        const caps = track.getCapabilities();
        if (caps && caps.zoom) {
          supportZoom = true;
          hwZoom.min = caps.zoom.min;
          hwZoom.max = caps.zoom.max;
        }
      }

      async function discoverLenses() {
        const devices = await navigator.mediaDevices.enumerateDevices();
        const backs = devices.filter(function (d) {
          return d.kind === "videoinput" && d.deviceId && !isFrontLabel(d.label);
        });

        const found = [];
        const used = {};

        backs.forEach(function (device) {
          const info = classifyDevice(device);
          const label = (device.label || "").toLowerCase();
          const distinctive =
            label.includes("ultra") ||
            label.includes("tele") ||
            label.includes("超广") ||
            label.includes("长焦") ||
            label.includes("dual") ||
            label.includes("triple") ||
            label.includes("wide");

          // 即使只有笼统 Back Camera，也先全部收集，后面用实切探测
          const key = distinctive ? info.kind : "back-" + found.length;
          if (used[key] && distinctive) return;
          used[key] = true;
          found.push({
            deviceId: device.deviceId,
            label: device.label || key,
            kind: distinctive ? info.kind : "wide",
            base: distinctive ? info.base : 1,
          });
        });

        // 若多个后置但都标成 wide，按顺序尝试：第1主摄、第2当超广/长焦候选
        if (found.length >= 2 && found.every(function (l) { return l.kind === "wide"; })) {
          found[0].kind = "wide";
          found[0].base = 1;
          found[1].kind = "ultrawide";
          found[1].base = 0.5;
          if (found[2]) {
            found[2].kind = "tele2";
            found[2].base = 2;
          }
          if (found[3]) {
            found[3].kind = "tele5";
            found[3].base = 5;
          }
        }

        lenses = found;
      }

      async function switchToLens(lens) {
        if (!lens || facingMode !== "environment") return false;
        if (currentLens && currentLens.deviceId === lens.deviceId) {
          currentLens = lens;
          return false;
        }

        try {
          await openCamera("environment", lens.deviceId);
          currentLens = lens;
          return true;
        } catch (_) {
          return false;
        }
      }

      async function applyZoomFactor(factor) {
        if (zooming) return;
        if (facingMode !== "environment") return;
        zooming = true;
        zoomFactor = factor;

        try {
          digitalScale = 1;
          refreshHwZoom();

          // 首选：系统 zoom（很多 iPhone 会据此自动换镜）
          if (supportZoom) {
            const track = getTrack();
            const z = clamp(factor, hwZoom.min, hwZoom.max);
            try {
              await track.applyConstraints({ advanced: [{ zoom: z }] });
              digitalScale = 1;
              updatePreviewTransform();
              updateZoomButtons();
              return;
            } catch (_) {
              // 继续尝试切 device / 数字变焦
            }
          }

          // 次选：多 deviceId 时按倍率切物理镜头
          const target = pickLensForZoom(factor);
          let switched = false;
          if (target && (supportLensSwitch || lenses.length >= 2)) {
            switched = await switchToLens(target);
            if (switched) supportLensSwitch = true;
          }

          if (switched) {
            digitalScale = 1;
            refreshHwZoom();
            if (supportZoom) {
              const track = getTrack();
              const base = (currentLens && currentLens.base) || 1;
              const relative = clamp(factor / base, hwZoom.min, hwZoom.max);
              try {
                await track.applyConstraints({ advanced: [{ zoom: relative }] });
              } catch (_) {}
            }
          } else if (factor < 1) {
            digitalScale = 1;
          } else if (Math.abs(factor - 1) < 0.05) {
            digitalScale = 1;
          } else {
            digitalScale = factor;
          }

          updatePreviewTransform();
          updateZoomButtons();
        } finally {
          zooming = false;
        }
      }

      async function initCapabilitiesQuietly() {
        await discoverLenses();
        refreshHwZoom();
        const track = getTrack();

        if (supportZoom && track) {
          try {
            const settings =
              typeof track.getSettings === "function" ? track.getSettings() : {};
            const current =
              typeof settings.zoom === "number" ? settings.zoom : hwZoom.min;
            const test = clamp(
              current + Math.max((hwZoom.max - hwZoom.min) * 0.02, 0.01),
              hwZoom.min,
              hwZoom.max
            );
            await track.applyConstraints({ advanced: [{ zoom: test }] });
            await track.applyConstraints({ advanced: [{ zoom: current }] });
            supportZoom = true;
          } catch (_) {
            supportZoom = false;
          }
        }

        supportLensSwitch = lenses.length >= 2;
        if (supportZoom && hwZoom.min < 0.99 && hwZoom.max > 1.5) {
          supportLensSwitch = true;
        }
      }

      function probeRow(label, state, detail) {
        const cls = state === "ok" ? "ok" : state === "warn" ? "warn" : "no";
        return (
          '<li><span class="label">' +
          label +
          '</span><span class="' +
          cls +
          '">' +
          detail +
          "</span></li>"
        );
      }

      async function checkWebGPU() {
        try {
          if (!navigator.gpu) return { ok: false, detail: "不支持 navigator.gpu" };
          const adapter = await navigator.gpu.requestAdapter();
          if (!adapter) return { ok: false, detail: "无可用 GPU 适配器" };
          return { ok: true, detail: "可用" };
        } catch (err) {
          return {
            ok: false,
            detail: (err && err.message) || "检测失败",
          };
        }
      }

      async function checkTransformersCdn() {
        try {
          const mod = await import(
            "https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.5.1/+esm"
          );
          if (!mod || !mod.env) {
            return { ok: false, detail: "模块不完整" };
          }
          return { ok: true, detail: "CDN 可加载" };
        } catch (err) {
          return {
            ok: false,
            detail: (err && err.message) || "Load failed",
          };
        }
      }

      async function checkModelHosts() {
        try {
          const engine = await import(coachAssetUrl("coach-engine.js"));
          // 本地已下齐 → 不依赖外网模型源
          if (engine.findCachedModelHost) {
            const cached = await engine.findCachedModelHost();
            if (cached && cached.ok) {
              if (engine.setModelHost) engine.setModelHost(cached.host);
              return {
                ok: true,
                detail:
                  "本地已缓存 · " +
                  String(cached.host).replace(/^https?:\/\//, ""),
                host: cached.host,
                fromCache: true,
              };
            }
          }
          const probed = await engine.probeModelHosts();
          if (probed.ok) {
            return {
              ok: true,
              detail: probed.host.replace(/^https?:\/\//, ""),
              host: probed.host,
              fromCache: false,
            };
          }
          const parts = (probed.results || []).map(function (r) {
            return (
              String(r.host).replace(/^https?:\/\//, "") + ":" + r.detail
            );
          });
          return {
            ok: false,
            detail: parts.length ? parts.join("；") : "均失败",
            host: null,
            fromCache: false,
          };
        } catch (err) {
          return {
            ok: false,
            detail: (err && err.message) || "检测失败",
            host: null,
            fromCache: false,
          };
        }
      }

      function cameraProbeDetail(err) {
        const name = (err && err.name) || "";
        const msg = (err && err.message) || "";
        if (name === "NotFoundError" || /Requested device not found/i.test(msg)) {
          return "未找到摄像头";
        }
        if (name === "NotAllowedError" || name === "PermissionDeniedError") {
          return "权限被拒绝";
        }
        if (name === "NotReadableError" || name === "TrackStartError") {
          return "被其他应用占用";
        }
        if (name === "OverconstrainedError") {
          return "无匹配的摄像头";
        }
        if (name === "SecurityError") {
          return "安全限制";
        }
        return msg || name || "打开失败";
      }

      async function checkCameraDevice() {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          return { ok: false, api: false, detail: "不支持 getUserMedia" };
        }

        let media = null;
        try {
          try {
            media = await navigator.mediaDevices.getUserMedia({
              audio: false,
              video: { facingMode: { ideal: "environment" } },
            });
          } catch (firstErr) {
            // 后置失败时再试任意摄像头，避免误报 NotFound
            media = await navigator.mediaDevices.getUserMedia({
              audio: false,
              video: true,
            });
          }

          const track = media.getVideoTracks()[0];
          const label = (track && track.label) || "";
          return {
            ok: true,
            api: true,
            detail: label ? "可用 · " + label : "可用",
          };
        } catch (err) {
          return {
            ok: false,
            api: true,
            detail: cameraProbeDetail(err),
          };
        } finally {
          if (media) {
            media.getTracks().forEach(function (t) {
              t.stop();
            });
          }
        }
      }

      async function runDeviceProbe() {
        probe.classList.add("show");
        gate.classList.remove("show");
        controls.classList.remove("show");
        probeEnter.hidden = true;
        probeRetry.hidden = true;
        probeClear.hidden = true;
        probeList.hidden = true;
        probeNote.hidden = true;
        probeStatus.textContent = "正在检测设备与依赖…";

        const httpsOk = isSecureEnough();

        probeStatus.textContent = "检测摄像头…";
        const camera = await checkCameraDevice();

        probeStatus.textContent = "检测 WebGPU…";
        const gpu = await checkWebGPU();

        probeStatus.textContent = "检测 Transformers.js CDN…";
        const tf = await checkTransformersCdn();

        probeStatus.textContent = "检测模型源（Hugging Face / hf-mirror）…";
        const mirror = await checkModelHosts();

        // 辅助拍摄：CDN +（本地缓存 或 任一模型源）
        const assistOk = tf.ok && mirror.ok;
        const assistDetail = !tf.ok
          ? "引擎不可用：" + tf.detail
          : !mirror.ok
            ? "模型源不可用：" + mirror.detail
            : mirror.fromCache
              ? "可用（本地缓存 · " +
                (gpu.ok ? "WebGPU" : "WASM") +
                "）"
              : gpu.ok
                ? "可用（WebGPU · " + mirror.detail + "）"
                : "可用（WASM · " + mirror.detail + "）";

        const shootOk = httpsOk && camera.ok;

        deviceReport = {
          https: httpsOk,
          cameraApi: camera.api,
          cameraOk: camera.ok,
          cameraDetail: camera.detail,
          webgpu: gpu.ok,
          transformers: tf.ok,
          hfMirror: mirror.ok,
          modelHost: mirror.host || "",
          assistOk: assistOk,
          detail: assistDetail,
        };

        probeList.hidden = false;
        probeList.innerHTML =
          probeRow("HTTPS / 安全上下文", httpsOk ? "ok" : "no", httpsOk ? "通过" : "失败") +
          probeRow(
            "摄像头",
            camera.ok ? "ok" : "no",
            camera.detail
          ) +
          probeRow("WebGPU", gpu.ok ? "ok" : "warn", gpu.detail) +
          probeRow("Transformers.js", tf.ok ? "ok" : "no", tf.detail) +
          probeRow(
            "模型源",
            mirror.ok ? "ok" : "no",
            mirror.detail
          ) +
          probeRow(
            "辅助拍摄",
            assistOk ? (gpu.ok ? "ok" : "warn") : "no",
            assistDetail
          );

        probeNote.hidden = false;
        if (!httpsOk) {
          probeNote.textContent =
            "需要 HTTPS（或 localhost）才能使用相机。请用 GitHub Pages 链接打开。";
        } else if (!camera.ok) {
          probeNote.textContent =
            "当前环境无法打开摄像头（" +
            camera.detail +
            "）。请确认本机有摄像头、已授权浏览器权限，或换有摄像头的设备后再点「重新检测」。";
        } else if (!assistOk) {
          probeNote.textContent =
            "当前环境无法使用「辅助拍摄」。拍照仍可进入。可点「重新检测」，或换网络 / 桌面 Chrome 后再试。";
        } else if (mirror.fromCache) {
          probeNote.textContent =
            "本地已有视觉模型缓存，进入拍摄后点「辅助拍摄」将直接加载，无需再次下载。";
        } else if (!gpu.ok) {
          probeNote.textContent =
            "无 WebGPU，辅助拍摄将尝试 WASM（首次下载大、偏慢）。建议桌面 Chrome。";
        } else {
          probeNote.textContent =
            "环境正常。进入拍摄后点「辅助拍摄」会首次下载视觉模型（约数百 MB）；下完后下次会走本地缓存。";
        }

        probeStatus.textContent = "检测完成";
        probeEnter.hidden = false;
        probeRetry.hidden = false;
        probeClear.hidden = false;
        probeEnter.disabled = !shootOk;
        probeEnter.textContent = shootOk ? "进入拍摄" : "环境不满足，无法拍摄";
      }

      async function clearBrowserCaches() {
        const tasks = [];

        try {
          localStorage.removeItem("doyen_hf_host");
          localStorage.removeItem("doyen_model_ready");
        } catch (_) {}
        try {
          if (typeof window !== "undefined") {
            delete window.__DOYEN_HF_HOST__;
          }
        } catch (_) {}

        if (typeof caches !== "undefined" && caches.keys) {
          tasks.push(
            caches.keys().then(function (keys) {
              return Promise.all(
                keys.map(function (key) {
                  return caches.delete(key);
                })
              );
            })
          );
        }

        if (typeof indexedDB !== "undefined") {
          if (indexedDB.databases) {
            tasks.push(
              indexedDB.databases().then(function (dbs) {
                return Promise.all(
                  (dbs || []).map(function (db) {
                    const name = db && db.name;
                    if (!name) return Promise.resolve();
                    return new Promise(function (resolve) {
                      const req = indexedDB.deleteDatabase(name);
                      req.onsuccess = function () {
                        resolve();
                      };
                      req.onerror = function () {
                        resolve();
                      };
                      req.onblocked = function () {
                        resolve();
                      };
                    });
                  })
                );
              })
            );
          } else {
            // Safari 旧版无 databases()：清常见 transformers 库名
            [
              "transformers-cache",
              "transformersjs-cache",
              "@huggingface/transformers",
            ].forEach(function (name) {
              tasks.push(
                new Promise(function (resolve) {
                  const req = indexedDB.deleteDatabase(name);
                  req.onsuccess = function () {
                    resolve();
                  };
                  req.onerror = function () {
                    resolve();
                  };
                  req.onblocked = function () {
                    resolve();
                  };
                })
              );
            });
          }
        }

        await Promise.all(tasks);
      }

      async function onClearCache() {
        const ok = window.confirm(
          "清除本站模型缓存与相关本地数据？下载中断或页面崩溃后建议清除后重试。完成后会刷新页面。"
        );
        if (!ok) return;

        if (probeClear) probeClear.disabled = true;
        if (probeRetry) probeRetry.disabled = true;
        if (probeEnter) probeEnter.disabled = true;
        if (coachClear) coachClear.disabled = true;
        if (probeStatus) probeStatus.textContent = "正在清除缓存…";
        if (probeNote) {
          probeNote.hidden = false;
          probeNote.textContent = "清除 Cache Storage / IndexedDB / 模型源偏好…";
        }
        showToast("正在清除缓存…");

        try {
          await clearBrowserCaches();
          if (probeStatus) probeStatus.textContent = "缓存已清除，即将刷新…";
          showToast("缓存已清除", "ok");
          setTimeout(function () {
            location.reload();
          }, 400);
        } catch (err) {
          if (probeClear) probeClear.disabled = false;
          if (probeRetry) probeRetry.disabled = false;
          if (probeEnter) probeEnter.disabled = false;
          if (coachClear) coachClear.disabled = false;
          if (probeStatus) probeStatus.textContent = "清除失败";
          if (probeNote) {
            probeNote.textContent =
              (err && err.message) ||
              "清除缓存失败，请手动清理浏览器站点数据后重试。";
          }
          showToast("清除缓存失败", "err");
        }
      }

      async function startCamera() {
        if (stream || starting) return;
        starting = true;
        try {
          if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            throw new Error("当前浏览器不支持相机");
          }
          if (!isSecureEnough()) throw new Error("需要 HTTPS 才能使用相机");

          gate.classList.remove("show");
          probe.classList.remove("show");
          controls.classList.add("show");

          await openCamera("environment");
          await initCapabilitiesQuietly();

          shootMode = "landscape";
          updateModeButtons();
          renderFocalButtons();
          await applyZoomFactor(MODE_PRESETS.landscape.defaultZoom);

          shutter.disabled = false;
          flipBtn.disabled = false;
          // 辅助拍摄：检测通过才启用
          coachBtn.disabled = !(deviceReport && deviceReport.assistOk);
          if (deviceReport && !deviceReport.assistOk) {
            coachBtn.title = deviceReport.detail || "当前环境不支持辅助拍摄";
          } else {
            coachBtn.title = "";
          }
        } catch (err) {
          if (stream) {
            stream.getTracks().forEach(function (t) { t.stop(); });
            stream = null;
          }
          controls.classList.remove("show");
          gate.classList.remove("show");
          const msg = cameraProbeDetail(err) || (err && err.message) || "无法打开相机";
          showToast(msg, "err");
          // 回环境检测页拦下，避免黑底「轻触重试」空页
          await runDeviceProbe();
        } finally {
          starting = false;
        }
      }

      async function flipCamera() {
        if (!stream || flipping) return;
        flipping = true;
        flipBtn.disabled = true;
        try {
          const next = facingMode === "environment" ? "user" : "environment";
          await openCamera(next);
          if (next === "user") {
            zoomFactor = 1;
            digitalScale = 1;
            updatePreviewTransform();
            updateFocalAvailability();
          } else {
            const presets = currentPresets();
            await applyZoomFactor(presets.defaultZoom);
            updateFocalAvailability();
          }
        } catch (err) {
          showToast(err.message || "切换摄像头失败", "err");
        } finally {
          flipping = false;
          flipBtn.disabled = false;
        }
      }

      function captureFrame() {
        const width = video.videoWidth;
        const height = video.videoHeight;
        if (!width || !height) throw new Error("画面还没就绪");

        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext("2d");

        if (facingMode === "user") {
          ctx.translate(width, 0);
          ctx.scale(-1, 1);
        }

        if (digitalScale > 1.01) {
          const cropW = width / digitalScale;
          const cropH = height / digitalScale;
          const sx = (width - cropW) / 2;
          const sy = (height - cropH) / 2;
          ctx.drawImage(video, sx, sy, cropW, cropH, 0, 0, width, height);
        } else {
          ctx.drawImage(video, 0, 0, width, height);
        }
      }

      function canvasToBlob() {
        return new Promise(function (resolve, reject) {
          canvas.toBlob(
            function (blob) {
              if (blob) resolve(blob);
              else reject(new Error("生成图片失败"));
            },
            "image/jpeg",
            0.92
          );
        });
      }

      async function savePhoto(blob, filename) {
        const file = new File([blob], filename, { type: "image/jpeg" });
        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          await navigator.share({ files: [file] });
          return;
        }
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(function () {
          URL.revokeObjectURL(url);
        }, 1000);
        showToast(isIOS() ? "请用分享菜单存到照片" : "已下载", "ok");
      }

      async function onShutter() {
        if (capturing || !stream) return;
        capturing = true;
        shutter.disabled = true;
        blinkFlash();
        try {
          captureFrame();
          const blob = await canvasToBlob();
          const name =
            "doyen-" +
            new Date().toISOString().replace(/[:.]/g, "-") +
            ".jpg";
          await savePhoto(blob, name);
        } catch (err) {
          if (err && err.name === "AbortError") showToast("未保存");
          else showToast((err && err.message) || "拍照失败", "err");
        } finally {
          capturing = false;
          shutter.disabled = false;
        }
      }


      let coachReady = false;
      let coachLoading = false;
      let coachRunning = false;
      let coachEngine = null;
      let coachTipsMod = null;

      function coachAssetUrl(fileName) {
        const pathName = location.pathname || "/";
        let base;
        if (pathName.endsWith("/")) base = pathName + fileName;
        else if (/\.html?$/i.test(pathName)) {
          base = pathName.replace(/[^/]+$/, fileName);
        } else {
          base = pathName + "/" + fileName;
        }
        // bust browser module cache after deploy
        return base + "?v=20260924-cache";
      }

      function setCoachProgress(text, percentOrNull) {
        coachProgress.classList.add("show");
        coachProgressText.textContent = text || "";
        const bar = document.getElementById("coachProgressBar");
        if (typeof percentOrNull === "number" && !isNaN(percentOrNull)) {
          bar.classList.remove("indeterminate");
          const pct = Math.max(0, Math.min(100, percentOrNull));
          coachProgressFill.style.width = pct.toFixed(1) + "%";
        }
      }

      function setCoachIndeterminate(text) {
        coachProgress.classList.add("show");
        coachProgressText.textContent = text || "";
        document
          .getElementById("coachProgressBar")
          .classList.add("indeterminate");
      }

      function hideCoachProgress() {
        coachProgress.classList.remove("show");
        document
          .getElementById("coachProgressBar")
          .classList.remove("indeterminate");
        coachProgressFill.style.width = "0%";
      }

      function showCoachPanel() {
        coachPanel.classList.add("show");
      }

      function hideCoachPanel() {
        coachPanel.classList.remove("show");
      }

      function showCoachError(message) {
        hideCoachProgress();
        coachPanel.classList.add("show");
        coachPanel.classList.add("err");
        coachCaption.classList.add("err");
        coachCaption.textContent = message || "辅助拍摄出错";
        coachTips.innerHTML = "";
        showToast(message || "辅助拍摄出错", "err");
      }

      function clearCoachErrorState() {
        coachPanel.classList.remove("err");
        coachCaption.classList.remove("err");
      }

      function renderCoachResult(payload) {
        hideCoachProgress();
        clearCoachErrorState();
        const caption = (payload && payload.caption) || "";
        const tips = (payload && payload.tips) || [];
        const device = (payload && payload.device) || "";
        coachCaption.textContent = caption
          ? "镜头所见：" + caption
          : "已分析当前画面";
        if (device) {
          coachCaption.textContent += "（" + device + "）";
        }
        coachTips.innerHTML = "";
        tips.forEach(function (tip) {
          const li = document.createElement("li");
          li.textContent = tip;
          coachTips.appendChild(li);
        });
        showCoachPanel();
      }

      function createCoachDownloadTracker() {
        // 预置已知体积，避免每开一个大文件总进度回跳
        const knownTotals = {
          "config.json": 5432,
          "tokenizer.json": 2297961,
          "tokenizer_config.json": 197658,
          "preprocessor_config.json": 2673,
          "generation_config.json": 4096,
          "onnx/decoder_model_merged_q4.onnx": 64393474,
          "onnx/encoder_model_q4.onnx": 30058778,
          "onnx/embed_tokens_fp16.onnx": 78780290,
          "onnx/embed_tokens.onnx": 157560044,
          "onnx/vision_encoder_fp16.onnx": 183930536,
          "onnx/vision_encoder.onnx": 366549825,
        };
        const files = Object.create(null);
        let peakPct = 0;
        let activeFile = "";

        function ensureFile(file) {
          const key = String(file || "file");
          if (!files[key]) {
            files[key] = {
              loaded: 0,
              total: knownTotals[key] || 0,
              done: false,
            };
          }
          return files[key];
        }

        function fileLabel(file) {
          const name = String(file || "").split("/").pop() || "文件";
          if (name.length > 22) return name.slice(0, 10) + "…" + name.slice(-8);
          return name;
        }

        function compute() {
          let loaded = 0;
          let total = 0;
          let seen = 0;
          Object.keys(files).forEach(function (key) {
            const f = files[key];
            seen += 1;
            const t = f.total > 0 ? f.total : f.done ? Math.max(f.loaded, 1) : 0;
            const l = f.done ? t || f.loaded : Math.min(f.loaded, t || f.loaded);
            loaded += l;
            total += t;
          });
          let pct = 0;
          if (total > 0) pct = (loaded / total) * 100;
          else if (seen > 0) {
            // 尚无体积信息时，按已完成文件数估一个很粗的进度
            const doneCount = Object.keys(files).filter(function (k) {
              return files[k].done;
            }).length;
            pct = (doneCount / Math.max(seen, 1)) * 100;
          }
          // 单调递增，避免新文件加入后百分比回退
          if (pct > peakPct) peakPct = pct;
          return {
            pct: peakPct,
            loaded: loaded,
            total: total,
            activeFile: activeFile,
          };
        }

        return {
          onEvent: function (msg) {
            if (!msg || !msg.file) return null;
            const file = String(msg.file);
            const entry = ensureFile(file);
            if (msg.status === "initiate" || msg.status === "download") {
              activeFile = file;
              if (typeof msg.total === "number" && msg.total > 0) {
                entry.total = Math.max(entry.total, msg.total);
              }
            } else if (msg.status === "progress") {
              activeFile = file;
              if (typeof msg.total === "number" && msg.total > 0) {
                entry.total = Math.max(entry.total, msg.total);
              }
              if (typeof msg.loaded === "number" && msg.loaded >= 0) {
                entry.loaded = Math.max(entry.loaded, msg.loaded);
              } else if (typeof msg.progress === "number" && entry.total > 0) {
                entry.loaded = Math.max(
                  entry.loaded,
                  (Number(msg.progress) / 100) * entry.total
                );
              }
            } else if (msg.status === "done") {
              entry.done = true;
              if (entry.total > 0) entry.loaded = entry.total;
              else if (entry.loaded > 0) entry.total = entry.loaded;
              else {
                entry.loaded = 1;
                entry.total = 1;
              }
            } else {
              return null;
            }
            const snap = compute();
            return {
              pct: snap.pct,
              label: fileLabel(snap.activeFile || file),
              loaded: snap.loaded,
              total: snap.total,
            };
          },
          finish: function () {
            peakPct = 100;
            return { pct: 100 };
          },
        };
      }

      let coachDownloadTracker = null;

      function formatBytes(n) {
        if (!n || n < 1) return "";
        if (n < 1024) return n + " B";
        if (n < 1024 * 1024) return (n / 1024).toFixed(0) + " KB";
        return (n / (1024 * 1024)).toFixed(1) + " MB";
      }

      function handleCoachProgress(msg) {
        if (!msg) return;
        const fromCache = !!msg.fromCache;
        const verb = fromCache ? "加载" : "下载";

        if (
          msg.status === "initiate" ||
          msg.status === "download" ||
          msg.status === "progress" ||
          msg.status === "done"
        ) {
          if (!coachDownloadTracker) {
            coachDownloadTracker = createCoachDownloadTracker();
          }
          const snap = coachDownloadTracker.onEvent(msg);
          if (snap) {
            const sizeText =
              snap.total > 0
                ? " · " + formatBytes(snap.loaded) + "/" + formatBytes(snap.total)
                : "";
            setCoachProgress(
              verb +
                " " +
                Number(snap.pct).toFixed(0) +
                "%" +
                (snap.label ? " · " + snap.label : "") +
                sizeText,
              Number(snap.pct)
            );
          }
          return;
        }

        if (msg.status === "progress_total" && msg.progress != null) {
          setCoachProgress(
            verb + "模型 " + Number(msg.progress).toFixed(0) + "%",
            Number(msg.progress)
          );
          return;
        }
        if (msg.status === "loading" && msg.data) {
          // 已有总进度时，不要被 indeterminate 文案打断跳动
          if (coachDownloadTracker) return;
          setCoachIndeterminate(String(msg.data));
        } else if (msg.status === "ready") {
          if (coachDownloadTracker) coachDownloadTracker.finish();
          setCoachProgress(fromCache ? "本地模型就绪" : "模型就绪", 100);
          coachDownloadTracker = null;
        }
      }

      async function ensureCoachEngine() {
        if (coachEngine) return coachEngine;
        setCoachIndeterminate("加载辅助拍摄引擎…");
        try {
          coachEngine = await import(coachAssetUrl("coach-engine.js"));
          coachTipsMod = await import(coachAssetUrl("coach-tips.js"));
          return coachEngine;
        } catch (err) {
          const detail = (err && err.message) || String(err);
          throw new Error("引擎脚本加载失败：" + detail);
        }
      }

      function frameToBlob() {
        captureFrame();
        return new Promise(function (resolve, reject) {
          canvas.toBlob(
            function (blob) {
              if (!blob) reject(new Error("截取画面失败"));
              else resolve(blob);
            },
            "image/jpeg",
            0.85
          );
        });
      }

      async function runCoach() {
        if (!stream || coachRunning) return;
        if (deviceReport && !deviceReport.assistOk) {
          showCoachError(
            "当前环境不支持辅助拍摄：" +
              (deviceReport.detail || "请用桌面 Chrome 打开后再试")
          );
          return;
        }
        if (facingMode === "user") {
          showToast("请切到后置镜头再使用辅助拍摄", "err");
          return;
        }
        coachRunning = true;
        coachBtn.disabled = true;
        coachBtn.classList.add("busy");
        showCoachPanel();
        clearCoachErrorState();
        coachCaption.textContent = "";
        coachTips.innerHTML = "";
        coachDownloadTracker = null;
        setCoachIndeterminate("准备本地视觉模型…");

        try {
          const engine = await ensureCoachEngine();
          if (!coachReady) {
            if (coachLoading) {
              throw new Error("模型正在加载，请稍候再试");
            }
            coachLoading = true;
            await engine.loadCoach(handleCoachProgress);
            coachReady = true;
            coachLoading = false;
          }

          setCoachIndeterminate("正在看当前取景…");
          const blob = await frameToBlob();
          const vision = await engine.analyzeFrame(blob, handleCoachProgress);
          const focal = findFocal(zoomFactor);
          const built = coachTipsMod.buildCoachTips(vision, {
            mode: shootMode,
            focal: focal,
          });
          built.device = vision.device || engine.getCoachDevice();
          renderCoachResult(built);
        } catch (err) {
          coachLoading = false;
          showCoachError((err && err.message) || "指导失败");
        } finally {
          coachRunning = false;
          coachBtn.classList.remove("busy");
          coachBtn.disabled = false;
        }
      }

      coachBtn.addEventListener("click", runCoach);
      coachClose.addEventListener("click", hideCoachPanel);
      coachClear.addEventListener("click", onClearCache);


      gate.addEventListener("click", startCamera);
      probeEnter.addEventListener("click", function () {
        if (probeEnter.disabled) return;
        startCamera();
      });
      probeRetry.addEventListener("click", function () {
        runDeviceProbe();
      });
      probeClear.addEventListener("click", onClearCache);
      shutter.addEventListener("click", onShutter);
      flipBtn.addEventListener("click", flipCamera);

      Array.prototype.forEach.call(
        modeBar.querySelectorAll(".mode-btn"),
        function (btn) {
          btn.addEventListener("click", function () {
            setShootMode(btn.dataset.mode);
          });
        }
      );

      updateModeButtons();
      renderFocalButtons();

      document.addEventListener("visibilitychange", function () {
        if (!document.hidden) resumePreview();
      });
      window.addEventListener("pageshow", function () {
        resumePreview();
      });
      window.addEventListener("resize", function () {
        layoutVideos();
      });
      window.addEventListener("orientationchange", function () {
        setTimeout(layoutVideos, 120);
      });

      // 先进检测页，再进入拍摄
      runDeviceProbe();
    })();
  </script>
</body>
</html>
