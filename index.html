<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
  />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Doyen Camera</title>
  <style>
    :root {
      color-scheme: dark;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      height: 100%;
      background: #000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overflow: hidden;
      touch-action: none;
    }

    #app {
      position: relative;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }

    #preview {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: #000;
      transform-origin: center center;
      transition: transform 0.12s ease-out;
    }

    #preview.pinching {
      transition: none;
    }

    #overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      padding: 24px 20px calc(28px + var(--safe-bottom));
      pointer-events: none;
    }

    #toast {
      min-height: 24px;
      margin-bottom: 14px;
      padding: 8px 14px;
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.55);
      color: #fff;
      font-size: 14px;
      opacity: 0;
      transition: opacity 0.2s ease;
      pointer-events: none;
      text-align: center;
      max-width: 90%;
    }

    #toast.show {
      opacity: 1;
    }

    #toast.ok {
      background: rgba(22, 163, 74, 0.85);
    }

    #toast.err {
      background: rgba(220, 38, 38, 0.85);
    }

    #zoomBar {
      pointer-events: auto;
      display: none;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 22px;
      padding: 6px 8px;
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.38);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    #zoomBar.show {
      display: flex;
    }

    .zoom-btn {
      min-width: 42px;
      height: 42px;
      padding: 0 8px;
      border: 0;
      border-radius: 50%;
      background: transparent;
      color: rgba(255, 255, 255, 0.78);
      font-size: 13px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }

    .zoom-btn.active {
      background: rgba(255, 255, 255, 0.2);
      color: #f5d76e;
      font-size: 14px;
    }

    #shutter {
      pointer-events: auto;
      width: 78px;
      height: 78px;
      border-radius: 50%;
      border: 5px solid #fff;
      background: transparent;
      padding: 0;
      display: grid;
      place-items: center;
    }

    #shutter::before {
      content: "";
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: #fff;
    }

    #shutter:active::before {
      transform: scale(0.92);
      opacity: 0.75;
    }

    #shutter:disabled {
      opacity: 0.35;
    }

    #gate {
      position: absolute;
      inset: 0;
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 12px;
      padding: 32px;
      text-align: center;
      color: #fff;
      background: #000;
      cursor: pointer;
      touch-action: manipulation;
    }

    #gate.show {
      display: flex;
    }

    #gate h1 {
      margin: 0;
      font-size: 28px;
      font-weight: 600;
      letter-spacing: 0.02em;
    }

    #gate p {
      margin: 0;
      max-width: 18em;
      line-height: 1.5;
      color: rgba(255, 255, 255, 0.72);
      font-size: 15px;
    }

    #secureHint {
      display: none;
      margin-top: 4px;
      font-size: 13px;
      color: #fbbf24;
    }

    #flash {
      position: absolute;
      inset: 0;
      background: #fff;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.08s ease;
    }

    #flash.show {
      opacity: 0.85;
    }

    canvas {
      display: none;
    }
  </style>
</head>
<body>
  <div id="app">
    <video id="preview" playsinline autoplay muted></video>
    <canvas id="shot"></canvas>
    <div id="flash"></div>

    <div id="overlay">
      <div id="toast"></div>
      <div id="zoomBar" aria-label="变焦"></div>
      <button id="shutter" type="button" aria-label="拍照" disabled></button>
    </div>

    <div id="gate" class="show" role="button" tabindex="0" aria-label="轻触开启相机">
      <h1>Doyen</h1>
      <p>轻触屏幕开启相机</p>
      <p id="secureHint">需要 HTTPS 才能使用相机</p>
    </div>
  </div>

  <script>
    (function () {
      const video = document.getElementById("preview");
      const canvas = document.getElementById("shot");
      const shutter = document.getElementById("shutter");
      const toast = document.getElementById("toast");
      const gate = document.getElementById("gate");
      const secureHint = document.getElementById("secureHint");
      const flash = document.getElementById("flash");
      const zoomBar = document.getElementById("zoomBar");
      const app = document.getElementById("app");

      let stream = null;
      let starting = false;
      let capturing = false;
      let toastTimer = null;

      const zoom = {
        value: 1,
        min: 1,
        max: 5,
        hardware: false,
        presets: [1, 2],
      };

      let pinchActive = false;
      let pinchStartDistance = 0;
      let pinchStartZoom = 1;

      function isSecureEnough() {
        return (
          window.isSecureContext ||
          location.protocol === "https:" ||
          location.hostname === "localhost" ||
          location.hostname === "127.0.0.1"
        );
      }

      function isIOS() {
        return (
          /iPad|iPhone|iPod/.test(navigator.userAgent) ||
          (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1)
        );
      }

      if (!isSecureEnough()) {
        secureHint.style.display = "block";
      }

      function showToast(message, type) {
        toast.textContent = message;
        toast.className = "show" + (type ? " " + type : "");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(function () {
          toast.className = "";
        }, 1600);
      }

      function blinkFlash() {
        flash.classList.add("show");
        setTimeout(function () {
          flash.classList.remove("show");
        }, 90);
      }

      function getTrack() {
        return stream ? stream.getVideoTracks()[0] : null;
      }

      function clamp(n, min, max) {
        return Math.min(max, Math.max(min, n));
      }

      function formatZoomLabel(value) {
        if (Math.abs(value - 0.5) < 0.05) return ".5";
        const rounded = Math.round(value * 10) / 10;
        if (Number.isInteger(rounded)) return String(rounded);
        return rounded.toFixed(1);
      }

      function buildPresets(min, max) {
        const presets = [];
        if (min <= 0.55) presets.push(0.5);
        presets.push(1);
        if (max >= 1.8) presets.push(2);
        if (max >= 2.8) presets.push(3);
        if (max >= 4.5) presets.push(5);
        return presets;
      }

      function refreshZoomCapabilities() {
        const track = getTrack();
        let min = 1;
        let max = 5;
        let hardware = false;

        if (track && typeof track.getCapabilities === "function") {
          const caps = track.getCapabilities();
          if (caps && caps.zoom) {
            hardware = true;
            min = caps.zoom.min;
            max = caps.zoom.max;
            const settings =
              typeof track.getSettings === "function" ? track.getSettings() : {};
            if (typeof settings.zoom === "number") {
              zoom.value = settings.zoom;
            }
          }
        }

        // 没有硬件 zoom 时，用画面数字变焦（网页常见回退）
        if (!hardware) {
          min = 1;
          max = 5;
        }

        zoom.min = min;
        zoom.max = max;
        zoom.hardware = hardware;
        zoom.presets = buildPresets(min, max);
        zoom.value = clamp(zoom.value, min, max);
        renderZoomBar();
        applyZoom(zoom.value, false);
      }

      function renderZoomBar() {
        zoomBar.innerHTML = "";
        zoom.presets.forEach(function (preset) {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "zoom-btn";
          btn.dataset.zoom = String(preset);
          btn.textContent = formatZoomLabel(preset) + "x";
          btn.addEventListener("click", function (event) {
            event.stopPropagation();
            applyZoom(preset, true);
          });
          zoomBar.appendChild(btn);
        });
        zoomBar.classList.add("show");
        updateZoomButtons();
      }

      function nearestPreset(value) {
        let best = zoom.presets[0];
        let bestDist = Math.abs(value - best);
        zoom.presets.forEach(function (preset) {
          const dist = Math.abs(value - preset);
          if (dist < bestDist) {
            best = preset;
            bestDist = dist;
          }
        });
        return best;
      }

      function updateZoomButtons() {
        const activePreset = nearestPreset(zoom.value);
        const showExact =
          Math.abs(zoom.value - activePreset) > 0.08 ||
          pinchActive ||
          Math.abs(zoom.value - Math.round(zoom.value)) > 0.05;

        Array.prototype.forEach.call(
          zoomBar.querySelectorAll(".zoom-btn"),
          function (btn) {
            const preset = Number(btn.dataset.zoom);
            const isActive = Math.abs(preset - activePreset) < 0.01;
            btn.classList.toggle("active", isActive);
            if (isActive && showExact) {
              btn.textContent = formatZoomLabel(zoom.value) + "x";
            } else {
              btn.textContent = formatZoomLabel(preset) + "x";
            }
          }
        );
      }

      function applyZoom(value, animate) {
        zoom.value = clamp(value, zoom.min, zoom.max);
        const track = getTrack();

        if (zoom.hardware && track) {
          video.classList.toggle("pinching", !animate);
          video.style.transform = "none";
          track
            .applyConstraints({ advanced: [{ zoom: zoom.value }] })
            .catch(function () {
              // 部分机型会失败，回退数字变焦
              zoom.hardware = false;
              zoom.min = 1;
              zoom.max = Math.max(zoom.max, 5);
              video.style.transform = "scale(" + zoom.value + ")";
            });
        } else {
          video.classList.toggle("pinching", !animate);
          video.style.transform = "scale(" + zoom.value + ")";
        }

        updateZoomButtons();
      }

      function touchDistance(touches) {
        const dx = touches[0].clientX - touches[1].clientX;
        const dy = touches[0].clientY - touches[1].clientY;
        return Math.hypot(dx, dy);
      }

      function onTouchStart(event) {
        if (event.touches.length === 2 && stream) {
          pinchActive = true;
          pinchStartDistance = touchDistance(event.touches);
          pinchStartZoom = zoom.value;
          video.classList.add("pinching");
        }
      }

      function onTouchMove(event) {
        if (!pinchActive || event.touches.length !== 2) return;
        event.preventDefault();
        const distance = touchDistance(event.touches);
        if (pinchStartDistance <= 0) return;
        const next = pinchStartZoom * (distance / pinchStartDistance);
        applyZoom(next, false);
      }

      function onTouchEnd(event) {
        if (event.touches.length < 2) {
          pinchActive = false;
          video.classList.remove("pinching");
          updateZoomButtons();
        }
      }

      async function startCamera() {
        if (stream) return;
        if (starting) return;
        starting = true;

        try {
          if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            throw new Error("当前浏览器不支持相机");
          }
          if (!isSecureEnough()) {
            throw new Error("需要 HTTPS 才能使用相机");
          }

          const constraints = {
            audio: false,
            video: {
              facingMode: { ideal: "environment" },
              width: { ideal: 1920 },
              height: { ideal: 1080 },
            },
          };

          try {
            stream = await navigator.mediaDevices.getUserMedia(constraints);
          } catch (err) {
            stream = await navigator.mediaDevices.getUserMedia({
              audio: false,
              video: true,
            });
          }

          video.srcObject = stream;
          await video.play();
          gate.classList.remove("show");
          shutter.disabled = false;
          refreshZoomCapabilities();
        } finally {
          starting = false;
        }
      }

      function captureFrame() {
        const width = video.videoWidth;
        const height = video.videoHeight;
        if (!width || !height) {
          throw new Error("画面还没就绪");
        }

        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext("2d");

        // 硬件变焦：画面本身已变焦；数字变焦：从中心裁切
        if (zoom.hardware || zoom.value <= 1.001) {
          ctx.drawImage(video, 0, 0, width, height);
        } else {
          const cropW = width / zoom.value;
          const cropH = height / zoom.value;
          const sx = (width - cropW) / 2;
          const sy = (height - cropH) / 2;
          ctx.drawImage(video, sx, sy, cropW, cropH, 0, 0, width, height);
        }

        return canvas;
      }

      function canvasToBlob(sourceCanvas) {
        return new Promise(function (resolve, reject) {
          sourceCanvas.toBlob(
            function (blob) {
              if (blob) resolve(blob);
              else reject(new Error("生成图片失败"));
            },
            "image/jpeg",
            0.92
          );
        });
      }

      function downloadBlob(blob, filename) {
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = filename;
        a.rel = "noopener";
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(function () {
          URL.revokeObjectURL(url);
        }, 1500);
      }

      async function savePhoto(blob, filename) {
        const file = new File([blob], filename, { type: "image/jpeg" });

        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          await navigator.share({ files: [file] });
          return;
        }

        downloadBlob(blob, filename);
        showToast(isIOS() ? "请用分享菜单存到照片" : "已下载", "ok");
      }

      async function onShutter() {
        if (capturing) return;

        if (!stream) {
          try {
            await startCamera();
          } catch (err) {
            showToast(err.message || "无法打开相机", "err");
          }
          return;
        }

        capturing = true;
        shutter.disabled = true;
        blinkFlash();

        try {
          const blob = await canvasToBlob(captureFrame());
          const name =
            "doyen-" +
            new Date().toISOString().replace(/[:.]/g, "-") +
            ".jpg";
          await savePhoto(blob, name);
        } catch (err) {
          if (err && err.name === "AbortError") {
            showToast("未保存");
          } else {
            showToast((err && err.message) || "拍照失败", "err");
          }
        } finally {
          capturing = false;
          shutter.disabled = false;
        }
      }

      async function onGateTap() {
        try {
          await startCamera();
        } catch (err) {
          showToast(err.message || "无法打开相机", "err");
        }
      }

      async function tryAutostart() {
        try {
          if (navigator.permissions && navigator.permissions.query) {
            const status = await navigator.permissions.query({
              name: "camera",
            });
            if (status.state === "granted") {
              await startCamera();
              return;
            }
            if (status.state === "denied") {
              showToast("请在设置里允许相机权限", "err");
              return;
            }
          }
        } catch (_) {}

        try {
          await startCamera();
        } catch (_) {}
      }

      gate.addEventListener("click", onGateTap);
      gate.addEventListener("keydown", function (event) {
        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          onGateTap();
        }
      });
      shutter.addEventListener("click", onShutter);

      app.addEventListener("touchstart", onTouchStart, { passive: true });
      app.addEventListener("touchmove", onTouchMove, { passive: false });
      app.addEventListener("touchend", onTouchEnd);
      app.addEventListener("touchcancel", onTouchEnd);

      document.addEventListener("visibilitychange", function () {
        if (document.hidden || !stream) return;
        video.play().catch(function () {});
      });

      tryAutostart();
    })();
  </script>
</body>
</html>
