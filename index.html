<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
  />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Doyen Camera</title>
  <style>
    :root {
      color-scheme: dark;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      height: 100%;
      background: #000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overflow: hidden;
      touch-action: manipulation;
    }

    #app {
      position: relative;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }

    #stage {
      position: absolute;
      inset: 0;
      overflow: hidden;
      background: #000;
    }

    #preview {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: #000;
      transform-origin: center center;
      transition: transform 0.12s ease-out;
    }

    #overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      padding: 20px 16px calc(28px + var(--safe-bottom));
      pointer-events: none;
    }

    #toast {
      min-height: 24px;
      margin-bottom: 12px;
      padding: 8px 14px;
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.55);
      color: #fff;
      font-size: 14px;
      opacity: 0;
      transition: opacity 0.2s ease;
      pointer-events: none;
      text-align: center;
      max-width: 90%;
    }

    #toast.show { opacity: 1; }
    #toast.ok { background: rgba(22, 163, 74, 0.85); }
    #toast.err { background: rgba(220, 38, 38, 0.85); }

    #controls {
      pointer-events: auto;
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      width: 100%;
    }

    #controls.show { display: flex; }

    #zoomBar {
      display: flex;
      gap: 6px;
      padding: 6px 8px;
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.38);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .zoom-btn {
      min-width: 42px;
      height: 42px;
      border: 0;
      border-radius: 50%;
      background: transparent;
      color: rgba(255, 255, 255, 0.8);
      font-size: 13px;
      font-weight: 600;
    }

    .zoom-btn.active {
      background: rgba(255, 255, 255, 0.2);
      color: #f5d76e;
    }

    #bottomRow {
      width: min(360px, 100%);
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
    }

    #shutter {
      width: 78px;
      height: 78px;
      border-radius: 50%;
      border: 5px solid #fff;
      background: transparent;
      padding: 0;
      display: grid;
      place-items: center;
      justify-self: center;
    }

    #shutter::before {
      content: "";
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: #fff;
    }

    #shutter:active::before {
      transform: scale(0.92);
      opacity: 0.75;
    }

    #shutter:disabled { opacity: 0.35; }

    #flipBtn {
      justify-self: end;
      width: 48px;
      height: 48px;
      border: 0;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.18);
      color: #fff;
      font-size: 20px;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    #flipBtn:disabled { opacity: 0.35; }

    #hint {
      font-size: 11px;
      color: rgba(255, 255, 255, 0.5);
      text-align: center;
      max-width: 92vw;
      line-height: 1.35;
    }

    #gate,
    #probe {
      position: absolute;
      inset: 0;
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 12px;
      padding: 28px 24px;
      text-align: center;
      color: #fff;
      background: #000;
      z-index: 5;
      touch-action: manipulation;
    }

    #gate.show,
    #probe.show { display: flex; }

    #probe { background: rgba(0, 0, 0, 0.92); z-index: 6; }

    #gate h1,
    #probe h2 {
      margin: 0;
      font-size: 22px;
      font-weight: 600;
    }

    #gate p,
    #probeStatus {
      margin: 0;
      max-width: 20em;
      line-height: 1.5;
      color: rgba(255, 255, 255, 0.72);
      font-size: 15px;
    }

    #secureHint {
      display: none;
      font-size: 13px;
      color: #fbbf24;
    }

    #probeList {
      width: min(360px, 100%);
      margin: 4px 0 0;
      padding: 14px 16px;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.08);
      text-align: left;
      list-style: none;
    }

    #probeList li {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 8px 0;
      font-size: 14px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    #probeList li:last-child { border-bottom: 0; }
    #probeList .ok { color: #4ade80; font-weight: 600; }
    #probeList .no { color: #f87171; font-weight: 600; }
    #probeList .label { color: rgba(255, 255, 255, 0.78); }

    #probeEnter {
      margin-top: 8px;
      border: 0;
      border-radius: 12px;
      padding: 12px 20px;
      font-size: 16px;
      font-weight: 600;
      color: #111;
      background: #fff;
    }

    #probeEnter[hidden] { display: none; }

    #flash {
      position: absolute;
      inset: 0;
      background: #fff;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.08s ease;
    }

    #flash.show { opacity: 0.85; }

    canvas#shot { display: none; }
  </style>
</head>
<body>
  <div id="app">
    <div id="stage">
      <video id="preview" playsinline autoplay muted></video>
    </div>
    <canvas id="shot"></canvas>
    <div id="flash"></div>

    <div id="overlay">
      <div id="toast"></div>
      <div id="controls">
        <div id="zoomBar">
          <button type="button" class="zoom-btn" data-zoom="0.5">.5</button>
          <button type="button" class="zoom-btn active" data-zoom="1">1x</button>
          <button type="button" class="zoom-btn" data-zoom="2">2x</button>
          <button type="button" class="zoom-btn" data-zoom="5">5x</button>
        </div>
        <div id="bottomRow">
          <div></div>
          <button id="shutter" type="button" aria-label="拍照" disabled></button>
          <button id="flipBtn" type="button" aria-label="切换摄像头" disabled>⟲</button>
        </div>
        <div id="hint"></div>
      </div>
    </div>

    <div id="gate" class="show" role="button" tabindex="0">
      <h1>Doyen</h1>
      <p>轻触开启相机。同意权限后，会先检测系统变焦与物理镜头切换。</p>
      <p id="secureHint">需要 HTTPS 才能使用相机</p>
    </div>

    <div id="probe">
      <h2>能力检测</h2>
      <p id="probeStatus">正在检测…</p>
      <ul id="probeList" hidden></ul>
      <button id="probeEnter" type="button" hidden>进入拍摄</button>
    </div>
  </div>

  <script>
    (function () {
      const video = document.getElementById("preview");
      const canvas = document.getElementById("shot");
      const shutter = document.getElementById("shutter");
      const flipBtn = document.getElementById("flipBtn");
      const toast = document.getElementById("toast");
      const gate = document.getElementById("gate");
      const secureHint = document.getElementById("secureHint");
      const flash = document.getElementById("flash");
      const controls = document.getElementById("controls");
      const hint = document.getElementById("hint");
      const probe = document.getElementById("probe");
      const probeStatus = document.getElementById("probeStatus");
      const probeList = document.getElementById("probeList");
      const probeEnter = document.getElementById("probeEnter");

      let stream = null;
      let starting = false;
      let capturing = false;
      let flipping = false;
      let zooming = false;
      let toastTimer = null;
      let facingMode = "environment";
      let zoomFactor = 1;
      let digitalScale = 1;
      let supportZoom = false;
      let supportLensSwitch = false;
      let hwZoom = { min: 1, max: 1 };
      /** @type {{deviceId:string,label:string,kind:string,base:number}[]} */
      let lenses = [];
      let currentLens = null;
      let currentDeviceId = "";

      function isSecureEnough() {
        return (
          window.isSecureContext ||
          location.protocol === "https:" ||
          location.hostname === "localhost" ||
          location.hostname === "127.0.0.1"
        );
      }

      function isIOS() {
        return (
          /iPad|iPhone|iPod/.test(navigator.userAgent) ||
          (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1)
        );
      }

      if (!isSecureEnough()) secureHint.style.display = "block";

      function showToast(message, type) {
        toast.textContent = message;
        toast.className = "show" + (type ? " " + type : "");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(function () {
          toast.className = "";
        }, 1800);
      }

      function blinkFlash() {
        flash.classList.add("show");
        setTimeout(function () {
          flash.classList.remove("show");
        }, 90);
      }

      function getTrack() {
        return stream ? stream.getVideoTracks()[0] : null;
      }

      function clamp(n, min, max) {
        return Math.min(max, Math.max(min, n));
      }

      function isFrontLabel(label) {
        const l = (label || "").toLowerCase();
        return (
          l.includes("front") ||
          l.includes("user") ||
          l.includes("facetime") ||
          l.includes("前")
        );
      }

      function classifyDevice(device) {
        const l = (device.label || "").toLowerCase();
        if (l.includes("ultra") || l.includes("超广") || l.includes("0.5")) {
          return { kind: "ultrawide", base: 0.5 };
        }
        if (l.includes("tele") || l.includes("长焦")) {
          if (l.includes("5")) return { kind: "tele5", base: 5 };
          if (l.includes("3")) return { kind: "tele3", base: 3 };
          return { kind: "tele2", base: 2 };
        }
        if (l.includes("triple") || l.includes("dual") || l.includes("wide") || l.includes("后") || l.includes("back")) {
          return { kind: "wide", base: 1 };
        }
        return { kind: "wide", base: 1 };
      }

      function lensName(lens) {
        if (!lens) return "未知";
        if (lens.kind === "ultrawide") return "超广角";
        if (lens.kind === "tele5") return "长焦 5x";
        if (lens.kind === "tele3") return "长焦 3x";
        if (lens.kind === "tele2") return "长焦 2x";
        return "主摄";
      }

      function pickLensForZoom(factor) {
        if (facingMode !== "environment" || !lenses.length) return null;

        const ultra = lenses.find(function (l) { return l.kind === "ultrawide"; });
        const wide = lenses.find(function (l) { return l.kind === "wide"; }) || lenses[0];
        const tele2 = lenses.find(function (l) { return l.kind === "tele2"; });
        const tele3 = lenses.find(function (l) { return l.kind === "tele3"; });
        const tele5 = lenses.find(function (l) { return l.kind === "tele5"; });

        if (factor <= 0.7 && ultra) return ultra;
        if (factor >= 4 && tele5) return tele5;
        if (factor >= 2.5 && tele3) return tele3;
        if (factor >= 1.7 && tele2) return tele2;
        if (factor >= 1.7 && tele5) return tele5;
        return wide;
      }

      function updatePreviewTransform() {
        const parts = [];
        if (facingMode === "user") parts.push("scaleX(-1)");
        if (digitalScale > 1.01) parts.push("scale(" + digitalScale + ")");
        video.style.transform = parts.length ? parts.join(" ") : "none";
      }

      function updateZoomButtons() {
        Array.prototype.forEach.call(
          document.querySelectorAll(".zoom-btn"),
          function (btn) {
            btn.classList.toggle(
              "active",
              Math.abs(Number(btn.dataset.zoom) - zoomFactor) < 0.01
            );
          }
        );
      }

      function updateHint() {
        const lensText =
          facingMode === "user"
            ? "前置"
            : currentLens
              ? lensName(currentLens)
              : "后置";
        hint.textContent =
          lensText +
          " · zoom " +
          (supportZoom ? "✓" : "✗") +
          " · 切镜头 " +
          (supportLensSwitch ? "✓" : "✗") +
          " · " +
          (zoomFactor === 0.5 ? ".5" : zoomFactor + "x");
      }

      async function openStream(constraints) {
        return navigator.mediaDevices.getUserMedia(constraints);
      }

      async function openCamera(facing, deviceId) {
        const videoConstraint = deviceId
          ? {
              deviceId: { exact: deviceId },
              width: { ideal: 1920 },
              height: { ideal: 1080 },
            }
          : {
              facingMode: { ideal: facing },
              width: { ideal: 1920 },
              height: { ideal: 1080 },
            };

        let next;
        try {
          next = await openStream({ audio: false, video: videoConstraint });
        } catch (_) {
          next = await openStream({
            audio: false,
            video: { facingMode: { ideal: facing } },
          });
        }

        const prev = stream;
        stream = next;
        video.srcObject = stream;
        try {
          await video.play();
        } catch (err) {
          next.getTracks().forEach(function (t) { t.stop(); });
          stream = prev;
          video.srcObject = prev;
          if (prev) await video.play().catch(function () {});
          throw err;
        }

        if (prev && prev !== stream) {
          prev.getTracks().forEach(function (t) { t.stop(); });
        }

        facingMode = facing;
        const track = getTrack();
        const settings =
          track && typeof track.getSettings === "function" ? track.getSettings() : {};
        currentDeviceId = settings.deviceId || deviceId || "";

        if (facing === "environment" && currentDeviceId) {
          const matched = lenses.find(function (l) {
            return l.deviceId === currentDeviceId;
          });
          if (matched) currentLens = matched;
        } else if (facing === "user") {
          currentLens = null;
        }

        refreshHwZoom();
        digitalScale = 1;
        updatePreviewTransform();
        updateZoomButtons();
        updateHint();
      }

      function refreshHwZoom() {
        supportZoom = false;
        hwZoom = { min: 1, max: 1 };
        const track = getTrack();
        if (!track || typeof track.getCapabilities !== "function") return;
        const caps = track.getCapabilities();
        if (caps && caps.zoom) {
          supportZoom = true;
          hwZoom.min = caps.zoom.min;
          hwZoom.max = caps.zoom.max;
        }
      }

      async function discoverLenses() {
        const devices = await navigator.mediaDevices.enumerateDevices();
        const backs = devices.filter(function (d) {
          return d.kind === "videoinput" && d.deviceId && !isFrontLabel(d.label);
        });

        const found = [];
        const used = {};

        backs.forEach(function (device) {
          const info = classifyDevice(device);
          const label = (device.label || "").toLowerCase();
          const distinctive =
            label.includes("ultra") ||
            label.includes("tele") ||
            label.includes("超广") ||
            label.includes("长焦") ||
            label.includes("dual") ||
            label.includes("triple") ||
            label.includes("wide");

          // 即使只有笼统 Back Camera，也先全部收集，后面用实切探测
          const key = distinctive ? info.kind : "back-" + found.length;
          if (used[key] && distinctive) return;
          used[key] = true;
          found.push({
            deviceId: device.deviceId,
            label: device.label || key,
            kind: distinctive ? info.kind : "wide",
            base: distinctive ? info.base : 1,
          });
        });

        // 若多个后置但都标成 wide，按顺序尝试：第1主摄、第2当超广/长焦候选
        if (found.length >= 2 && found.every(function (l) { return l.kind === "wide"; })) {
          found[0].kind = "wide";
          found[0].base = 1;
          found[1].kind = "ultrawide";
          found[1].base = 0.5;
          if (found[2]) {
            found[2].kind = "tele2";
            found[2].base = 2;
          }
          if (found[3]) {
            found[3].kind = "tele5";
            found[3].base = 5;
          }
        }

        lenses = found;
      }

      async function switchToLens(lens, options) {
        options = options || {};
        if (!lens || facingMode !== "environment") return false;
        if (currentLens && currentLens.deviceId === lens.deviceId) {
          currentLens = lens;
          return false;
        }

        try {
          await openCamera("environment", lens.deviceId);
          currentLens = lens;
          if (options.notify) {
            showToast("硬件：已切换" + lensName(lens), "ok");
          }
          return true;
        } catch (_) {
          return false;
        }
      }

      async function applyZoomFactor(factor, options) {
        options = options || {};
        if (zooming) return;
        zooming = true;
        zoomFactor = factor;

        try {
          // 前置：只用数字变焦
          if (facingMode === "user") {
            digitalScale = Math.max(1, factor);
            updatePreviewTransform();
            updateZoomButtons();
            updateHint();
            return;
          }

          digitalScale = 1;
          refreshHwZoom();

          // 关键：很多 iPhone 只有一个虚拟后置相机，
          // 通过系统 zoom 约束会自动在超广/主摄/长焦间切换（之前转盘就是这样触发的）
          if (supportZoom) {
            const track = getTrack();
            const z = clamp(factor, hwZoom.min, hwZoom.max);
            try {
              await track.applyConstraints({ advanced: [{ zoom: z }] });
              digitalScale = 1;
              if (options.notify) {
                showToast(
                  "硬件变焦 " + (factor === 0.5 ? ".5" : factor + "x"),
                  "ok"
                );
              }
              updatePreviewTransform();
              updateZoomButtons();
              updateHint();
              return;
            } catch (_) {
              // 继续尝试切 device / 数字变焦
            }
          }

          // 次选：多 deviceId 时按倍率切物理镜头
          const target = pickLensForZoom(factor);
          let switched = false;
          if (target && (supportLensSwitch || options.forceSwitch)) {
            switched = await switchToLens(target, { notify: !!options.notify });
            if (switched) supportLensSwitch = true;
          }

          if (switched) {
            digitalScale = 1;
            // 切镜头后再尽量套 zoom
            refreshHwZoom();
            if (supportZoom) {
              const track = getTrack();
              const base = (currentLens && currentLens.base) || 1;
              const relative = clamp(factor / base, hwZoom.min, hwZoom.max);
              try {
                await track.applyConstraints({ advanced: [{ zoom: relative }] });
              } catch (_) {}
            }
          } else if (factor < 1) {
            digitalScale = 1;
            if (options.notify) {
              showToast("当前无法使用超广角，已保持主摄取景", "err");
            }
          } else {
            digitalScale = factor;
            if (options.notify && !supportZoom) {
              showToast("数字变焦 " + factor + "x", "ok");
            }
          }

          updatePreviewTransform();
          updateZoomButtons();
          updateHint();
        } finally {
          zooming = false;
        }
      }

      async function runCapabilityProbe() {
        probeStatus.textContent = "枚举摄像头…";
        await discoverLenses();

        probeStatus.textContent = "检测系统变焦…";
        refreshHwZoom();
        const track = getTrack();
        if (supportZoom && track) {
          try {
            const settings =
              typeof track.getSettings === "function" ? track.getSettings() : {};
            const current =
              typeof settings.zoom === "number" ? settings.zoom : hwZoom.min;
            const test = clamp(
              current + Math.max((hwZoom.max - hwZoom.min) * 0.02, 0.01),
              hwZoom.min,
              hwZoom.max
            );
            await track.applyConstraints({ advanced: [{ zoom: test }] });
            await track.applyConstraints({ advanced: [{ zoom: current }] });
            supportZoom = true;
          } catch (_) {
            supportZoom = false;
          }
        }

        probeStatus.textContent = "检测物理镜头切换…";
        supportLensSwitch = false;

        // 实切探测：尝试切到另一颗后置再切回
        if (lenses.length >= 2) {
          const wide =
            lenses.find(function (l) { return l.kind === "wide"; }) || lenses[0];
          const other = lenses.find(function (l) {
            return l.deviceId !== wide.deviceId;
          });
          if (other) {
            const beforeId = currentDeviceId || wide.deviceId;
            const ok = await switchToLens(other, { notify: false });
            if (ok && currentDeviceId && currentDeviceId !== beforeId) {
              supportLensSwitch = true;
            }
            // 切回主摄
            await switchToLens(wide, { notify: false });
            currentLens = wide;
          }
        }

        // 若 label 分不出多镜头但后置 device >= 2，仍可能可切
        if (!supportLensSwitch && lenses.length >= 2) {
          // 上面已试过；保持 false
        }

        // 额外：若 zoom 范围跨过 1，也视为可“等效切镜头”
        if (supportZoom && hwZoom.min < 0.99 && hwZoom.max > 1.5) {
          // 系统会随 zoom 自动换镜
          supportLensSwitch = supportLensSwitch || true;
        }

        return {
          supportZoom: supportZoom,
          supportLensSwitch: supportLensSwitch,
          lensCount: lenses.length,
          zoomRange: supportZoom
            ? hwZoom.min.toFixed(2) + "–" + hwZoom.max.toFixed(2)
            : "无",
        };
      }

      function showProbeResult(report) {
        probeStatus.textContent = "检测完成";
        probeList.hidden = false;
        probeList.innerHTML =
          '<li><span class="label">系统变焦 zoom</span><span class="' +
          (report.supportZoom ? "ok" : "no") +
          '">' +
          (report.supportZoom ? "支持 (" + report.zoomRange + ")" : "不支持") +
          "</span></li>" +
          '<li><span class="label">物理/等效换镜</span><span class="' +
          (report.supportLensSwitch ? "ok" : "no") +
          '">' +
          (report.supportLensSwitch ? "支持" : "不支持") +
          "</span></li>" +
          '<li><span class="label">后置镜头候选</span><span class="label">' +
          report.lensCount +
          "</span></li>" +
          '<li><span class="label">倍率按钮</span><span class="label">.5 / 1x / 2x / 5x</span></li>';
        probeEnter.hidden = false;
      }

      async function startCamera() {
        if (stream || starting) return;
        starting = true;
        try {
          if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            throw new Error("当前浏览器不支持相机");
          }
          if (!isSecureEnough()) throw new Error("需要 HTTPS 才能使用相机");

          gate.classList.remove("show");
          probe.classList.add("show");
          probeEnter.hidden = true;
          probeList.hidden = true;
          probeStatus.textContent = "请在系统弹窗中允许相机权限…";

          await openCamera("environment");
          probeStatus.textContent = "权限已获取，正在检测能力…";
          const report = await runCapabilityProbe();
          showProbeResult(report);
        } catch (err) {
          probe.classList.remove("show");
          gate.classList.add("show");
          if (stream) {
            stream.getTracks().forEach(function (t) { t.stop(); });
            stream = null;
          }
          showToast(err.message || "无法打开相机", "err");
        } finally {
          starting = false;
        }
      }

      async function enterShootMode() {
        probe.classList.remove("show");
        controls.classList.add("show");
        shutter.disabled = false;
        flipBtn.disabled = false;
        await applyZoomFactor(1, { notify: false });
        updateHint();
        if (supportLensSwitch) {
          showToast("点倍率将尝试切换物理镜头", "ok");
        } else if (supportZoom) {
          showToast("将使用系统变焦", "ok");
        } else {
          showToast("将使用数字变焦；可切换前置摄像头", "ok");
        }
      }

      async function flipCamera() {
        if (!stream || flipping) return;
        flipping = true;
        flipBtn.disabled = true;
        try {
          const next = facingMode === "environment" ? "user" : "environment";
          await openCamera(next);
          zoomFactor = 1;
          digitalScale = 1;
          updatePreviewTransform();
          updateZoomButtons();
          showToast(next === "user" ? "已切换到前置摄像头" : "已切换到后置摄像头", "ok");
          updateHint();
        } catch (err) {
          showToast(err.message || "切换摄像头失败", "err");
        } finally {
          flipping = false;
          flipBtn.disabled = false;
        }
      }

      function captureFrame() {
        const width = video.videoWidth;
        const height = video.videoHeight;
        if (!width || !height) throw new Error("画面还没就绪");

        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext("2d");

        if (facingMode === "user") {
          ctx.translate(width, 0);
          ctx.scale(-1, 1);
        }

        if (digitalScale > 1.01) {
          const cropW = width / digitalScale;
          const cropH = height / digitalScale;
          const sx = (width - cropW) / 2;
          const sy = (height - cropH) / 2;
          ctx.drawImage(video, sx, sy, cropW, cropH, 0, 0, width, height);
        } else {
          ctx.drawImage(video, 0, 0, width, height);
        }
      }

      function canvasToBlob() {
        return new Promise(function (resolve, reject) {
          canvas.toBlob(
            function (blob) {
              if (blob) resolve(blob);
              else reject(new Error("生成图片失败"));
            },
            "image/jpeg",
            0.92
          );
        });
      }

      async function savePhoto(blob, filename) {
        const file = new File([blob], filename, { type: "image/jpeg" });
        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          await navigator.share({ files: [file] });
          return;
        }
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(function () {
          URL.revokeObjectURL(url);
        }, 1000);
        showToast(isIOS() ? "请用分享菜单存到照片" : "已下载", "ok");
      }

      async function onShutter() {
        if (capturing || !stream) return;
        capturing = true;
        shutter.disabled = true;
        blinkFlash();
        try {
          captureFrame();
          const blob = await canvasToBlob();
          const name =
            "doyen-" +
            new Date().toISOString().replace(/[:.]/g, "-") +
            ".jpg";
          await savePhoto(blob, name);
        } catch (err) {
          if (err && err.name === "AbortError") showToast("未保存");
          else showToast((err && err.message) || "拍照失败", "err");
        } finally {
          capturing = false;
          shutter.disabled = false;
        }
      }

      gate.addEventListener("click", startCamera);
      probeEnter.addEventListener("click", function () {
        enterShootMode();
      });
      shutter.addEventListener("click", onShutter);
      flipBtn.addEventListener("click", flipCamera);

      Array.prototype.forEach.call(
        document.querySelectorAll(".zoom-btn"),
        function (btn) {
          btn.addEventListener("click", function () {
            applyZoomFactor(Number(btn.dataset.zoom), { notify: true });
          });
        }
      );

      document.addEventListener("visibilitychange", function () {
        if (!document.hidden && stream) video.play().catch(function () {});
      });

      (async function () {
        try {
          if (navigator.permissions && navigator.permissions.query) {
            const status = await navigator.permissions.query({ name: "camera" });
            if (status.state === "granted") startCamera();
          }
        } catch (_) {}
      })();
    })();
  </script>
</body>
</html>
