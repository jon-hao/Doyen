<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
  />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Doyen Camera</title>
  <style>
    :root {
      color-scheme: dark;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-top: env(safe-area-inset-top, 0px);
      --dof-blur: 0px;
      --dof-amount: 0;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      background: #000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overflow: hidden;
      touch-action: manipulation;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }

    #app {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      background: #000;
      overflow: hidden;
    }

    #stage {
      position: absolute;
      inset: 0;
      overflow: hidden;
      background: #000;
    }

    #preview,
    #previewBlur {
      position: absolute;
      top: 50%;
      left: 50%;
      width: auto;
      height: auto;
      min-width: 100%;
      min-height: 100%;
      max-width: none;
      max-height: none;
      object-fit: cover;
      object-position: center center;
      background: #000;
      transform: translate(-50%, -50%);
      transform-origin: center center;
      transition: none;
    }

    #previewBlur {
      filter: blur(var(--dof-blur));
      -webkit-filter: blur(var(--dof-blur));
      opacity: var(--dof-amount);
      pointer-events: none;
      will-change: filter, opacity;
      /* 柔和周边虚化，避免看起来像中间小窗 */
      -webkit-mask-image: radial-gradient(
        ellipse 78% 68% at 50% 45%,
        transparent 0%,
        transparent 48%,
        rgba(0, 0, 0, 0.55) 78%,
        #000 100%
      );
      mask-image: radial-gradient(
        ellipse 78% 68% at 50% 45%,
        transparent 0%,
        transparent 48%,
        rgba(0, 0, 0, 0.55) 78%,
        #000 100%
      );
    }

    #overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: calc(10px + var(--safe-top)) 16px calc(28px + var(--safe-bottom));
      pointer-events: none;
    }

    #topBar {
      pointer-events: auto;
      width: min(420px, 100%);
      display: none;
      align-items: center;
      gap: 12px;
      padding: 10px 14px;
      border-radius: 18px;
      background: rgba(0, 0, 0, 0.42);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    #topBar.show { display: flex; }

    #apertureLabel {
      min-width: 3.4em;
      color: #f5d76e;
      font-size: 15px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.02em;
    }

    #apertureSlider {
      flex: 1;
      -webkit-appearance: none;
      appearance: none;
      height: 28px;
      margin: 0;
      background: transparent;
      outline: none;
      touch-action: none;
      cursor: pointer;
    }

    #apertureSlider::-webkit-slider-runnable-track {
      height: 4px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.28);
    }

    #apertureSlider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 26px;
      height: 26px;
      margin-top: -11px;
      border-radius: 50%;
      background: #fff;
      border: 0;
      box-shadow: 0 1px 6px rgba(0, 0, 0, 0.4);
      transition: transform 0.08s ease-out;
    }

    #apertureSlider:active::-webkit-slider-thumb {
      transform: scale(1.12);
    }

    #apertureSlider::-moz-range-track {
      height: 4px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.28);
    }

    #apertureSlider::-moz-range-thumb {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: #fff;
      border: 0;
      box-shadow: 0 1px 6px rgba(0, 0, 0, 0.4);
    }

    #toast {
      position: absolute;
      left: 50%;
      bottom: calc(168px + var(--safe-bottom));
      transform: translateX(-50%);
      min-height: 24px;
      margin-bottom: 0;
      padding: 8px 14px;
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.55);
      color: #fff;
      font-size: 14px;
      opacity: 0;
      transition: opacity 0.2s ease;
      pointer-events: none;
      text-align: center;
      max-width: 90%;
      z-index: 3;
    }

    #toast.show { opacity: 1; }
    #toast.ok { background: rgba(22, 163, 74, 0.85); }
    #toast.err { background: rgba(220, 38, 38, 0.85); }

    #controls {
      pointer-events: auto;
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      width: 100%;
    }

    #controls.show { display: flex; }

    #focalRow {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    #focalRow.front-locked #modeBar,
    #focalRow.front-locked #zoomRow {
      display: none;
    }

    #zoomRow {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    #modeBar {
      display: flex;
      gap: 4px;
      padding: 4px;
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.38);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .mode-btn {
      min-width: 72px;
      height: 34px;
      border: 0;
      border-radius: 999px;
      background: transparent;
      color: rgba(255, 255, 255, 0.72);
      font-size: 13px;
      font-weight: 600;
    }

    .mode-btn.active {
      background: rgba(255, 255, 255, 0.18);
      color: #fff;
    }

    #zoomBar {
      display: flex;
      gap: 6px;
      padding: 6px 8px;
      border-radius: 22px;
      background: rgba(0, 0, 0, 0.38);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .zoom-btn {
      min-width: 54px;
      height: 48px;
      border: 0;
      border-radius: 14px;
      background: transparent;
      color: rgba(255, 255, 255, 0.8);
      font-size: 12px;
      font-weight: 600;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1px;
      line-height: 1.15;
      padding: 0 6px;
    }

    .zoom-btn .mm {
      font-size: 10px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.55);
    }

    .zoom-btn.active {
      background: rgba(255, 255, 255, 0.2);
      color: #f5d76e;
    }

    .zoom-btn.active .mm {
      color: rgba(245, 215, 110, 0.8);
    }

    #bottomRow {
      width: min(360px, 100%);
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
    }

    #shutter {
      width: 78px;
      height: 78px;
      border-radius: 50%;
      border: 5px solid #fff;
      background: transparent;
      padding: 0;
      display: grid;
      place-items: center;
      justify-self: center;
    }

    #shutter::before {
      content: "";
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: #fff;
    }

    #shutter:active::before {
      transform: scale(0.92);
      opacity: 0.75;
    }

    #shutter:disabled { opacity: 0.35; }

    #flipBtn {
      justify-self: end;
      width: 48px;
      height: 48px;
      border: 0;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.18);
      color: #fff;
      padding: 0;
      display: grid;
      place-items: center;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    #flipBtn svg {
      width: 32px;
      height: 32px;
      display: block;
    }

    #flipBtn:disabled { opacity: 0.35; }

    #gate {
      position: absolute;
      inset: 0;
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 12px;
      padding: 28px 24px;
      text-align: center;
      color: #fff;
      background: #000;
      z-index: 5;
      touch-action: manipulation;
    }

    #gate.show { display: flex; }

    #gate h1 {
      margin: 0;
      font-size: 22px;
      font-weight: 600;
    }

    #gate p {
      margin: 0;
      max-width: 20em;
      line-height: 1.5;
      color: rgba(255, 255, 255, 0.72);
      font-size: 15px;
    }

    #secureHint {
      display: none;
      font-size: 13px;
      color: #fbbf24;
    }

    #flash {
      position: absolute;
      inset: 0;
      background: #fff;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.08s ease;
    }

    #flash.show { opacity: 0.85; }

    canvas#shot { display: none; }
  </style>
</head>
<body>
  <div id="app">
    <div id="stage">
      <video id="preview" playsinline autoplay muted></video>
      <video id="previewBlur" playsinline autoplay muted></video>
    </div>
    <canvas id="shot"></canvas>
    <div id="flash"></div>

    <div id="overlay">
      <div id="topBar" class="show">
        <span id="apertureLabel">f/2.8</span>
        <input
          id="apertureSlider"
          type="range"
          min="0"
          max="1000"
          step="1"
          value="286"
          aria-label="景深光圈"
        />
      </div>
      <div id="toast"></div>
      <div id="controls" class="show">
        <div id="focalRow">
          <div id="modeBar">
            <button type="button" class="mode-btn active" data-mode="landscape">风景</button>
            <button type="button" class="mode-btn" data-mode="portrait">人像</button>
          </div>
          <div id="zoomRow">
            <div id="zoomBar"></div>
          </div>
        </div>
        <div id="bottomRow">
          <div></div>
          <button id="shutter" type="button" aria-label="拍照" disabled></button>
          <button id="flipBtn" type="button" aria-label="切换摄像头" disabled>
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path
                fill="currentColor"
                d="M12 8a4 4 0 1 0 4 4 4 4 0 0 0-4-4zm0 6.2a2.2 2.2 0 1 1 2.2-2.2A2.2 2.2 0 0 1 12 14.2z"
              />
              <path
                fill="currentColor"
                d="M9.8 5.2 8.6 6.8H7a2.8 2.8 0 0 0-2.8 2.8v6.4A2.8 2.8 0 0 0 7 18.8h10a2.8 2.8 0 0 0 2.8-2.8V9.6A2.8 2.8 0 0 0 17 6.8h-1.6L14.2 5.2a1.4 1.4 0 0 0-1.1-.5h-2.2a1.4 1.4 0 0 0-1.1.5z"
              />
              <path
                fill="currentColor"
                d="M20.2 3.1v3.6h-1.7l.9-.9A6.6 6.6 0 0 0 12.2 3v1.7a4.9 4.9 0 0 1 5.2 1.7l-.9.9h3.7V3.1zM3.8 20.9v-3.6h1.7l-.9.9A6.6 6.6 0 0 0 11.8 21v-1.7a4.9 4.9 0 0 1-5.2-1.7l.9-.9H3.8v3.7z"
              />
            </svg>
          </button>
        </div>
      </div>
    </div>

    <div id="gate" role="button" tabindex="0">
      <h1>Doyen</h1>
      <p>轻触开启相机</p>
      <p id="secureHint">需要 HTTPS 才能使用相机</p>
    </div>
  </div>

  <script>
    (function () {
      const video = document.getElementById("preview");
      const videoBlur = document.getElementById("previewBlur");
      const canvas = document.getElementById("shot");
      const shutter = document.getElementById("shutter");
      const flipBtn = document.getElementById("flipBtn");
      const toast = document.getElementById("toast");
      const gate = document.getElementById("gate");
      const secureHint = document.getElementById("secureHint");
      const flash = document.getElementById("flash");
      const controls = document.getElementById("controls");
      const topBar = document.getElementById("topBar");
      const zoomBar = document.getElementById("zoomBar");
      const modeBar = document.getElementById("modeBar");
      const focalRow = document.getElementById("focalRow");
      const apertureLabel = document.getElementById("apertureLabel");
      const apertureSlider = document.getElementById("apertureSlider");

      const F_MIN = 1.4;
      const F_MAX = 16;
      const SLIDER_MAX = 1000;

      // 以主摄 ≈24mm 为 1x，焦段换算成相对倍率
      const MODE_PRESETS = {
        landscape: {
          label: "风景",
          defaultZoom: 1,
          focals: [
            { name: "超广", mm: 13, zoom: 0.5 },
            { name: "广角", mm: 24, zoom: 1 },
            { name: "中景", mm: 35, zoom: 1.5 },
            { name: "压缩", mm: 70, zoom: 3 },
          ],
        },
        portrait: {
          label: "人像",
          defaultZoom: 2,
          focals: [
            { name: "环境", mm: 35, zoom: 1.5 },
            { name: "标准", mm: 50, zoom: 2 },
            { name: "经典", mm: 85, zoom: 3.5 },
            { name: "特写", mm: 135, zoom: 5.5 },
          ],
        },
      };

      let stream = null;
      let starting = false;
      let capturing = false;
      let flipping = false;
      let zooming = false;
      let toastTimer = null;
      let facingMode = "environment";
      let shootMode = "landscape";
      let zoomFactor = 1;
      let digitalScale = 1;
      let apertureF = 2.8;
      let supportZoom = false;
      let supportLensSwitch = false;
      let supportBackgroundBlur = false;
      let dofRaf = 0;
      let hwZoom = { min: 1, max: 1 };
      /** @type {{deviceId:string,label:string,kind:string,base:number}[]} */
      let lenses = [];
      let currentLens = null;
      let currentDeviceId = "";

      function currentPresets() {
        return MODE_PRESETS[shootMode] || MODE_PRESETS.landscape;
      }

      function findFocal(factor) {
        const list = currentPresets().focals;
        let best = list[0];
        let bestDiff = Infinity;
        for (let i = 0; i < list.length; i++) {
          const d = Math.abs(list[i].zoom - factor);
          if (d < bestDiff) {
            bestDiff = d;
            best = list[i];
          }
        }
        return best;
      }

      function isSecureEnough() {
        return (
          window.isSecureContext ||
          location.protocol === "https:" ||
          location.hostname === "localhost" ||
          location.hostname === "127.0.0.1"
        );
      }

      function isIOS() {
        return (
          /iPad|iPhone|iPod/.test(navigator.userAgent) ||
          (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1)
        );
      }

      if (!isSecureEnough()) secureHint.style.display = "block";

      function showToast(message, type) {
        toast.textContent = message;
        toast.className = "show" + (type ? " " + type : "");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(function () {
          toast.className = "";
        }, 1800);
      }

      function blinkFlash() {
        flash.classList.add("show");
        setTimeout(function () {
          flash.classList.remove("show");
        }, 90);
      }

      function getTrack() {
        return stream ? stream.getVideoTracks()[0] : null;
      }

      function clamp(n, min, max) {
        return Math.min(max, Math.max(min, n));
      }

      function isFrontLabel(label) {
        const l = (label || "").toLowerCase();
        return (
          l.includes("front") ||
          l.includes("user") ||
          l.includes("facetime") ||
          l.includes("前")
        );
      }

      function classifyDevice(device) {
        const l = (device.label || "").toLowerCase();
        if (l.includes("ultra") || l.includes("超广") || l.includes("0.5")) {
          return { kind: "ultrawide", base: 0.5 };
        }
        if (l.includes("tele") || l.includes("长焦")) {
          if (l.includes("5")) return { kind: "tele5", base: 5 };
          if (l.includes("3")) return { kind: "tele3", base: 3 };
          return { kind: "tele2", base: 2 };
        }
        if (l.includes("triple") || l.includes("dual") || l.includes("wide") || l.includes("后") || l.includes("back")) {
          return { kind: "wide", base: 1 };
        }
        return { kind: "wide", base: 1 };
      }

      function lensName(lens) {
        if (!lens) return "未知";
        if (lens.kind === "ultrawide") return "超广角";
        if (lens.kind === "tele5") return "长焦 5x";
        if (lens.kind === "tele3") return "长焦 3x";
        if (lens.kind === "tele2") return "长焦 2x";
        return "主摄";
      }

      function pickLensForZoom(factor) {
        if (facingMode !== "environment" || !lenses.length) return null;

        const ultra = lenses.find(function (l) { return l.kind === "ultrawide"; });
        const wide = lenses.find(function (l) { return l.kind === "wide"; }) || lenses[0];
        const tele2 = lenses.find(function (l) { return l.kind === "tele2"; });
        const tele3 = lenses.find(function (l) { return l.kind === "tele3"; });
        const tele5 = lenses.find(function (l) { return l.kind === "tele5"; });

        if (factor <= 0.7 && ultra) return ultra;
        if (factor >= 4.5 && tele5) return tele5;
        if (factor >= 2.8 && tele3) return tele3;
        if (factor >= 2.8 && tele5) return tele5;
        if (factor >= 1.7 && tele2) return tele2;
        if (factor >= 1.7 && tele3) return tele3;
        if (factor >= 1.7 && tele5) return tele5;
        return wide;
      }

      function renderFocalButtons() {
        const presets = currentPresets();
        zoomBar.innerHTML = "";
        presets.focals.forEach(function (focal) {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "zoom-btn";
          btn.dataset.zoom = String(focal.zoom);
          btn.innerHTML =
            "<span>" +
            focal.name +
            '</span><span class="mm">' +
            focal.mm +
            "mm</span>";
          btn.addEventListener("click", function () {
            if (facingMode !== "environment") return;
            applyZoomFactor(focal.zoom);
          });
          zoomBar.appendChild(btn);
        });
        updateZoomButtons();
        updateFocalAvailability();
      }

      function updateModeButtons() {
        Array.prototype.forEach.call(
          modeBar.querySelectorAll(".mode-btn"),
          function (btn) {
            btn.classList.toggle("active", btn.dataset.mode === shootMode);
          }
        );
      }

      async function setShootMode(mode) {
        if (!MODE_PRESETS[mode]) return;
        if (facingMode !== "environment") return;
        shootMode = mode;
        updateModeButtons();
        renderFocalButtons();

        const presets = currentPresets();
        const stillValid = presets.focals.some(function (f) {
          return Math.abs(f.zoom - zoomFactor) < 0.05;
        });
        const nextZoom = stillValid ? zoomFactor : presets.defaultZoom;
        await applyZoomFactor(nextZoom);
      }

      function layoutVideos() {
        const stageEl = document.getElementById("stage");
        const sw = stageEl.clientWidth || window.innerWidth || 1;
        const sh = stageEl.clientHeight || window.innerHeight || 1;
        const vw = video.videoWidth;
        const vh = video.videoHeight;
        if (!vw || !vh) return;

        // cover：短边撑满，再居中
        const scale = Math.max(sw / vw, sh / vh);
        const w = Math.ceil(vw * scale);
        const h = Math.ceil(vh * scale);

        [video, videoBlur].forEach(function (el) {
          el.style.top = "50%";
          el.style.left = "50%";
          el.style.width = w + "px";
          el.style.height = h + "px";
          el.style.minWidth = "0";
          el.style.minHeight = "0";
          el.style.maxWidth = "none";
          el.style.maxHeight = "none";
          el.style.objectFit = "fill";
        });
        updatePreviewTransform();
      }

      function updatePreviewTransform() {
        const parts = ["translate(-50%, -50%)"];
        if (facingMode === "user") parts.push("scaleX(-1)");
        if (digitalScale > 1.01) parts.push("scale(" + digitalScale + ")");
        const transform = parts.join(" ");
        video.style.transform = transform;
        videoBlur.style.transform = transform;
      }

      async function resumePreview() {
        if (!stream) return;
        try {
          await Promise.all([
            video.play().catch(function () {}),
            videoBlur.play().catch(function () {}),
          ]);
        } catch (_) {}
        requestAnimationFrame(function () {
          layoutVideos();
          requestAnimationFrame(layoutVideos);
        });
      }

      function updateZoomButtons() {
        Array.prototype.forEach.call(
          zoomBar.querySelectorAll(".zoom-btn"),
          function (btn) {
            btn.classList.toggle(
              "active",
              Math.abs(Number(btn.dataset.zoom) - zoomFactor) < 0.05
            );
          }
        );
      }

      function updateFocalAvailability() {
        focalRow.classList.toggle("front-locked", facingMode === "user");
      }

      function formatAperture(value) {
        const n = Number(value);
        // 显示一位小数，整数也写成 f/2.0 更稳；常用整档去尾零
        if (Math.abs(n - Math.round(n)) < 0.05) return "f/" + Math.round(n);
        return "f/" + n.toFixed(1);
      }

      function sliderToF(sliderValue) {
        const t = clamp(Number(sliderValue) / SLIDER_MAX, 0, 1);
        // 对数映射：滑动更符合光圈档位感知
        return F_MIN * Math.pow(F_MAX / F_MIN, t);
      }

      function fToSlider(f) {
        const t = Math.log(clamp(f, F_MIN, F_MAX) / F_MIN) / Math.log(F_MAX / F_MIN);
        return Math.round(t * SLIDER_MAX);
      }

      function getDofStrength() {
        // f/1.4 → 1（浅景深），f/16 → 0（深景深）
        const t = Math.log(clamp(apertureF, F_MIN, F_MAX) / F_MIN) / Math.log(F_MAX / F_MIN);
        return 1 - t;
      }

      function applySoftwareDof(strength) {
        document.documentElement.style.setProperty(
          "--dof-blur",
          (strength * 10).toFixed(2) + "px"
        );
        document.documentElement.style.setProperty(
          "--dof-amount",
          strength.toFixed(4)
        );
      }

      async function applyHardwareDof(strength) {
        if (!supportBackgroundBlur) return false;
        const track = getTrack();
        if (!track) return false;
        // 现成硬件/系统背景虚化通常只有开关，浅景深时打开
        const want = strength > 0.28;
        const settings =
          typeof track.getSettings === "function" ? track.getSettings() : {};
        if (settings.backgroundBlur === want) return true;
        try {
          await track.applyConstraints({ backgroundBlur: want });
          return true;
        } catch (_) {
          return false;
        }
      }

      function updateApertureUI(options) {
        options = options || {};
        apertureLabel.textContent = formatAperture(apertureF);
        if (!options.keepSlider) {
          apertureSlider.value = String(fToSlider(apertureF));
        }
        const strength = getDofStrength();
        applySoftwareDof(strength);
        if (!options.skipHardware) {
          applyHardwareDof(strength);
        }
      }

      function setApertureFromSlider(sliderValue, options) {
        apertureF = sliderToF(sliderValue);
        updateApertureUI(Object.assign({ keepSlider: true }, options || {}));
      }

      function onVideoGeometry() {
        layoutVideos();
      }

      video.addEventListener("loadedmetadata", onVideoGeometry);
      video.addEventListener("loadeddata", onVideoGeometry);
      video.addEventListener("playing", onVideoGeometry);
      video.addEventListener("resize", onVideoGeometry);
      videoBlur.addEventListener("loadedmetadata", onVideoGeometry);
      videoBlur.addEventListener("playing", onVideoGeometry);

      async function openStream(constraints) {
        return navigator.mediaDevices.getUserMedia(constraints);
      }

      async function openCamera(facing, deviceId) {
        const videoConstraint = deviceId
          ? {
              deviceId: { exact: deviceId },
              width: { ideal: 1920 },
              height: { ideal: 1080 },
            }
          : {
              facingMode: { ideal: facing },
              width: { ideal: 1920 },
              height: { ideal: 1080 },
            };

        let next;
        try {
          next = await openStream({ audio: false, video: videoConstraint });
        } catch (_) {
          next = await openStream({
            audio: false,
            video: { facingMode: { ideal: facing } },
          });
        }

        const prev = stream;
        stream = next;
        video.srcObject = stream;
        videoBlur.srcObject = stream;
        try {
          await Promise.all([
            video.play(),
            videoBlur.play().catch(function () {}),
          ]);
          layoutVideos();
          requestAnimationFrame(layoutVideos);
        } catch (err) {
          next.getTracks().forEach(function (t) { t.stop(); });
          stream = prev;
          video.srcObject = prev;
          videoBlur.srcObject = prev;
          if (prev) {
            await video.play().catch(function () {});
            await videoBlur.play().catch(function () {});
          }
          throw err;
        }

        if (prev && prev !== stream) {
          prev.getTracks().forEach(function (t) { t.stop(); });
        }

        facingMode = facing;
        const track = getTrack();
        const settings =
          track && typeof track.getSettings === "function" ? track.getSettings() : {};
        currentDeviceId = settings.deviceId || deviceId || "";

        if (facing === "environment" && currentDeviceId) {
          const matched = lenses.find(function (l) {
            return l.deviceId === currentDeviceId;
          });
          if (matched) currentLens = matched;
        } else if (facing === "user") {
          currentLens = null;
        }

        refreshHwZoom();
        digitalScale = 1;
        updatePreviewTransform();
        updateZoomButtons();
        updateFocalAvailability();
      }

      function refreshHwZoom() {
        supportZoom = false;
        hwZoom = { min: 1, max: 1 };
        const track = getTrack();
        if (!track || typeof track.getCapabilities !== "function") return;
        const caps = track.getCapabilities();
        if (caps && caps.zoom) {
          supportZoom = true;
          hwZoom.min = caps.zoom.min;
          hwZoom.max = caps.zoom.max;
        }
      }

      async function discoverLenses() {
        const devices = await navigator.mediaDevices.enumerateDevices();
        const backs = devices.filter(function (d) {
          return d.kind === "videoinput" && d.deviceId && !isFrontLabel(d.label);
        });

        const found = [];
        const used = {};

        backs.forEach(function (device) {
          const info = classifyDevice(device);
          const label = (device.label || "").toLowerCase();
          const distinctive =
            label.includes("ultra") ||
            label.includes("tele") ||
            label.includes("超广") ||
            label.includes("长焦") ||
            label.includes("dual") ||
            label.includes("triple") ||
            label.includes("wide");

          // 即使只有笼统 Back Camera，也先全部收集，后面用实切探测
          const key = distinctive ? info.kind : "back-" + found.length;
          if (used[key] && distinctive) return;
          used[key] = true;
          found.push({
            deviceId: device.deviceId,
            label: device.label || key,
            kind: distinctive ? info.kind : "wide",
            base: distinctive ? info.base : 1,
          });
        });

        // 若多个后置但都标成 wide，按顺序尝试：第1主摄、第2当超广/长焦候选
        if (found.length >= 2 && found.every(function (l) { return l.kind === "wide"; })) {
          found[0].kind = "wide";
          found[0].base = 1;
          found[1].kind = "ultrawide";
          found[1].base = 0.5;
          if (found[2]) {
            found[2].kind = "tele2";
            found[2].base = 2;
          }
          if (found[3]) {
            found[3].kind = "tele5";
            found[3].base = 5;
          }
        }

        lenses = found;
      }

      async function switchToLens(lens) {
        if (!lens || facingMode !== "environment") return false;
        if (currentLens && currentLens.deviceId === lens.deviceId) {
          currentLens = lens;
          return false;
        }

        try {
          await openCamera("environment", lens.deviceId);
          currentLens = lens;
          return true;
        } catch (_) {
          return false;
        }
      }

      async function applyZoomFactor(factor) {
        if (zooming) return;
        if (facingMode !== "environment") return;
        zooming = true;
        zoomFactor = factor;

        try {
          digitalScale = 1;
          refreshHwZoom();

          // 首选：系统 zoom（很多 iPhone 会据此自动换镜）
          if (supportZoom) {
            const track = getTrack();
            const z = clamp(factor, hwZoom.min, hwZoom.max);
            try {
              await track.applyConstraints({ advanced: [{ zoom: z }] });
              digitalScale = 1;
              updatePreviewTransform();
              updateZoomButtons();
              return;
            } catch (_) {
              // 继续尝试切 device / 数字变焦
            }
          }

          // 次选：多 deviceId 时按倍率切物理镜头
          const target = pickLensForZoom(factor);
          let switched = false;
          if (target && (supportLensSwitch || lenses.length >= 2)) {
            switched = await switchToLens(target);
            if (switched) supportLensSwitch = true;
          }

          if (switched) {
            digitalScale = 1;
            refreshHwZoom();
            if (supportZoom) {
              const track = getTrack();
              const base = (currentLens && currentLens.base) || 1;
              const relative = clamp(factor / base, hwZoom.min, hwZoom.max);
              try {
                await track.applyConstraints({ advanced: [{ zoom: relative }] });
              } catch (_) {}
            }
          } else if (factor < 1) {
            digitalScale = 1;
          } else if (Math.abs(factor - 1) < 0.05) {
            digitalScale = 1;
          } else {
            digitalScale = factor;
          }

          updatePreviewTransform();
          updateZoomButtons();
        } finally {
          zooming = false;
        }
      }

      async function initCapabilitiesQuietly() {
        await discoverLenses();
        refreshHwZoom();
        const track = getTrack();

        supportBackgroundBlur = false;
        if (track && typeof track.getCapabilities === "function") {
          const caps = track.getCapabilities() || {};
          if (
            Array.isArray(caps.backgroundBlur) &&
            caps.backgroundBlur.indexOf(true) !== -1 &&
            caps.backgroundBlur.indexOf(false) !== -1
          ) {
            supportBackgroundBlur = true;
          }
        }

        if (supportZoom && track) {
          try {
            const settings =
              typeof track.getSettings === "function" ? track.getSettings() : {};
            const current =
              typeof settings.zoom === "number" ? settings.zoom : hwZoom.min;
            const test = clamp(
              current + Math.max((hwZoom.max - hwZoom.min) * 0.02, 0.01),
              hwZoom.min,
              hwZoom.max
            );
            await track.applyConstraints({ advanced: [{ zoom: test }] });
            await track.applyConstraints({ advanced: [{ zoom: current }] });
            supportZoom = true;
          } catch (_) {
            supportZoom = false;
          }
        }

        supportLensSwitch = lenses.length >= 2;
        if (supportZoom && hwZoom.min < 0.99 && hwZoom.max > 1.5) {
          supportLensSwitch = true;
        }
      }

      async function startCamera() {
        if (stream || starting) return;
        starting = true;
        try {
          if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            throw new Error("当前浏览器不支持相机");
          }
          if (!isSecureEnough()) throw new Error("需要 HTTPS 才能使用相机");

          gate.classList.remove("show");
          controls.classList.add("show");

          await openCamera("environment");
          await initCapabilitiesQuietly();

          shootMode = "landscape";
          updateModeButtons();
          renderFocalButtons();
          await applyZoomFactor(MODE_PRESETS.landscape.defaultZoom);

          shutter.disabled = false;
          flipBtn.disabled = false;
          topBar.classList.add("show");
          updateApertureUI();
        } catch (err) {
          if (stream) {
            stream.getTracks().forEach(function (t) { t.stop(); });
            stream = null;
          }
          gate.classList.add("show");
          const msg = (err && err.message) || "无法打开相机";
          const gateText = gate.querySelector("p:not(#secureHint)");
          if (gateText) gateText.textContent = msg + "，轻触重试";
          showToast(msg, "err");
        } finally {
          starting = false;
        }
      }

      async function flipCamera() {
        if (!stream || flipping) return;
        flipping = true;
        flipBtn.disabled = true;
        try {
          const next = facingMode === "environment" ? "user" : "environment";
          await openCamera(next);
          if (next === "user") {
            zoomFactor = 1;
            digitalScale = 1;
            updatePreviewTransform();
            updateFocalAvailability();
          } else {
            const presets = currentPresets();
            await applyZoomFactor(presets.defaultZoom);
            updateFocalAvailability();
          }
        } catch (err) {
          showToast(err.message || "切换摄像头失败", "err");
        } finally {
          flipping = false;
          flipBtn.disabled = false;
        }
      }

      function drawVideoFrame(ctx, width, height) {
        if (digitalScale > 1.01) {
          const cropW = width / digitalScale;
          const cropH = height / digitalScale;
          const sx = (width - cropW) / 2;
          const sy = (height - cropH) / 2;
          ctx.drawImage(video, sx, sy, cropW, cropH, 0, 0, width, height);
        } else {
          ctx.drawImage(video, 0, 0, width, height);
        }
      }

      function captureFrame() {
        const width = video.videoWidth;
        const height = video.videoHeight;
        if (!width || !height) throw new Error("画面还没就绪");

        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext("2d");
        const strength = getDofStrength();

        ctx.save();
        if (facingMode === "user") {
          ctx.translate(width, 0);
          ctx.scale(-1, 1);
        }

        if (strength < 0.05) {
          drawVideoFrame(ctx, width, height);
          ctx.restore();
          return;
        }

        // 先画虚化层，再用径向蒙版叠清晰主体
        const blurPx = Math.max(2, strength * Math.min(width, height) * 0.012);
        ctx.filter = "blur(" + blurPx.toFixed(1) + "px)";
        drawVideoFrame(ctx, width, height);
        ctx.filter = "none";

        const sharp = document.createElement("canvas");
        sharp.width = width;
        sharp.height = height;
        const sctx = sharp.getContext("2d");
        if (facingMode === "user") {
          sctx.translate(width, 0);
          sctx.scale(-1, 1);
        }
        drawVideoFrame(sctx, width, height);

        const mask = document.createElement("canvas");
        mask.width = width;
        mask.height = height;
        const mctx = mask.getContext("2d");
        const grd = mctx.createRadialGradient(
          width * 0.5,
          height * 0.45,
          Math.min(width, height) * 0.22,
          width * 0.5,
          height * 0.45,
          Math.min(width, height) * 0.62
        );
        grd.addColorStop(0, "rgba(0,0,0,1)");
        grd.addColorStop(0.55, "rgba(0,0,0," + (0.75 - strength * 0.15).toFixed(2) + ")");
        grd.addColorStop(1, "rgba(0,0,0,0)");
        mctx.fillStyle = grd;
        mctx.fillRect(0, 0, width, height);
        sctx.globalCompositeOperation = "destination-in";
        sctx.setTransform(1, 0, 0, 1, 0, 0);
        sctx.drawImage(mask, 0, 0);

        ctx.drawImage(sharp, 0, 0);
        ctx.restore();
      }

      function canvasToBlob() {
        return new Promise(function (resolve, reject) {
          canvas.toBlob(
            function (blob) {
              if (blob) resolve(blob);
              else reject(new Error("生成图片失败"));
            },
            "image/jpeg",
            0.92
          );
        });
      }

      async function savePhoto(blob, filename) {
        const file = new File([blob], filename, { type: "image/jpeg" });
        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          await navigator.share({ files: [file] });
          return;
        }
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(function () {
          URL.revokeObjectURL(url);
        }, 1000);
        showToast(isIOS() ? "请用分享菜单存到照片" : "已下载", "ok");
      }

      async function onShutter() {
        if (capturing || !stream) return;
        capturing = true;
        shutter.disabled = true;
        blinkFlash();
        try {
          captureFrame();
          const blob = await canvasToBlob();
          const name =
            "doyen-" +
            new Date().toISOString().replace(/[:.]/g, "-") +
            ".jpg";
          await savePhoto(blob, name);
        } catch (err) {
          if (err && err.name === "AbortError") showToast("未保存");
          else showToast((err && err.message) || "拍照失败", "err");
        } finally {
          capturing = false;
          shutter.disabled = false;
        }
      }

      gate.addEventListener("click", startCamera);
      shutter.addEventListener("click", onShutter);
      flipBtn.addEventListener("click", flipCamera);

      Array.prototype.forEach.call(
        modeBar.querySelectorAll(".mode-btn"),
        function (btn) {
          btn.addEventListener("click", function () {
            setShootMode(btn.dataset.mode);
          });
        }
      );

      updateModeButtons();
      renderFocalButtons();
      updateApertureUI({ skipHardware: true });

      function onApertureInput() {
        const value = Number(apertureSlider.value);
        if (dofRaf) cancelAnimationFrame(dofRaf);
        dofRaf = requestAnimationFrame(function () {
          dofRaf = 0;
          setApertureFromSlider(value, { skipHardware: true });
        });
      }

      function onApertureCommit() {
        if (dofRaf) {
          cancelAnimationFrame(dofRaf);
          dofRaf = 0;
        }
        setApertureFromSlider(Number(apertureSlider.value));
      }

      apertureSlider.addEventListener("input", onApertureInput);
      apertureSlider.addEventListener("change", onApertureCommit);
      apertureSlider.addEventListener("pointerup", onApertureCommit);
      apertureSlider.addEventListener("touchend", onApertureCommit);

      document.addEventListener("visibilitychange", function () {
        if (!document.hidden) resumePreview();
      });
      window.addEventListener("pageshow", function () {
        resumePreview();
      });
      window.addEventListener("resize", function () {
        layoutVideos();
      });
      window.addEventListener("orientationchange", function () {
        setTimeout(layoutVideos, 120);
      });

      // 直接进入拍摄页并尝试开相机；失败再显示轻触重试
      startCamera();
    })();
  </script>
</body>
</html>
