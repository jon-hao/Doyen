<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
  />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Doyen Camera</title>
  <style>
    :root {
      color-scheme: dark;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      height: 100%;
      background: #000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overflow: hidden;
      touch-action: manipulation;
    }

    #app {
      position: relative;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }

    #stage {
      position: absolute;
      inset: 0;
      overflow: hidden;
      background: #000;
    }

    #preview {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: #000;
      transform-origin: center center;
      transition: transform 0.12s ease-out;
    }

    #preview.mirror {
      transform: scaleX(-1);
    }

    #preview.zoom2 {
      transform: scale(2);
    }

    #preview.mirror.zoom2 {
      transform: scaleX(-1) scale(2);
    }

    #overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      padding: 20px 16px calc(28px + var(--safe-bottom));
      pointer-events: none;
    }

    #toast {
      min-height: 24px;
      margin-bottom: 12px;
      padding: 8px 14px;
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.55);
      color: #fff;
      font-size: 14px;
      opacity: 0;
      transition: opacity 0.2s ease;
      pointer-events: none;
      text-align: center;
      max-width: 90%;
    }

    #toast.show { opacity: 1; }
    #toast.ok { background: rgba(22, 163, 74, 0.85); }
    #toast.err { background: rgba(220, 38, 38, 0.85); }

    #controls {
      pointer-events: auto;
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      width: 100%;
    }

    #controls.show { display: flex; }

    #zoomBar {
      display: flex;
      gap: 8px;
      padding: 6px 8px;
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.38);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .zoom-btn {
      min-width: 44px;
      height: 44px;
      border: 0;
      border-radius: 50%;
      background: transparent;
      color: rgba(255, 255, 255, 0.8);
      font-size: 13px;
      font-weight: 600;
    }

    .zoom-btn.active {
      background: rgba(255, 255, 255, 0.2);
      color: #f5d76e;
    }

    #bottomRow {
      width: min(360px, 100%);
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
    }

    #shutter {
      width: 78px;
      height: 78px;
      border-radius: 50%;
      border: 5px solid #fff;
      background: transparent;
      padding: 0;
      display: grid;
      place-items: center;
      justify-self: center;
    }

    #shutter::before {
      content: "";
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: #fff;
    }

    #shutter:active::before {
      transform: scale(0.92);
      opacity: 0.75;
    }

    #shutter:disabled { opacity: 0.35; }

    #flipBtn {
      justify-self: end;
      width: 48px;
      height: 48px;
      border: 0;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.18);
      color: #fff;
      font-size: 20px;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    #flipBtn:disabled { opacity: 0.35; }

    #hint {
      font-size: 11px;
      color: rgba(255, 255, 255, 0.5);
      text-align: center;
    }

    #gate,
    #probe {
      position: absolute;
      inset: 0;
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 12px;
      padding: 28px 24px;
      text-align: center;
      color: #fff;
      background: #000;
      z-index: 5;
      touch-action: manipulation;
    }

    #gate.show,
    #probe.show { display: flex; }

    #probe { background: rgba(0, 0, 0, 0.92); z-index: 6; }

    #gate h1,
    #probe h2 {
      margin: 0;
      font-size: 22px;
      font-weight: 600;
    }

    #gate p,
    #probeStatus {
      margin: 0;
      max-width: 20em;
      line-height: 1.5;
      color: rgba(255, 255, 255, 0.72);
      font-size: 15px;
    }

    #secureHint {
      display: none;
      font-size: 13px;
      color: #fbbf24;
    }

    #probeList {
      width: min(360px, 100%);
      margin: 4px 0 0;
      padding: 14px 16px;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.08);
      text-align: left;
      list-style: none;
    }

    #probeList li {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 8px 0;
      font-size: 14px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    #probeList li:last-child { border-bottom: 0; }
    #probeList .ok { color: #4ade80; font-weight: 600; }
    #probeList .no { color: #f87171; font-weight: 600; }
    #probeList .label { color: rgba(255, 255, 255, 0.78); }

    #probeEnter {
      margin-top: 8px;
      border: 0;
      border-radius: 12px;
      padding: 12px 20px;
      font-size: 16px;
      font-weight: 600;
      color: #111;
      background: #fff;
    }

    #probeEnter[hidden] { display: none; }

    #flash {
      position: absolute;
      inset: 0;
      background: #fff;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.08s ease;
    }

    #flash.show { opacity: 0.85; }

    canvas#shot { display: none; }
  </style>
</head>
<body>
  <div id="app">
    <div id="stage">
      <video id="preview" playsinline autoplay muted></video>
    </div>
    <canvas id="shot"></canvas>
    <div id="flash"></div>

    <div id="overlay">
      <div id="toast"></div>
      <div id="controls">
        <div id="zoomBar">
          <button type="button" class="zoom-btn active" data-zoom="1">1x</button>
          <button type="button" class="zoom-btn" data-zoom="2">2x</button>
        </div>
        <div id="bottomRow">
          <div></div>
          <button id="shutter" type="button" aria-label="拍照" disabled></button>
          <button id="flipBtn" type="button" aria-label="切换摄像头" disabled>⟲</button>
        </div>
        <div id="hint"></div>
      </div>
    </div>

    <div id="gate" class="show" role="button" tabindex="0">
      <h1>Doyen</h1>
      <p>轻触开启相机。同意权限后，会先检测是否支持系统变焦。</p>
      <p id="secureHint">需要 HTTPS 才能使用相机</p>
    </div>

    <div id="probe">
      <h2>能力检测</h2>
      <p id="probeStatus">正在检测…</p>
      <ul id="probeList" hidden></ul>
      <button id="probeEnter" type="button" hidden>进入拍摄</button>
    </div>
  </div>

  <script>
    (function () {
      const video = document.getElementById("preview");
      const canvas = document.getElementById("shot");
      const shutter = document.getElementById("shutter");
      const flipBtn = document.getElementById("flipBtn");
      const toast = document.getElementById("toast");
      const gate = document.getElementById("gate");
      const secureHint = document.getElementById("secureHint");
      const flash = document.getElementById("flash");
      const controls = document.getElementById("controls");
      const hint = document.getElementById("hint");
      const probe = document.getElementById("probe");
      const probeStatus = document.getElementById("probeStatus");
      const probeList = document.getElementById("probeList");
      const probeEnter = document.getElementById("probeEnter");

      let stream = null;
      let starting = false;
      let capturing = false;
      let flipping = false;
      let toastTimer = null;
      let facingMode = "environment"; // environment | user
      let zoomFactor = 1;
      let supportZoom = false;
      let supportLensSwitch = false;

      function isSecureEnough() {
        return (
          window.isSecureContext ||
          location.protocol === "https:" ||
          location.hostname === "localhost" ||
          location.hostname === "127.0.0.1"
        );
      }

      function isIOS() {
        return (
          /iPad|iPhone|iPod/.test(navigator.userAgent) ||
          (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1)
        );
      }

      if (!isSecureEnough()) secureHint.style.display = "block";

      function showToast(message, type) {
        toast.textContent = message;
        toast.className = "show" + (type ? " " + type : "");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(function () {
          toast.className = "";
        }, 1800);
      }

      function blinkFlash() {
        flash.classList.add("show");
        setTimeout(function () {
          flash.classList.remove("show");
        }, 90);
      }

      function getTrack() {
        return stream ? stream.getVideoTracks()[0] : null;
      }

      function updatePreviewTransform() {
        video.classList.toggle("mirror", facingMode === "user");
        video.classList.toggle("zoom2", zoomFactor >= 1.5);
      }

      function updateZoomButtons() {
        Array.prototype.forEach.call(
          document.querySelectorAll(".zoom-btn"),
          function (btn) {
            btn.classList.toggle(
              "active",
              Number(btn.dataset.zoom) === zoomFactor
            );
          }
        );
      }

      function updateHint() {
        hint.textContent =
          (facingMode === "user" ? "前置摄像头" : "后置摄像头") +
          " · zoom " +
          (supportZoom ? "✓" : "✗") +
          " · 切镜头 " +
          (supportLensSwitch ? "✓" : "✗") +
          " · " +
          zoomFactor +
          "x";
      }

      async function openCamera(facing) {
        const constraints = {
          audio: false,
          video: {
            facingMode: { ideal: facing },
            width: { ideal: 1920 },
            height: { ideal: 1080 },
          },
        };

        let next;
        try {
          next = await navigator.mediaDevices.getUserMedia(constraints);
        } catch (_) {
          next = await navigator.mediaDevices.getUserMedia({
            audio: false,
            video: true,
          });
        }

        const prev = stream;
        stream = next;
        video.srcObject = stream;
        await video.play();
        if (prev) prev.getTracks().forEach(function (t) { t.stop(); });
        facingMode = facing;
        zoomFactor = 1;
        updatePreviewTransform();
        updateZoomButtons();
        updateHint();
      }

      function probeTrackZoom() {
        const track = getTrack();
        supportZoom = false;
        if (!track || typeof track.getCapabilities !== "function") return;

        const caps = track.getCapabilities();
        if (!(caps && caps.zoom)) return;

        const settings =
          typeof track.getSettings === "function" ? track.getSettings() : {};
        const current =
          typeof settings.zoom === "number" ? settings.zoom : caps.zoom.min;

        return track
          .applyConstraints({
            advanced: [
              {
                zoom: Math.min(
                  caps.zoom.max,
                  current + Math.max((caps.zoom.max - caps.zoom.min) * 0.02, 0.01)
                ),
              },
            ],
          })
          .then(function () {
            return track.applyConstraints({ advanced: [{ zoom: current }] });
          })
          .then(function () {
            supportZoom = true;
          })
          .catch(function () {
            supportZoom = false;
          });
      }

      async function runCapabilityProbe() {
        probeStatus.textContent = "检测系统变焦…";
        supportLensSwitch = false;

        const devices = await navigator.mediaDevices.enumerateDevices();
        const videos = devices.filter(function (d) {
          return d.kind === "videoinput";
        });
        const backCount = videos.filter(function (d) {
          const l = (d.label || "").toLowerCase();
          return !l.includes("front") && !l.includes("前") && !l.includes("facetime");
        }).length;

        await Promise.resolve(probeTrackZoom());

        // 网页几乎无法可靠切超广角/长焦；这里只报告，不启用
        supportLensSwitch = false;

        return {
          supportZoom: supportZoom,
          supportLensSwitch: supportLensSwitch,
          backCount: backCount,
          deviceCount: videos.length,
        };
      }

      function showProbeResult(report) {
        probeStatus.textContent = "检测完成";
        probeList.hidden = false;
        probeList.innerHTML =
          '<li><span class="label">系统变焦 zoom</span><span class="' +
          (report.supportZoom ? "ok" : "no") +
          '">' +
          (report.supportZoom ? "支持" : "不支持") +
          "</span></li>" +
          '<li><span class="label">切换物理镜头</span><span class="' +
          (report.supportLensSwitch ? "ok" : "no") +
          '">' +
          (report.supportLensSwitch ? "支持" : "不支持") +
          "</span></li>" +
          '<li><span class="label">摄像头数量</span><span class="label">' +
          report.deviceCount +
          "</span></li>" +
          '<li><span class="label">变焦方式</span><span class="label">' +
          (report.supportZoom ? "系统变焦优先" : "数字变焦 1x/2x") +
          "</span></li>";
        probeEnter.hidden = false;
      }

      async function startCamera() {
        if (stream || starting) return;
        starting = true;

        try {
          if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            throw new Error("当前浏览器不支持相机");
          }
          if (!isSecureEnough()) {
            throw new Error("需要 HTTPS 才能使用相机");
          }

          gate.classList.remove("show");
          probe.classList.add("show");
          probeEnter.hidden = true;
          probeList.hidden = true;
          probeStatus.textContent = "请在系统弹窗中允许相机权限…";

          await openCamera("environment");
          probeStatus.textContent = "权限已获取，正在检测能力…";
          const report = await runCapabilityProbe();
          showProbeResult(report);
        } catch (err) {
          probe.classList.remove("show");
          gate.classList.add("show");
          if (stream) {
            stream.getTracks().forEach(function (t) { t.stop(); });
            stream = null;
          }
          showToast(err.message || "无法打开相机", "err");
        } finally {
          starting = false;
        }
      }

      function enterShootMode() {
        probe.classList.remove("show");
        controls.classList.add("show");
        shutter.disabled = false;
        flipBtn.disabled = false;
        updateHint();
        if (!supportZoom && !supportLensSwitch) {
          showToast("将使用数字变焦；可切换前置摄像头", "ok");
        }
      }

      async function flipCamera() {
        if (!stream || flipping) return;
        flipping = true;
        flipBtn.disabled = true;
        try {
          const next = facingMode === "environment" ? "user" : "environment";
          await openCamera(next);
          showToast(next === "user" ? "已切换到前置摄像头" : "已切换到后置摄像头", "ok");
        } catch (err) {
          showToast(err.message || "切换摄像头失败", "err");
        } finally {
          flipping = false;
          flipBtn.disabled = false;
        }
      }

      function setZoom(factor) {
        zoomFactor = factor;
        updatePreviewTransform();
        updateZoomButtons();
        updateHint();

        if (supportZoom) {
          const track = getTrack();
          if (track && typeof track.getCapabilities === "function") {
            const caps = track.getCapabilities();
            if (caps && caps.zoom) {
              const z = Math.min(
                caps.zoom.max,
                Math.max(caps.zoom.min, factor)
              );
              track.applyConstraints({ advanced: [{ zoom: z }] }).catch(function () {});
            }
          }
        }
      }

      function captureFrame() {
        const width = video.videoWidth;
        const height = video.videoHeight;
        if (!width || !height) throw new Error("画面还没就绪");

        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext("2d");

        if (facingMode === "user") {
          ctx.translate(width, 0);
          ctx.scale(-1, 1);
        }

        if (zoomFactor > 1.01) {
          const cropW = width / zoomFactor;
          const cropH = height / zoomFactor;
          const sx = (width - cropW) / 2;
          const sy = (height - cropH) / 2;
          ctx.drawImage(video, sx, sy, cropW, cropH, 0, 0, width, height);
        } else {
          ctx.drawImage(video, 0, 0, width, height);
        }
      }

      function canvasToBlob() {
        return new Promise(function (resolve, reject) {
          canvas.toBlob(
            function (blob) {
              if (blob) resolve(blob);
              else reject(new Error("生成图片失败"));
            },
            "image/jpeg",
            0.92
          );
        });
      }

      async function savePhoto(blob, filename) {
        const file = new File([blob], filename, { type: "image/jpeg" });
        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          await navigator.share({ files: [file] });
          return;
        }
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(function () {
          URL.revokeObjectURL(url);
        }, 1000);
        showToast(isIOS() ? "请用分享菜单存到照片" : "已下载", "ok");
      }

      async function onShutter() {
        if (capturing || !stream) return;
        capturing = true;
        shutter.disabled = true;
        blinkFlash();
        try {
          captureFrame();
          const blob = await canvasToBlob();
          const name =
            "doyen-" +
            new Date().toISOString().replace(/[:.]/g, "-") +
            ".jpg";
          await savePhoto(blob, name);
        } catch (err) {
          if (err && err.name === "AbortError") showToast("未保存");
          else showToast((err && err.message) || "拍照失败", "err");
        } finally {
          capturing = false;
          shutter.disabled = false;
        }
      }

      gate.addEventListener("click", function () {
        startCamera();
      });
      probeEnter.addEventListener("click", enterShootMode);
      shutter.addEventListener("click", onShutter);
      flipBtn.addEventListener("click", flipCamera);

      Array.prototype.forEach.call(
        document.querySelectorAll(".zoom-btn"),
        function (btn) {
          btn.addEventListener("click", function () {
            setZoom(Number(btn.dataset.zoom));
          });
        }
      );

      document.addEventListener("visibilitychange", function () {
        if (!document.hidden && stream) {
          video.play().catch(function () {});
        }
      });

      // 已授权时尝试自动开始
      (async function () {
        try {
          if (navigator.permissions && navigator.permissions.query) {
            const status = await navigator.permissions.query({ name: "camera" });
            if (status.state === "granted") startCamera();
          }
        } catch (_) {}
      })();
    })();
  </script>
</body>
</html>
