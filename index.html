<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
  />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Doyen Camera</title>
  <style>
    :root {
      color-scheme: dark;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      height: 100%;
      background: #000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overflow: hidden;
      touch-action: none;
    }

    #app {
      position: relative;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }

    #stage {
      position: absolute;
      inset: 0;
      overflow: hidden;
      background: #000;
    }

    #preview {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: #000;
      transform-origin: center center;
      transition: transform 0.12s ease-out;
      will-change: transform;
    }

    #preview.dragging {
      transition: none;
    }

    #overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      padding: 16px 16px calc(24px + var(--safe-bottom));
      pointer-events: none;
    }

    #toast {
      min-height: 24px;
      margin-bottom: 10px;
      padding: 8px 14px;
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.55);
      color: #fff;
      font-size: 14px;
      opacity: 0;
      transition: opacity 0.2s ease;
      pointer-events: none;
      text-align: center;
      max-width: 90%;
    }

    #toast.show { opacity: 1; }
    #toast.ok { background: rgba(22, 163, 74, 0.85); }
    #toast.err { background: rgba(220, 38, 38, 0.85); }

    #zoomStack {
      pointer-events: auto;
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      margin-bottom: 18px;
      width: min(420px, 100%);
    }

    #zoomStack.show { display: flex; }

    #dialWrap {
      position: relative;
      width: min(340px, 90vw);
      height: 150px;
      touch-action: none;
    }

    #zoomReadout {
      position: absolute;
      left: 50%;
      top: 10px;
      transform: translateX(-50%);
      color: #f5d76e;
      font-size: 16px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.45);
      pointer-events: none;
      z-index: 2;
    }

    #dialCanvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    #zoomBar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 6px 8px;
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.38);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .zoom-btn {
      min-width: 44px;
      height: 44px;
      padding: 0 8px;
      border: 0;
      border-radius: 50%;
      background: transparent;
      color: rgba(255, 255, 255, 0.78);
      font-size: 13px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }

    .zoom-btn.active {
      background: rgba(255, 255, 255, 0.2);
      color: #f5d76e;
      font-size: 14px;
    }

    #lensHint {
      font-size: 11px;
      color: rgba(255, 255, 255, 0.55);
      min-height: 14px;
      text-align: center;
      max-width: 92vw;
      line-height: 1.35;
      padding: 0 8px;
    }

    #shutter {
      pointer-events: auto;
      width: 78px;
      height: 78px;
      border-radius: 50%;
      border: 5px solid #fff;
      background: transparent;
      padding: 0;
      display: grid;
      place-items: center;
    }

    #shutter::before {
      content: "";
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: #fff;
    }

    #shutter:active::before {
      transform: scale(0.92);
      opacity: 0.75;
    }

    #shutter:disabled { opacity: 0.35; }

    #gate {
      position: absolute;
      inset: 0;
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 12px;
      padding: 32px;
      text-align: center;
      color: #fff;
      background: #000;
      cursor: pointer;
      touch-action: manipulation;
      z-index: 5;
    }

    #gate.show { display: flex; }

    #gate h1 {
      margin: 0;
      font-size: 28px;
      font-weight: 600;
    }

    #gate p {
      margin: 0;
      max-width: 18em;
      line-height: 1.5;
      color: rgba(255, 255, 255, 0.72);
      font-size: 15px;
    }

    #secureHint {
      display: none;
      font-size: 13px;
      color: #fbbf24;
    }

    #probe {
      position: absolute;
      inset: 0;
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 14px;
      padding: 28px 24px;
      text-align: center;
      color: #fff;
      background: rgba(0, 0, 0, 0.92);
      z-index: 6;
      touch-action: manipulation;
    }

    #probe.show { display: flex; }

    #probe h2 {
      margin: 0;
      font-size: 20px;
      font-weight: 600;
    }

    #probeStatus {
      margin: 0;
      color: rgba(255, 255, 255, 0.7);
      font-size: 14px;
      line-height: 1.5;
    }

    #probeList {
      width: min(360px, 100%);
      margin: 4px 0 0;
      padding: 14px 16px;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.08);
      text-align: left;
      list-style: none;
    }

    #probeList li {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 8px 0;
      font-size: 14px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    #probeList li:last-child {
      border-bottom: 0;
    }

    #probeList .ok { color: #4ade80; font-weight: 600; }
    #probeList .no { color: #f87171; font-weight: 600; }
    #probeList .label { color: rgba(255, 255, 255, 0.78); }

    #probeEnter {
      margin-top: 8px;
      border: 0;
      border-radius: 12px;
      padding: 12px 20px;
      font-size: 16px;
      font-weight: 600;
      color: #111;
      background: #fff;
    }

    #probeEnter[hidden] { display: none; }

    #flash {
      position: absolute;
      inset: 0;
      background: #fff;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.08s ease;
    }

    #flash.show { opacity: 0.85; }

    canvas#shot { display: none; }
  </style>
</head>
<body>
  <div id="app">
    <div id="stage">
      <video id="preview" playsinline autoplay muted></video>
    </div>
    <canvas id="shot"></canvas>
    <div id="flash"></div>

    <div id="overlay">
      <div id="toast"></div>
      <div id="zoomStack">
        <div id="dialWrap">
          <canvas id="dialCanvas" width="680" height="300"></canvas>
          <div id="zoomReadout">1x</div>
        </div>
        <div id="zoomBar" aria-label="焦距快捷切换"></div>
        <div id="lensHint"></div>
      </div>
      <button id="shutter" type="button" aria-label="拍照" disabled></button>
    </div>

    <div id="gate" class="show" role="button" tabindex="0" aria-label="轻触开启相机">
      <h1>Doyen</h1>
      <p>轻触开启相机。同意权限后，会先检测是否支持系统变焦和切换镜头。</p>
      <p id="secureHint">需要 HTTPS 才能使用相机</p>
    </div>

    <div id="probe" aria-live="polite">
      <h2>能力检测</h2>
      <p id="probeStatus">正在检测…</p>
      <ul id="probeList" hidden></ul>
      <button id="probeEnter" type="button" hidden>进入拍摄</button>
    </div>
  </div>

  <script>
    (function () {
      const video = document.getElementById("preview");
      const canvas = document.getElementById("shot");
      const shutter = document.getElementById("shutter");
      const toast = document.getElementById("toast");
      const gate = document.getElementById("gate");
      const secureHint = document.getElementById("secureHint");
      const flash = document.getElementById("flash");
      const zoomStack = document.getElementById("zoomStack");
      const zoomBar = document.getElementById("zoomBar");
      const lensHint = document.getElementById("lensHint");
      const dialCanvas = document.getElementById("dialCanvas");
      const dialWrap = document.getElementById("dialWrap");
      const zoomReadout = document.getElementById("zoomReadout");
      const dialCtx = dialCanvas.getContext("2d");
      const probe = document.getElementById("probe");
      const probeStatus = document.getElementById("probeStatus");
      const probeList = document.getElementById("probeList");
      const probeEnter = document.getElementById("probeEnter");

      let stream = null;
      let starting = false;
      let capturing = false;
      let switchingLens = false;
      let toastTimer = null;
      let probePassed = false;
      let supportZoom = false;
      let supportLensSwitch = false;

      /** @type {{deviceId:string,label:string,kind:'ultrawide'|'wide'|'tele',base:number}[]} */
      let lenses = [];
      let currentLens = null;
      let allBackCameras = [];
      let capabilityNote = "检测中…";

      const zoom = {
        value: 1,
        min: 0.5,
        max: 5,
        hardware: false,
        hwMin: 1,
        hwMax: 1,
        digital: 1,
        presets: [0.5, 1, 2],
      };

      let dialDragging = false;
      let dialRotation = 0; // 转盘旋转角：盘转、针不动
      let dragStartAngle = 0;
      let dragStartRotation = 0;
      let pinchActive = false;
      let pinchStartDistance = 0;
      let pinchStartZoom = 1;
      let switchToken = 0;
      let lastHwZoomToastAt = 0;
      let pendingHwZoomToast = false;
      let lastGoodStream = null;

      // 镜头切换滞回，避免转盘在边界抖切
      const HYST = {
        toUltra: 0.85,
        leaveUltra: 1.05,
        toTele: 1.95,
        leaveTele: 1.75,
      };

      function isSecureEnough() {
        return (
          window.isSecureContext ||
          location.protocol === "https:" ||
          location.hostname === "localhost" ||
          location.hostname === "127.0.0.1"
        );
      }

      function isIOS() {
        return (
          /iPad|iPhone|iPod/.test(navigator.userAgent) ||
          (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1)
        );
      }

      if (!isSecureEnough()) secureHint.style.display = "block";

      function showToast(message, type) {
        toast.textContent = message;
        toast.className = "show" + (type ? " " + type : "");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(function () {
          toast.className = "";
        }, 1600);
      }

      function blinkFlash() {
        flash.classList.add("show");
        setTimeout(function () {
          flash.classList.remove("show");
        }, 90);
      }

      function clamp(n, min, max) {
        return Math.min(max, Math.max(min, n));
      }

      function formatZoomLabel(value) {
        if (Math.abs(value - 0.5) < 0.04) return ".5";
        const rounded = Math.round(value * 10) / 10;
        if (Math.abs(rounded - Math.round(rounded)) < 0.05) {
          return String(Math.round(rounded));
        }
        return rounded.toFixed(1);
      }

      function getTrack() {
        return stream ? stream.getVideoTracks()[0] : null;
      }

      function isFrontLabel(label) {
        const l = (label || "").toLowerCase();
        return (
          l.includes("front") ||
          l.includes("user") ||
          l.includes("facetime") ||
          l.includes("前")
        );
      }

      function classifyDevice(device) {
        const l = (device.label || "").toLowerCase();
        if (
          l.includes("ultra") ||
          l.includes("超广") ||
          l.includes("0.5")
        ) {
          return { kind: "ultrawide", base: 0.5 };
        }
        if (
          l.includes("tele") ||
          l.includes("长焦") ||
          l.includes("5x") ||
          l.includes("3x")
        ) {
          const base = l.includes("5") ? 5 : l.includes("3") ? 3 : 2;
          return { kind: "tele", base: base };
        }
        return { kind: "wide", base: 1 };
      }

      async function discoverLenses() {
        const devices = await navigator.mediaDevices.enumerateDevices();
        allBackCameras = devices.filter(function (d) {
          return d.kind === "videoinput" && d.deviceId && !isFrontLabel(d.label);
        });

        const found = [];
        const usedKinds = {};

        allBackCameras.forEach(function (device) {
          const info = classifyDevice(device);
          // 每类镜头优先保留一个（仅当 label 能区分时才有意义）
          if (usedKinds[info.kind]) return;
          // 若 label 都是笼统的 Back Camera，不要假装有多颗镜头
          const label = (device.label || "").toLowerCase();
          const distinctive =
            label.includes("ultra") ||
            label.includes("tele") ||
            label.includes("超广") ||
            label.includes("长焦") ||
            label.includes("wide") ||
            label.includes("dual") ||
            label.includes("triple");
          if (!distinctive && allBackCameras.length <= 2) {
            // iPhone 常见：Front + Back，无法区分超广/长焦
            return;
          }
          usedKinds[info.kind] = true;
          found.push({
            deviceId: device.deviceId,
            label: device.label || info.kind,
            kind: info.kind,
            base: info.base,
          });
        });

        // 若完全分不出多镜头，至少保留当前轨
        if (!found.length && stream) {
          const track = getTrack();
          const settings = track && track.getSettings ? track.getSettings() : {};
          found.push({
            deviceId: settings.deviceId || "",
            label: track ? track.label : "camera",
            kind: "wide",
            base: 1,
          });
        }

        lenses = found.sort(function (a, b) {
          return a.base - b.base;
        });

        // 无级范围：有超广则从 0.5，否则从 1；上限看长焦/数字
        // 即使没有超广硬件，也保留 0.5 UI，用数字变焦模拟观感
        zoom.min = 0.5;

        const tele = lenses.find(function (l) {
          return l.kind === "tele";
        });
        zoom.max = tele ? Math.max(5, tele.base * 2) : 5;

        zoom.presets = buildPresets(zoom.min, zoom.max, lenses);
      }

      function describeCapabilities() {
        const track = getTrack();
        const label = track ? track.label || "未命名相机" : "无";
        const caps =
          track && typeof track.getCapabilities === "function"
            ? track.getCapabilities()
            : {};
        const settings =
          track && typeof track.getSettings === "function"
            ? track.getSettings()
            : {};
        const hasZoomCap = !!(caps && caps.zoom);
        const multiLens = lenses.length > 1;
        const backCount = allBackCameras.length;

        if (multiLens && hasZoomCap) {
          capabilityNote =
            "硬件可用：多镜头 + 系统变焦｜" + label;
        } else if (multiLens) {
          capabilityNote =
            "部分硬件：可切镜头，无系统 zoom｜" + label;
        } else if (hasZoomCap) {
          capabilityNote =
            "部分硬件：单镜头系统变焦｜" + label;
        } else {
          capabilityNote =
            "数字变焦（Safari 未开放物理镜头/zoom）｜后置设备 " +
            backCount +
            " 个｜" +
            label;
        }

        return {
          hasZoomCap,
          multiLens,
          backCount,
          label,
          zoomSettings: settings.zoom,
          zoomCaps: caps.zoom || null,
        };
      }

      function buildPresets(min, max, lensList) {
        const presets = [];
        if (min <= 0.55 || lensList.some(function (l) { return l.kind === "ultrawide"; })) {
          presets.push(0.5);
        }
        presets.push(1);
        if (max >= 1.8 || lensList.some(function (l) { return l.kind === "tele" && l.base <= 2; })) {
          presets.push(2);
        }
        if (max >= 2.8 || lensList.some(function (l) { return l.kind === "tele" && l.base >= 3; })) {
          presets.push(3);
        }
        if (max >= 4.5 || lensList.some(function (l) { return l.kind === "tele" && l.base >= 5; })) {
          presets.push(5);
        }
        return presets;
      }

      function pickLensForZoom(logicalZoom, current) {
        const ultra = lenses.find(function (l) { return l.kind === "ultrawide"; });
        const wide = lenses.find(function (l) { return l.kind === "wide"; }) || lenses[0];
        const tele = lenses.find(function (l) { return l.kind === "tele"; });

        let kind = (current && current.kind) || "wide";

        if (kind === "ultrawide") {
          if (logicalZoom >= HYST.leaveUltra) kind = "wide";
        } else if (kind === "tele") {
          if (logicalZoom <= HYST.leaveTele) kind = "wide";
        } else {
          if (ultra && logicalZoom <= HYST.toUltra) kind = "ultrawide";
          else if (tele && logicalZoom >= HYST.toTele) kind = "tele";
          else kind = "wide";
        }

        if (kind === "ultrawide" && ultra) return ultra;
        if (kind === "tele" && tele) return tele;
        return wide || lenses[0] || null;
      }

      function lensCaption(lens) {
        if (!lens) return "";
        if (lens.kind === "ultrawide") return "超广角镜头";
        if (lens.kind === "tele") return "长焦镜头";
        if (lenses.length > 1) return "主摄";
        return zoom.hardware ? "系统变焦" : "数字变焦";
      }

      function toastHardware(message) {
        showToast(message, "ok");
      }

      function toastHardwareZoom(force) {
        const now = Date.now();
        if (!force && now - lastHwZoomToastAt < 900) {
          pendingHwZoomToast = true;
          return;
        }
        lastHwZoomToastAt = now;
        pendingHwZoomToast = false;
        toastHardware(
          "硬件：系统变焦 " + formatZoomLabel(zoom.value) + "x"
        );
      }

      function flushHardwareZoomToast() {
        if (pendingHwZoomToast) {
          toastHardwareZoom(true);
        }
      }

      function refreshTrackZoomCaps() {
        const track = getTrack();
        zoom.hardware = false;
        zoom.hwMin = 1;
        zoom.hwMax = 1;
        if (track && typeof track.getCapabilities === "function") {
          const caps = track.getCapabilities();
          if (caps && caps.zoom) {
            zoom.hardware = true;
            zoom.hwMin = caps.zoom.min;
            zoom.hwMax = caps.zoom.max;
          }
        }
      }

      async function openStream(constraints) {
        return navigator.mediaDevices.getUserMedia(constraints);
      }

      async function switchToLens(lens, options) {
        options = options || {};
        if (!lens) return false;
        if (currentLens && currentLens.deviceId === lens.deviceId) {
          currentLens = lens;
          return false;
        }

        // 探测未通过时，禁止在拍摄中切镜头，避免黑屏
        if (!options.force && !supportLensSwitch) {
          return false;
        }

        const token = ++switchToken;
        switchingLens = true;
        const prev = stream;

        try {
          const constraints = {
            audio: false,
            video: lens.deviceId
              ? {
                  deviceId: { exact: lens.deviceId },
                  width: { ideal: 1920 },
                  height: { ideal: 1080 },
                }
              : {
                  facingMode: { ideal: "environment" },
                  width: { ideal: 1920 },
                  height: { ideal: 1080 },
                },
          };

          let nextStream;
          try {
            nextStream = await openStream(constraints);
          } catch (_) {
            throw new Error("无法打开目标镜头");
          }

          if (token !== switchToken) {
            nextStream.getTracks().forEach(function (t) { t.stop(); });
            return false;
          }

          stream = nextStream;
          video.srcObject = stream;
          try {
            await video.play();
          } catch (playErr) {
            nextStream.getTracks().forEach(function (t) { t.stop(); });
            stream = prev;
            video.srcObject = prev;
            if (prev) await video.play().catch(function () {});
            throw playErr;
          }

          if (prev && prev !== stream) {
            prev.getTracks().forEach(function (t) { t.stop(); });
          }

          currentLens = lens;
          refreshTrackZoomCaps();
          video.style.transform = "none";
          zoom.digital = 1;

          if (options.notify !== false) {
            toastHardware("硬件：已切换" + lensCaption(lens));
          }
          return true;
        } catch (err) {
          if (prev && !stream) {
            stream = prev;
            video.srcObject = prev;
          }
          return false;
        } finally {
          if (token === switchToken) switchingLens = false;
        }
      }

      function logicalToHardwareZoom(logicalZoom, lens) {
        const base = (lens && lens.base) || 1;
        const relative = logicalZoom / base;
        if (!zoom.hardware) return relative;
        return clamp(relative, zoom.hwMin, zoom.hwMax);
      }

      function setDigitalZoomVisual(factor, animate) {
        // 只允许放大，禁止 scale<1，否则会出现黑框
        const z = Math.max(1, factor);
        zoom.digital = z;
        video.classList.toggle("dragging", !animate);
        video.style.transform = z > 1.001 ? "scale(" + z + ")" : "none";
      }

      async function applyLogicalZoom(logicalZoom, options) {
        options = options || {};
        const animate = !!options.animate;
        const quiet = !!options.quiet;
        const fromDial = !!options.fromDial;
        zoom.value = clamp(logicalZoom, zoom.min, zoom.max);
        if (!fromDial) {
          syncDialRotationFromZoom();
        }

        // 仅当探测确认可切镜头时才切换
        if (supportLensSwitch) {
          const target = pickLensForZoom(zoom.value, currentLens);
          if (target && (!currentLens || target.deviceId !== currentLens.deviceId)) {
            try {
              await switchToLens(target, { notify: !quiet });
            } catch (_) {}
          }
        }

        const track = getTrack();
        const hwZoom = logicalToHardwareZoom(zoom.value, currentLens);

        if (supportZoom && zoom.hardware && track) {
          setDigitalZoomVisual(1, animate);
          try {
            await track.applyConstraints({ advanced: [{ zoom: hwZoom }] });
            if (!quiet) {
              toastHardwareZoom(!!animate || !!options.forceHwToast);
            }
          } catch (_) {
            zoom.hardware = false;
            supportZoom = false;
            setDigitalZoomVisual(Math.max(1, zoom.value), animate);
          }
        } else {
          // 纯数字变焦：始终 >= 1x 放大裁切，避免黑框
          setDigitalZoomVisual(Math.max(1, zoom.value), animate);
        }

        updateZoomUI();
        drawDial();
      }

      function nearestPreset(value) {
        let best = zoom.presets[0];
        let bestDist = Math.abs(value - best);
        zoom.presets.forEach(function (preset) {
          const dist = Math.abs(value - preset);
          if (dist < bestDist) {
            best = preset;
            bestDist = dist;
          }
        });
        return best;
      }

      function renderZoomButtons() {
        zoomBar.innerHTML = "";
        zoom.presets.forEach(function (preset) {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "zoom-btn";
          btn.dataset.zoom = String(preset);
          btn.textContent = formatZoomLabel(preset) + "x";
          btn.addEventListener("click", function (event) {
            event.stopPropagation();
            applyLogicalZoom(preset, { animate: true });
          });
          zoomBar.appendChild(btn);
        });
        updateZoomUI();
      }

      function updateZoomUI() {
        zoomReadout.textContent = formatZoomLabel(zoom.value) + "x";
        const mode = zoom.hardware
          ? "系统变焦"
          : lenses.length > 1
            ? lensCaption(currentLens)
            : "数字变焦";
        lensHint.textContent = mode + " · " + capabilityNote;

        const activePreset = nearestPreset(zoom.value);
        const showExact = Math.abs(zoom.value - activePreset) > 0.06;

        Array.prototype.forEach.call(
          zoomBar.querySelectorAll(".zoom-btn"),
          function (btn) {
            const preset = Number(btn.dataset.zoom);
            const isActive = Math.abs(preset - activePreset) < 0.01;
            btn.classList.toggle("active", isActive);
            btn.textContent =
              isActive && showExact
                ? formatZoomLabel(zoom.value) + "x"
                : formatZoomLabel(preset) + "x";
          }
        );
      }

      // -------- 转盘：圆弧向上；指针固定在正上方；转动的是刻度盘 --------
      const DIAL_SPAN = Math.PI * 0.95;

      function zoomToT(z) {
        return Math.log(z / zoom.min) / Math.log(zoom.max / zoom.min);
      }

      function tToZoom(t) {
        return zoom.min * Math.pow(zoom.max / zoom.min, clamp(t, 0, 1));
      }

      function syncDialRotationFromZoom() {
        // t=0 → 旋转 0；t=1 → 旋转 -DIAL_SPAN，使当前倍率对准正上方指针
        dialRotation = -zoomToT(zoom.value) * DIAL_SPAN;
      }

      function dialGeometry() {
        const w = dialCanvas.width;
        const h = dialCanvas.height;
        return {
          w: w,
          h: h,
          cx: w / 2,
          // 圆心在下方，弧向上凸
          cy: h * 0.92,
          radius: Math.min(w * 0.42, h * 0.78),
        };
      }

      function drawDial() {
        const g = dialGeometry();
        const ctx = dialCtx;
        ctx.clearRect(0, 0, g.w, g.h);

        // 可视窗口：上半圆弧
        ctx.save();
        ctx.beginPath();
        ctx.rect(0, 0, g.w, g.h * 0.88);
        ctx.clip();

        ctx.translate(g.cx, g.cy);
        ctx.rotate(dialRotation);

        // 背景弧（上半圆：从左到右，顺时针经上方）
        ctx.beginPath();
        ctx.arc(0, 0, g.radius, Math.PI, 0, true);
        ctx.lineWidth = 12;
        ctx.strokeStyle = "rgba(255,255,255,0.16)";
        ctx.stroke();

        // 刻度（绕上半圆均匀分布，随盘旋转）
        const tickCount = 48;
        for (let i = 0; i <= tickCount; i++) {
          const t = i / tickCount;
          // 本地角：PI → 0 经上方（clockwise from left to right via top = true means...)
          // angle from PI to 0 going clockwise: ang = PI - t * PI
          const ang = Math.PI - t * Math.PI;
          const major = i % 6 === 0;
          const r1 = g.radius - (major ? 20 : 11);
          const r2 = g.radius + (major ? 8 : 3);
          const x1 = Math.cos(ang) * r1;
          const y1 = Math.sin(ang) * r1;
          const x2 = Math.cos(ang) * r2;
          const y2 = Math.sin(ang) * r2;
          ctx.beginPath();
          ctx.moveTo(x1, y1);
          ctx.lineTo(x2, y2);
          ctx.lineWidth = major ? 3 : 2;
          ctx.strokeStyle = major
            ? "rgba(255,255,255,0.62)"
            : "rgba(255,255,255,0.28)";
          ctx.stroke();
        }

        // 预设倍率刻度文字（画在盘上，随盘转）
        zoom.presets.forEach(function (preset) {
          const t = zoomToT(preset);
          const ang = Math.PI - t * Math.PI;
          const x = Math.cos(ang) * (g.radius + 28);
          const y = Math.sin(ang) * (g.radius + 28);
          ctx.save();
          ctx.translate(x, y);
          ctx.rotate(ang + Math.PI / 2);
          ctx.fillStyle = "rgba(255,255,255,0.78)";
          ctx.font = "24px -apple-system, sans-serif";
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillText(formatZoomLabel(preset) + "x", 0, 0);
          ctx.restore();
        });

        ctx.restore();

        // 固定指针：始终朝向正上方（屏幕 12 点方向）
        ctx.save();
        ctx.translate(g.cx, g.cy);
        ctx.strokeStyle = "#f5d76e";
        ctx.fillStyle = "#f5d76e";
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(0, -18);
        ctx.lineTo(0, -g.radius + 6);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(-8, -g.radius + 22);
        ctx.lineTo(0, -g.radius + 4);
        ctx.lineTo(8, -g.radius + 22);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      }

      function pointerAngle(clientX, clientY) {
        const rect = dialCanvas.getBoundingClientRect();
        const g = dialGeometry();
        const x = ((clientX - rect.left) / rect.width) * g.w;
        const y = ((clientY - rect.top) / rect.height) * g.h;
        return Math.atan2(y - g.cy, x - g.cx);
      }

      function normalizeDelta(delta) {
        while (delta > Math.PI) delta -= Math.PI * 2;
        while (delta < -Math.PI) delta += Math.PI * 2;
        return delta;
      }

      function onDialPointerDown(event) {
        if (!stream) return;
        dialDragging = true;
        dialWrap.setPointerCapture(event.pointerId);
        dragStartAngle = pointerAngle(event.clientX, event.clientY);
        dragStartRotation = dialRotation;
      }

      function onDialPointerMove(event) {
        if (!dialDragging) return;
        const ang = pointerAngle(event.clientX, event.clientY);
        const delta = normalizeDelta(ang - dragStartAngle);
        // 拖盘：手指往哪边搓，刻度盘跟着转（指针不动）
        dialRotation = dragStartRotation - delta;

        // 指针固定在正上方；盘旋转后，正上方对应的 t
        const t = clamp(-dialRotation / DIAL_SPAN, 0, 1);
        applyLogicalZoom(tToZoom(t), { animate: false, fromDial: true });
      }

      function onDialPointerUp(event) {
        if (!dialDragging) return;
        dialDragging = false;
        try {
          dialWrap.releasePointerCapture(event.pointerId);
        } catch (_) {}
        video.classList.remove("dragging");
        syncDialRotationFromZoom();
        drawDial();
        flushHardwareZoomToast();
        updateZoomUI();
      }

      function touchDistance(touches) {
        const dx = touches[0].clientX - touches[1].clientX;
        const dy = touches[0].clientY - touches[1].clientY;
        return Math.hypot(dx, dy);
      }

      function onTouchStart(event) {
        if (event.touches.length === 2 && stream) {
          pinchActive = true;
          pinchStartDistance = touchDistance(event.touches);
          pinchStartZoom = zoom.value;
          video.classList.add("dragging");
        }
      }

      function onTouchMove(event) {
        if (!pinchActive || event.touches.length !== 2) return;
        event.preventDefault();
        const distance = touchDistance(event.touches);
        if (pinchStartDistance <= 0) return;
        applyLogicalZoom(pinchStartZoom * (distance / pinchStartDistance), {
          animate: false,
        });
      }

      function onTouchEnd(event) {
        if (event.touches.length < 2) {
          pinchActive = false;
          video.classList.remove("dragging");
          flushHardwareZoomToast();
          updateZoomUI();
        }
      }

      async function startCamera() {
        if (stream) return;
        if (starting) return;
        starting = true;

        try {
          if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            throw new Error("当前浏览器不支持相机");
          }
          if (!isSecureEnough()) {
            throw new Error("需要 HTTPS 才能使用相机");
          }

          gate.classList.remove("show");
          probe.classList.add("show");
          probeEnter.hidden = true;
          probeList.hidden = true;
          probeStatus.textContent = "已请求相机权限，请在系统弹窗中允许…";

          // 1) 先拿到权限与预览流
          try {
            stream = await openStream({
              audio: false,
              video: {
                facingMode: { ideal: "environment" },
                width: { ideal: 1920 },
                height: { ideal: 1080 },
                zoom: true,
              },
            });
          } catch (_) {
            try {
              stream = await openStream({
                audio: false,
                video: {
                  facingMode: { ideal: "environment" },
                  width: { ideal: 1920 },
                  height: { ideal: 1080 },
                },
              });
            } catch (err2) {
              stream = await openStream({ audio: false, video: true });
            }
          }

          video.srcObject = stream;
          await video.play();

          // 2) 用户已同意后，专门检测 zoom / 切镜头
          probeStatus.textContent = "权限已获取，正在检测系统变焦与镜头切换…";
          const report = await runCapabilityProbe();
          showProbeResult(report);
        } catch (err) {
          probe.classList.remove("show");
          gate.classList.add("show");
          if (stream) {
            stream.getTracks().forEach(function (t) { t.stop(); });
            stream = null;
          }
          throw err;
        } finally {
          starting = false;
        }
      }

      async function runCapabilityProbe() {
        probeStatus.textContent = "检测后置摄像头列表…";
        await discoverLenses();

        const wide =
          lenses.find(function (l) { return l.kind === "wide"; }) || lenses[0];
        if (wide) {
          try {
            await switchToLens(wide, { notify: false, force: true });
          } catch (_) {
            currentLens = wide;
            refreshTrackZoomCaps();
          }
        } else {
          refreshTrackZoomCaps();
        }

        // --- 检测系统 zoom ---
        probeStatus.textContent = "检测系统变焦（zoom）…";
        supportZoom = false;
        const track = getTrack();
        refreshTrackZoomCaps();

        if (zoom.hardware && track) {
          try {
            const settings =
              typeof track.getSettings === "function" ? track.getSettings() : {};
            const current =
              typeof settings.zoom === "number" ? settings.zoom : zoom.hwMin;
            const delta = Math.max(
              zoom.hwMax > zoom.hwMin ? (zoom.hwMax - zoom.hwMin) * 0.02 : 0,
              0.01
            );
            const testZoom = clamp(current + delta, zoom.hwMin, zoom.hwMax);
            await track.applyConstraints({ advanced: [{ zoom: testZoom }] });
            await track.applyConstraints({ advanced: [{ zoom: current }] });
            supportZoom = true;
          } catch (_) {
            supportZoom = false;
            zoom.hardware = false;
          }
        }

        // --- 检测能否切换另一颗后置镜头 ---
        probeStatus.textContent = "检测是否可切换物理镜头…";
        supportLensSwitch = false;

        const candidates = allBackCameras.filter(function (d) {
          return !currentLens || d.deviceId !== currentLens.deviceId;
        });

        // 只有 label 能区分，或存在明显不同 device 时才尝试实切
        const tryList = lenses.length > 1
          ? lenses.filter(function (l) {
              return !currentLens || l.deviceId !== currentLens.deviceId;
            })
          : [];

        if (tryList.length) {
          const target = tryList[0];
          const beforeId = currentLens && currentLens.deviceId;
          try {
            await switchToLens(target, { notify: false, force: true });
            const afterTrack = getTrack();
            const afterSettings =
              afterTrack && typeof afterTrack.getSettings === "function"
                ? afterTrack.getSettings()
                : {};
            const afterId = afterSettings.deviceId || (currentLens && currentLens.deviceId);
            supportLensSwitch = !!(afterId && beforeId && afterId !== beforeId);

            // 切回主摄
            if (wide) {
              await switchToLens(wide, { notify: false, force: true });
            }
          } catch (_) {
            supportLensSwitch = false;
            if (wide) {
              try {
                await switchToLens(wide, { notify: false, force: true });
              } catch (err2) {}
            }
          }
        } else if (candidates.length >= 1) {
          // 有多个后置 device，但 label 无法分类：尝试实切第二个
          const other = candidates[0];
          const beforeTrack = getTrack();
          const beforeSettings =
            beforeTrack && typeof beforeTrack.getSettings === "function"
              ? beforeTrack.getSettings()
              : {};
          const beforeId = beforeSettings.deviceId || (currentLens && currentLens.deviceId);
          try {
            const nextStream = await openStream({
              audio: false,
              video: {
                deviceId: { exact: other.deviceId },
                width: { ideal: 1920 },
                height: { ideal: 1080 },
              },
            });
            const prev = stream;
            stream = nextStream;
            video.srcObject = stream;
            await video.play();
            if (prev) prev.getTracks().forEach(function (t) { t.stop(); });

            const afterTrack = getTrack();
            const afterSettings =
              afterTrack && typeof afterTrack.getSettings === "function"
                ? afterTrack.getSettings()
                : {};
            const afterId = afterSettings.deviceId;
            supportLensSwitch = !!(afterId && beforeId && afterId !== beforeId);

            // 切回原来的
            if (beforeId) {
              try {
                const back = await openStream({
                  audio: false,
                  video: {
                    deviceId: { exact: beforeId },
                    width: { ideal: 1920 },
                    height: { ideal: 1080 },
                  },
                });
                const old = stream;
                stream = back;
                video.srcObject = stream;
                await video.play();
                if (old) old.getTracks().forEach(function (t) { t.stop(); });
              } catch (_) {}
            }
            refreshTrackZoomCaps();
            if (wide) currentLens = wide;
          } catch (_) {
            supportLensSwitch = false;
          }
        }

        const report = describeCapabilities();
        report.supportZoom = supportZoom;
        report.supportLensSwitch = supportLensSwitch;
        report.backCount = allBackCameras.length;
        report.classifiedLenses = lenses.length;
        return report;
      }

      function showProbeResult(report) {
        // 无超广硬件时，数字变焦不提供 .5（会缩画面出黑框）
        const canUltra =
          report.supportLensSwitch ||
          (report.supportZoom && zoom.hwMin < 0.99);
        zoom.min = canUltra ? 0.5 : 1;
        zoom.max = Math.max(zoom.max, 5);
        zoom.presets = buildPresets(zoom.min, zoom.max, canUltra ? lenses : []);
        if (!canUltra) {
          // buildPresets 在 min=1 时仍可能因 lensList 加 .5，强制清洗
          zoom.presets = zoom.presets.filter(function (p) {
            return p >= 0.99;
          });
          if (zoom.presets.indexOf(1) < 0) zoom.presets.unshift(1);
        }

        probeStatus.textContent = "检测完成";
        probeList.hidden = false;
        probeList.innerHTML =
          '<li><span class="label">系统变焦 zoom</span><span class="' +
          (report.supportZoom ? "ok" : "no") +
          '">' +
          (report.supportZoom ? "支持" : "不支持") +
          "</span></li>" +
          '<li><span class="label">切换物理镜头</span><span class="' +
          (report.supportLensSwitch ? "ok" : "no") +
          '">' +
          (report.supportLensSwitch ? "支持" : "不支持") +
          "</span></li>" +
          '<li><span class="label">后置摄像头数量</span><span class="label">' +
          report.backCount +
          "</span></li>" +
          '<li><span class="label">将使用</span><span class="label">' +
          (report.supportZoom || report.supportLensSwitch
            ? "尽量走硬件，其余数字变焦"
            : "数字变焦（1x–5x）") +
          "</span></li>";

        capabilityNote =
          "zoom " +
          (report.supportZoom ? "✓" : "✗") +
          " · 切镜头 " +
          (report.supportLensSwitch ? "✓" : "✗") +
          " · 后置 " +
          report.backCount;

        probeEnter.hidden = false;
        probePassed = true;
      }

      async function enterShootMode() {
        probe.classList.remove("show");
        shutter.disabled = false;
        zoomStack.classList.add("show");
        video.style.transform = "none";
        zoom.digital = 1;
        zoom.value = clamp(1, zoom.min, zoom.max);
        renderZoomButtons();
        await applyLogicalZoom(zoom.value, { animate: true, quiet: true });
        syncDialRotationFromZoom();
        updateZoomUI();
        drawDial();

        if (supportZoom || supportLensSwitch) {
          toastHardware(
            "检测结果：zoom " +
              (supportZoom ? "支持" : "不支持") +
              "，切镜头 " +
              (supportLensSwitch ? "支持" : "不支持")
          );
        } else {
          showToast("未检测到硬件变焦/切镜头，将使用数字变焦", "err");
        }
      }

      function captureFrame() {
        const width = video.videoWidth;
        const height = video.videoHeight;
        if (!width || !height) throw new Error("画面还没就绪");

        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext("2d");

        if (zoom.digital <= 1.001) {
          ctx.drawImage(video, 0, 0, width, height);
        } else {
          const cropW = width / zoom.digital;
          const cropH = height / zoom.digital;
          const sx = (width - cropW) / 2;
          const sy = (height - cropH) / 2;
          ctx.drawImage(video, sx, sy, cropW, cropH, 0, 0, width, height);
        }
        return canvas;
      }

      function canvasToBlob(sourceCanvas) {
        return new Promise(function (resolve, reject) {
          sourceCanvas.toBlob(
            function (blob) {
              if (blob) resolve(blob);
              else reject(new Error("生成图片失败"));
            },
            "image/jpeg",
            0.92
          );
        });
      }

      function downloadBlob(blob, filename) {
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = filename;
        a.rel = "noopener";
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(function () {
          URL.revokeObjectURL(url);
        }, 1500);
      }

      async function savePhoto(blob, filename) {
        const file = new File([blob], filename, { type: "image/jpeg" });
        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          await navigator.share({ files: [file] });
          return;
        }
        downloadBlob(blob, filename);
        showToast(isIOS() ? "请用分享菜单存到照片" : "已下载", "ok");
      }

      async function onShutter() {
        if (capturing || switchingLens) return;
        if (!stream) {
          try {
            await startCamera();
          } catch (err) {
            showToast(err.message || "无法打开相机", "err");
          }
          return;
        }

        capturing = true;
        shutter.disabled = true;
        blinkFlash();
        try {
          const blob = await canvasToBlob(captureFrame());
          const name =
            "doyen-" +
            new Date().toISOString().replace(/[:.]/g, "-") +
            ".jpg";
          await savePhoto(blob, name);
        } catch (err) {
          if (err && err.name === "AbortError") showToast("未保存");
          else showToast((err && err.message) || "拍照失败", "err");
        } finally {
          capturing = false;
          shutter.disabled = false;
        }
      }

      async function onGateTap() {
        try {
          await startCamera();
        } catch (err) {
          showToast(err.message || "无法打开相机", "err");
        }
      }

      async function tryAutostart() {
        try {
          if (navigator.permissions && navigator.permissions.query) {
            const status = await navigator.permissions.query({ name: "camera" });
            if (status.state === "granted") {
              await startCamera();
              return;
            }
            if (status.state === "denied") {
              showToast("请在设置里允许相机权限", "err");
              return;
            }
          }
        } catch (_) {}
        try {
          await startCamera();
        } catch (_) {}
      }

      gate.addEventListener("click", onGateTap);
      shutter.addEventListener("click", onShutter);
      probeEnter.addEventListener("click", function () {
        enterShootMode().catch(function (err) {
          showToast((err && err.message) || "无法进入拍摄", "err");
        });
      });

      dialWrap.addEventListener("pointerdown", onDialPointerDown);
      dialWrap.addEventListener("pointermove", onDialPointerMove);
      dialWrap.addEventListener("pointerup", onDialPointerUp);
      dialWrap.addEventListener("pointercancel", onDialPointerUp);

      const app = document.getElementById("app");
      app.addEventListener("touchstart", onTouchStart, { passive: true });
      app.addEventListener("touchmove", onTouchMove, { passive: false });
      app.addEventListener("touchend", onTouchEnd);
      app.addEventListener("touchcancel", onTouchEnd);

      window.addEventListener("resize", drawDial);
      document.addEventListener("visibilitychange", function () {
        if (document.hidden || !stream) return;
        video.play().catch(function () {});
      });

      tryAutostart();
    })();
  </script>
</body>
</html>
